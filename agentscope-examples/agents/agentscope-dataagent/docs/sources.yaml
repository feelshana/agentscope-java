# Derived tables. SQL is data too; the loader just executes what is declared
# here in order, after every batch has landed.
derived:
  - table: project_membership
    sql: |
      WITH RECURSIVE split AS (
        SELECT user_id,
               TRIM(SUBSTRING_INDEX(COALESCE(projects_raw, ''), ',', 1)) AS membership_raw,
               CASE WHEN LOCATE(',', COALESCE(projects_raw, '')) > 0
                    THEN SUBSTRING(COALESCE(projects_raw, ''), LOCATE(',', COALESCE(projects_raw, '')) + 1)
                    ELSE '' END AS rest
        FROM app_user
        UNION ALL
        SELECT user_id,
               TRIM(SUBSTRING_INDEX(rest, ',', 1)),
               CASE WHEN LOCATE(',', rest) > 0
                    THEN SUBSTRING(rest, LOCATE(',', rest) + 1)
                    ELSE '' END
        FROM split
        WHERE rest <> ''
      )
      SELECT s.user_id, s.membership_raw, p.project_id
      FROM split s
      LEFT JOIN project p ON p.project_name = s.membership_raw
      WHERE s.membership_raw <> ''

  # Identity resolution kept explicit and inspectable. Accounts that never
  # appear in the user list stay in their own namespace instead of being
  # dropped or fuzzily merged into a known person.
  - table: user_identity
    sql: |
      SELECT account, user_id, 'user_list' AS identity_source FROM app_user
      UNION
      SELECT account, CONCAT('unknown:', account) AS user_id, 'unmatched_account' AS identity_source
      FROM (
        SELECT DISTINCT account FROM click_observation
        UNION SELECT DISTINCT account FROM report_visit
      ) seen
      WHERE account NOT IN (SELECT account FROM app_user)

  # The queryable User grain. Accounts seen in events but absent from the user
  # list stay visible under their own identity namespace so headcounts can
  # disclose them instead of silently dropping them.
  - table: user_object
    sql: |
      SELECT u.user_id, u.account, u.company, u.department, u.position,
             'user_list' AS identity_source
      FROM app_user u
      UNION ALL
      SELECT i.user_id, i.account, NULL, NULL, NULL, 'unmatched_account'
      FROM user_identity i
      WHERE i.identity_source = 'unmatched_account'

  - table: organization
    sql: |
      SELECT CONCAT(COALESCE(company, ''), '|', COALESCE(department, '')) AS org_key,
             company, department, COUNT(*) AS member_count
      FROM app_user
      GROUP BY 1, 2, 3

  - table: module
    sql: |
      SELECT DISTINCT module_name, product
      FROM click_observation
      WHERE module_name IS NOT NULL AND module_name <> ''

  - table: report_asset
    sql: |
      SELECT DISTINCT
             CONCAT(project_name, '|', asset_type, '|', COALESCE(directory, ''), '|', asset_name) AS asset_key,
             asset_name, directory, asset_type, project_name
      FROM report_visit
      WHERE asset_name IS NOT NULL
