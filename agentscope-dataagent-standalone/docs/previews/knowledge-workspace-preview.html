<style>

ht:29px}.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:20px}.search{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:7px;padding:8px 11px;width:290px;color:var(--muted)}.search svg{width:15px;height:15px}.search input{border:0;outline:none;min-width:0;width:100%;font-size:12px;background:transparent}.count{font-size:11px;color:var(--muted)}.spacer{flex:1}.select{border:1px solid var(--line);padding:8px 11px;border-radius:7px;background:white;font-size:11px;color:var(--secondary)}.viewtoggle{display:flex;border:1px solid var(--line);border-radius:7px;padding:3px}.viewtoggle button{padding:4px 7px;display:flex;color:var(--muted);border-radius:4px}.viewtoggle button.selected{background:#f0edf9;color:var(--purple)}.viewtoggle svg{width:15px;height:15px}.kbgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.kbcard{border:1px solid var(--line);border-radius:12px;padding:21px 21px 0;transition:border-color .15s,box-shadow .15s;position:relative;background:white}.kbcard:hover{border-color:#c9c3e7;box-shadow:0 5px 18px #20242d06}.cardtop{display:flex;align-items:center;gap:11px}.kbicon{width:38px;height:38px;border:1px solid #e8e4f5;background:#f6f4fc;color:#786ab4;border-radius:10px;display:grid;place-items:center}.kbicon svg{width:20px;height:20px}.cardtop h2{font-size:15px;font-weight:600;margin:0;flex:1;min-width:0}.more{display:grid;place-items:center;color:var(--muted);width:28px;height:28px;border-radius:5px}.more:hover{background:#f4f5f8}.description{font-size:12px;color:var(--secondary);line-height:1.8;height:44px;margin:17px 0 20px}.cardmeta{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:8px;margin-bottom:18px}.cardmeta svg{width:13px;height:13px}.cardfoot{border-top:1px solid #f0f1f5;display:flex;align-items:center;justify-content:space-between;padding:12px 0}.cardfoot a{font-size:11px;color:var(--secondary)}.cardfoot button{display:flex;gap:6px;align-items:center;font- x;border-radius:8px;box-shadow:0 8px 24px #1b213018;z-index:8}.popup button{display:block;width:100%;text-align:left;padding:9px;font-size:11px;border-radius:4px}.popup button:hover{background:#f5f6fa}.danger{color:#c95158!important}.empty{padding:60px 20px;text-align:center;color:var(--secondary);font-size:12px}.datasethead{display:flex;align-items:center;gap:13px}.datasethead .kbicon{width:45px;height:45px}.datasethead h1{margin-bottom:6px}.technical{max-width:880px;border:1px solid var(--line);border-radius:10px;padding:6px 22px}.technical div{display:grid;grid-template-columns:140px 1fr;gap:20px;padding:18px 0;font-size:12px;border-bottom:1px solid var(--line)}.technical div:last-child{border-bottom:0}.technical span:first-child{color:var(--muted)}code{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:#6f668a;word-break:break-all}.previewtable th{min-width:120px;padding:12px 16px;position:sticky;top:0;z-index:1;border-right:1px solid #eef0f4}.previewtable td{padding:13px 16px;border-right:1px solid #f0f2f6;font-variant-numeric:tabular-nums}.previewtable .rownum{min-width:44px;width:44px;background:#fafbfc;color:#a0a6b0;text-align:center;font-size:10px;position:sticky;left:0}.previewtable th small{display:block;color:#a3a9b4;font-size:10px;font-weight:400;margin-top:4px}.type{background:#f3f1fb;color:#7c6eac;font:10px ui-monospace,monospace;padding:4px 6px;border-radius:4px}.graphpanel{border:1px solid var(--line);border-radius:10px;min-height:340px;display:flex;flex-direction:column;justify-content:center;align-items:center;background:radial-gradient(#dddfe7 .7px,transparent .7px);background-size:16px 16px;gap:22px}.graphnodes{display:flex;gap:36px;align-items:center}.node{background:white;border:1px solid #d9d4ee;border-radius:8px;box-shadow:0 3px 10px #22222205;padding:17px 28px;font-size:12px}.graphpanel p{font-size:11px;color:var(--muted);background:white;padding:5px}.modalback{position:fixed;inset:0;background:#18203340;z-index:30;display:grid;place-items:center;padding:24px}.modal{background:white;width:500px;max-width:100%;border-radius:14px;box-shadow:0 20px 80px #1a223033;padding:25px}.modal h2{font-size:18px;margin:0 0 8px}.modal p{font-size:12px;color:var(--secondary);line-height:1.8}.modal label{display:block;font-size:12px;color:var(--secondary);margin:19px 0 8px}.modal input,.modal textarea{width:100%;border:1px solid #dfe3eb;border-radius:7px;padding:10px;outline-color:#bbb0f3;font-size:12px}.modal textarea{min-height:80px;resize:vertical}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:23px}.dropzone{border:1px dashed #c8c4dd;border-radius:9px;padding:32px;text-align:center;background:#faf9fd;color:var(--secondary);font-size:12px;margin-top:20px;line-height:2}.toast{position:fixed;bottom:25px;left:calc(50% + 118px);transform:translateX(-50%);background:#303442;color:white;padding:12px 20px;border-radius:8px;box-shadow:0 6px 24px #20242d22;font-size:12px;z-index:50}.status{color:var(--green);display:inline-flex;align-items:center;gap:5px;font-size:11px}.status:before{content:'';width:5px;height:5px;background:#4d9b78;border-radius:50%}.subtitle{font-size:12px;color:var(--secondary);line-height:1.8;margin:14px 0 20px}.kbrows .kbcard{display:flex;align-items:center;gap:25px;padding:16px 20px}.kbrows .cardtop{width:210px;flex-shrink:0}.kbrows .description{flex:1;height:auto;margin:0}.kbrows .cardmeta{margin:0}.kbrows .cardfoot{border:0;gap:22px;padding:0}.kbrows{display:flex;flex-direction:column;gap:12px}[hidden]{display:none!important}@media(min-width:1700px){.kbgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:1150px){.sidebar{width:205px}.main{margin-left:205px}.content{padding:28px 24px}.topbar{padding:0 24px}.kbgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.kbrows .description{display:none}.pagehead{flex-wrap:wrap}.toast{left:50%}}@media(max-width:760px){.sidebar{display:none}.main{margin-left:0}.topbar{height:auto;min-height:66px;padding:14px 18px;flex-wrap:wrap}.content{padding:25px 18px}.kbgrid{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}.search{width:100%}.tabs{gap:20px;overflow:auto}.tabs button{white-space:nowrap}.heading h1{font-size:23px}.kbrows .kbcard{flex-wrap:wrap}.kbrows .cardtop{width:auto;flex:1}.kbrows .cardmeta{display:none}.actions{flex-wrap:wrap}.technical div{grid-template-columns:100px 1fr}.graphnodes{gap:12px}.node{padding:14px}}
</style>

<div class="app">
<aside class="sidebar"><div class="brand"><div class="logo">DA</div><div><strong>红海DataAgent</strong><small>企业级数据智能体</small></div></div>
<nav class="nav"><button onclick="notice('本预览聚焦知识库三个页面')"><svg><use href="#i-plus"/></svg>新建对话</button><button class="active" onclick="navigate('list')"><svg><use href="#i-book"/></svg>知识库</button><button onclick="notice('业务术语页面不在本次预览范围')"><svg><use href="#i-graph"/></svg>业务术语</button><button onclick="notice('例行任务页面不在本次预览范围')"><svg><use href="#i-clock"/></svg>例行任务</button><button onclick="notice('本次仅预览知识库工作台')"><svg><use href="#i-more"/></svg>更多</button></nav>
<div class="history"><div class="history-label"><span>最近对话</span><span>···</span></div><button onclick="notice('示例历史，不会读取真实会话')">分析各销售渠道的 GMV 占比</button><button onclick="notice('示例历史，不会读取真实会话')">上个月各品类销售额与订单数</button><button onclick="notice('示例历史，不会读取真实会话')">最近 30 天的订单量趋势</button><button onclick="notice('示例历史，不会读取真实会话')">对比高频与低频用户行为</button></div><div class="user"><div class="avatar">A</div>admin</div></aside>
<main class="main"><header class="topbar"><div class="crumbs" id="crumbs"></div><div class="preview-switch" aria-label="切换设计预览页面"><button data-page="list" onclick="navigate('list')">知识库列表</button><button data-page="kb" onclick="navigate('kb')">知识库详情</button><button data-page="dataset" onclick="navigate('dataset')">数据集详情</button></div></header><div class="content" id="content"></div></main>
</div><div id="modalhost"></div><div id="toasthost" aria-live="polite"></div>
<script>
const icon=n=>`<svg aria-hidden="true"><use href="#i-${n}"/></svg>`;
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kbs=[{name:'电商场景',desc:'订单、商品与客户数据，用于销售表现和用户行为分析。',count:4,date:'2026/10/06',icon:'book'},{name:'红海数据集',desc:'内部平台的访问与使用数据，支持模块渗透率及活跃度分析。',count:6,date:'2026/09/24',icon:'graph'},{name:'本地数据库',desc:'',count:3,date:'2026/10/09',icon:'db'},{name:'外接数据源',desc:'关联业务数据库，直接查询已接入的数据表。',count:3,date:'2026/09/24',icon:'db'}];
const datasets=[{name:'订单明细',rows:4339,cols:7,file:'订单明细.xlsx',desc:'记录订单中每个商品的购买数量、单价、金额及折扣率。'},{name:'商品',rows:100,cols:7,file:'商品.xlsx',desc:'商品名称、类目与价格信息。'},{name:'客户',rows:200,cols:7,file:'客户.xlsx',desc:'客户基础信息。'},{name:'订单',rows:1500,cols:6,file:'订单.xlsx',desc:'订单日期、状态与客户信息。'}];
let currentPage='list',kbIndex=0,datasetIndex=0,kbTab='数据集',datasetTab='数据预览',listMode='grid',toastTimer;
const content=document.getElementById('content');
function notice(msg){document.getElementById('toasthost').innerHTML=`<div class="toast">${escapeHtml(msg)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>document.getElementById('toasthost').innerHTML='',3200)}
function navigate(page){currentPage=page;closeModal();render();window.scrollTo(0,0);location.hash=page}
function openKB(i){kbIndex=i;kbTab='数据集';navigate('kb')}
function openDataset(i){datasetIndex=i;datasetTab='数据预览';navigate('dataset')}
function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('selected',b.dataset.page===currentPage));const kb=escapeHtml(kbs[kbIndex].name);document.getElementById('crumbs').innerHTML=currentPage==='list'?'<span class="current">知识库</span>':`<button onclick="navigate('list')">知识库</button>${icon('right')}${currentPage==='dataset'?`<button onclick="navigate('kb')">${kb}</button>${icon('right')}<span class="current">${escapeHtml(datasets[datasetIndex].name)}</span>`:`<span class="current">${kb}</span>`}`;if(currentPage==='list')renderList();else if(currentPage==='kb')renderKB();else renderDataset()}
function renderList(){content.innerHTML=`<div class="pagehead"><div class="heading"><h1>知识库</h1><p>组织你的业务数据，让每一次分析都有清晰的依据。</p></div><div class="actions"><button class="btn" onclick="showSources()">${icon('db')}数据源管理</button><button class="btn primary" onclick="showCreate()">${icon('plus')}创建知识库</button></div></div><div class="toolbar"><div class="search">${icon('search')}<input id="kbsearch" aria-label="搜索知识库" placeholder="搜索知识库名称或说明" oninput="filterCards()"></div><span class="count" id="kbcount"></span><div class="spacer"></div><select id="sort" class="select" aria-label="排序方式" onchange="filterCards()"><option value="date">最近创建</option><option value="name">名称排序</option></select><div class="viewtoggle"><button class="${listMode==='grid'?'selected':''}" title="卡片视图" aria-label="卡片视图" onclick="listMode='grid';renderList()">${icon('grid')}</button><button class="${listMode==='rows'?'selected':''}" title="列表视图" aria-label="列表视图" onclick="listMode='rows';renderList()">${icon('list')}</button></div></div><div id="cards"></div><div class="footnote">${icon('info')}设计预览 · 所有数据均为示例，页面操作不会连接真实服务。</div>`;filterCards()}
function filterCards(){const q=document.getElementById('kbsearch').value.trim().toLowerCase();let items=kbs.map((k,i)=>({...k,i})).filter(k=>(k.name+k.desc).toLowerCase().includes(q));items.sort(document.getElementById('sort').value==='name'?(a,b)=>a.name.localeCompare(b.name,'zh-CN'):(a,b)=>b.date.localeCompare(a.date));document.getElementById('kbcount').textContent=`${items.length} 个知识库`;document.getElementById('cards').className=listMode==='grid'?'kbgrid':'kbrows';document.getElementById('cards').innerHTML=items.length?items.map(k=>`<article class="kbcard"><div class="cardtop"><div class="kbicon">${icon(k.icon)}</div><h2><a style="color:inherit" onclick="openKB(${k.i})">${escapeHtml(k.name)}</a></h2><button class="more" aria-label="${escapeHtml(k.name)}的更多操作" onclick="showKBOptions(${k.i})">${icon('more')}</button></div><p class="description" style="${k.desc?'':'color:var(--muted)'}">${escapeHtml(k.desc||'暂无说明')}</p><div class="cardmeta">${icon('table')}<span>${k.count} 个数据集</span><span>·</span><span>${k.date}</span></div><div class="cardfoot"><a onclick="openKB(${k.i})">查看详情 →</a><button onclick="notice('预览：进入「${escapeHtml(k.name)}」的问答')">${icon('chat')}基于此库提问</button></div></article>`).join(''):'<div class="empty">没有匹配的知识库，试试其他关键词。</div>'}
function renderKB(){const k=kbs[kbIndex];content.innerHTML=`<div class="pagehead"><div class="heading"><div class="eyebrow">${icon('book')}知识库</div><h1>${escapeHtml(k.name)}</h1><p>${escapeHtml(k.desc||'为这个知识库补充说明，帮助你快速了解数据内容。')}</p><div class="infochips"><span>${icon('table')}${k.count} 个数据集</span><span>${icon('clock')}创建于 ${k.date}</span></div></div><div class="actions"><button class="btn quiet" onclick="showEditKB()">${icon('edit')}编辑信息</button><button class="btn primary" onclick="notice('预览：基于当前知识库创建对话')">${icon('chat')}基于此库提问</button></div></div><div class="tabs">${['数据集','知识图谱','树结构目录','语义建模'].map(t=>`<button class="${kbTab===t?'active':''}" onclick="kbTab='${t}';renderKB()">${t}${t==='数据集'?`<span class="badge">${k.count}</span>`:''}</button>`).join('')}</div><div id="kbbody"></div>`;const body=document.getElementById('kbbody');if(kbTab==='数据集'){body.innerHTML=`<div class="toolbar"><div class="search">${icon('search')}<input aria-label="搜索数据集" placeholder="搜索数据集" oninput="filterDatasets(this.value)"></div><div class="spacer"></div><button class="btn" onclick="showLink()">${icon('db')}关联数据源</button><button class="btn" onclick="showUpload()">${icon('upload')}上传文件</button></div><div class="tablebox"><div class="scrolltable"><table><thead><tr><th style="width:24%">数据集名称</th><th>来源</th><th class="numeric">行数</th><th class="numeric">字段数</th><th>来源文件</th><th class="end">操作</th></tr></thead><tbody id="datasetrows"></tbody></table></div><div class="tablebottom"><span>示例展示 4 个数据集</span><span>点击名称查看数据与字段</span></div></div>`;filterDatasets('')}else if(kbTab==='知识图谱'){body.innerHTML=`<div class="graphpanel"><div class="graphnodes"><div class="node">客户</div><span style="color:#a29cb8">──</span><div class="node">订单</div><span style="color:#a29cb8">──</span><div class="node">订单明细</div></div><p>关系图示意 · 本次只演示统一页签与工作区位置</p></div>`}else if(kbTab==='树结构目录'){body.innerHTML=`<div class="technical"><div><span>电商场景</span><span>订单明细 / 商品 / 客户 / 订单</span></div><div><span>目录说明</span><span>此页签用于组织数据，具体编辑交互保留到后续设计。</span></div></div>`}else{body.innerHTML=`<div class="tablebox"><div style="padding:25px"><h3 style="font-size:15px;margin:0 0 10px">语义模型</h3><p class="subtitle">组织字段含义与数据关系，为业务问答提供一致的分析口径。</p><button class="btn primary" onclick="notice('预览：进入现有语义建模工作区')">打开建模工作区 →</button></div></div>`}}
function filterDatasets(q){q=q.trim().toLowerCase();document.getElementById('datasetrows').innerHTML=datasets.map((d,i)=>({...d,i})).filter(d=>(d.name+d.file).toLowerCase().includes(q)).map(d=>`<tr><td><a class="namecell" onclick="openDataset(${d.i})">${icon('table')}${escapeHtml(d.name)}</a></td><td><span class="source">${icon('upload')}文件上传</span></td><td class="numeric">${d.rows.toLocaleString()}</td><td class="numeric">${d.cols}</td><td style="color:var(--muted)">${escapeHtml(d.file)}</td><td class="end"><button class="more" style="display:inline-grid" aria-label="${escapeHtml(d.name)}的更多操作" onclick="showDatasetOptions(${d.i})">${icon('more')}</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">没有匹配的数据集</td></tr>'}
const fields=[['item_id','明细编号','BIGINT','订单明细的唯一标识'],['order_id','订单编号','BIGINT','该明细所属的订单'],['product_id','商品编号','BIGINT','购买的商品标识'],['quantity','购买数量','BIGINT','每笔明细的商品数量'],['unit_price','单价','DECIMAL(18,6)','商品单位价格'],['amount','订单金额','DECIMAL(18,6)','该笔明细的订单金额'],['discount_rate','折扣率','DECIMAL(18,6)','例如 0.9 表示九折']];
const rows=Array.from({length:20},(_,i)=>[i+1,10001+Math.floor(i/5),[88,70,74,61,58,95,76,42,45,65][i%10],[2,1,3,5,1][i%5],[7310.11,7090.12,9158.32,2334.51,8036.57][i%5],[14620.22,7090.12,27474.96,11672.55,40182.85][i%5],[.9,.95,.95,.9,.85][i%5]]);
function renderDataset(){const d=datasets[datasetIndex];content.innerHTML=`<div class="pagehead"><div class="heading"><div class="datasethead"><div class="kbicon">${icon('table')}</div><div><h1>${escapeHtml(d.name)}</h1><p>文件上传的数据集</p></div></div><p style="margin-top:17px">${escapeHtml(d.desc)}</p><div class="infochips"><span>${icon('table')}${d.rows.toLocaleString()} 行</span><span>${d.cols} 个字段</span><span>${icon('upload')}${escapeHtml(d.file)}</span></div></div><div class="actions"><button class="btn" onclick="showEditDataset()">${icon('edit')}编辑信息</button></div></div><div class="tabs">${['数据预览','字段信息','技术信息'].map(t=>`<button class="${datasetTab===t?'active':''}" onclick="datasetTab='${t}';renderDataset()">${t}</button>`).join('')}</div><div id="datasetbody"></div>`;const body=document.getElementById('datasetbody');if(datasetTab==='数据预览'){body.innerHTML=`<div class="toolbar"><span style="font-size:12px;color:var(--secondary)">数据预览</span><span class="count">前 20 行 · 示例数据</span><div class="spacer"></div><span class="count">悬停字段查看描述 · 横向滚动查看全部字段</span></div><div class="tablebox"><div class="scrolltable" style="max-height:520px"><table class="previewtable"><thead><tr><th class="rownum">#</th>${fields.map(f=>`<th title="${f[3]} · ${f[2]}">${f[1]}<small>${f[0]}</small></th>`).join('')}</tr></thead><tbody>${rows.map((r,i)=>`<tr><td class="rownum">${i+1}</td>${r.map((v,j)=>`<td class="${j>2?'numeric':''}" title="原始值：${j>3?Number(v).toFixed(6):v}">${j===4||j===5?Number(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):j===6?Number(v).toFixed(2):v}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="tablebottom"><span>显示 20 行 / 共 ${d.rows.toLocaleString()} 行</span><span>金额按 2 位小数展示；悬停查看原始示例值</span></div></div>`}else if(datasetTab==='字段信息'){body.innerHTML=`<div class="toolbar"><span class="count">字段含义与类型集中管理，不占用数据预览表头。</span><div class="spacer"></div><button class="btn small" onclick="notice('预览：进入现有字段类型及描述编辑')">${icon('edit')}编辑字段</button></div><div class="tablebox"><div class="scrolltable"><table><thead><tr><th>字段名称</th><th>显示名称</th><th>数据类型</th><th>业务说明</th></tr></thead><tbody>${fields.map(f=>`<tr><td><code>${f[0]}</code></td><td>${f[1]}</td><td><span class="type">${f[2]}</span></td><td>${f[3]}</td></tr>`).join('')}</tbody></table></div></div>`}else{body.innerHTML=`<div class="technical"><div><span>所属知识库</span><a onclick="navigate('kb')">${escapeHtml(kbs[kbIndex].name)}</a></div><div><span>来源类型</span><span>文件上传</span></div><div><span>来源文件</span><span>${escapeHtml(d.file)}</span></div><div><span>物理库表</span><code>data_agent.ds_8c6976e5_1855577d_data</code></div><div><span>记录 / 字段</span><span>${d.rows.toLocaleString()} 行 / ${d.cols} 个字段</span></div></div>`}}
function modal(title,desc,body,footer=''){document.getElementById('modalhost').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-label="${escapeHtml(title)}"><h2>${escapeHtml(title)}</h2><p>${escapeHtml(desc)}</p>${body}<div class="modalfoot"><button class="btn" onclick="closeModal()">关闭</button>${footer}</div></section></div>`;document.querySelector('.modal input,.modal button')?.focus()}
function closeModal(){document.getElementById('modalhost').innerHTML=''}
function showCreate(){modal('创建知识库','预览中创建的内容只保存在当前页面，刷新后恢复。','<label for="newname">知识库名称</label><input id="newname" placeholder="例如：销售经营分析" maxlength="100"><label for="newdesc">说明</label><textarea id="newdesc" placeholder="简要说明包含的数据与适用场景"></textarea>','<button class="btn primary" onclick="createKB()">创建</button>')}
function createKB(){const name=document.getElementById('newname').value.trim();if(!name)return notice('请输入知识库名称');kbs.push({name,desc:document.getElementById('newdesc').value,count:0,date:'2026/10/09',icon:'book'});closeModal();navigate('list');notice('已创建预览知识库，未写入真实服务')}
function showUpload(){modal('上传数据文件','有数据的知识库将上传操作收进弹窗；首次空库可以显示上传引导。',`<div class="dropzone">${icon('upload')}<br>将 Excel / CSV 文件拖到这里<br><span style="font-size:11px;color:var(--muted)">效果预览，不实际上传文件</span></div>`)}
function showLink(){modal('关联数据源','示例：选择已接入的数据源，后续选择需要关联的数据表。','<div class="technical" style="padding:0 12px"><div><span>外接业务数据源</span><span class="status">已连接（示例）</span></div><div><span>本地数据库</span><span class="status">已连接（示例）</span></div></div>')}
function showSources(){modal('数据源管理','此入口管理数据库连接，知识库内的「关联数据源」使用已接入的连接。','<p>本次展示入口位置，不修改现有数据源管理表单。</p>')}
function showKBOptions(i){kbIndex=i;modal(kbs[i].name,'知识库的维护操作收进更多菜单。',`<button class="btn" onclick="showEditKB()">${icon('edit')}编辑名称和说明</button><button class="btn quiet danger" onclick="notice('预览：删除前需要确认，当前不删除')">删除知识库</button>`)}
function showEditKB(){const k=kbs[kbIndex];modal('编辑知识库','预览修改不会写入后端。',`<label for="editname">名称</label><input id="editname" value="${escapeHtml(k.name)}"><label for="editdesc">说明</label><textarea id="editdesc">${escapeHtml(k.desc)}</textarea>`,'<button class="btn primary" onclick="saveKB()">保存</button>')}
function saveKB(){const n=document.getElementById('editname').value.trim();if(!n)return notice('请输入名称');kbs[kbIndex].name=n;kbs[kbIndex].desc=document.getElementById('editdesc').value;closeModal();render();notice('已更新预览信息')}
function showDatasetOptions(i){datasetIndex=i;modal(datasets[i].name,'正常操作与危险操作分组，避免每行常驻红色删除按钮。',`<button class="btn" onclick="openDataset(${i})">查看数据集</button><button class="btn quiet danger" onclick="notice('预览：删除前需要二次确认')">删除数据集</button>`)}
function showEditDataset(){modal('编辑数据集信息','保持数据预览和字段编辑的职责清晰。',`<label for="dsdesc">业务说明</label><textarea id="dsdesc">${escapeHtml(datasets[datasetIndex].desc)}</textarea>`,'<button class="btn primary" onclick="datasets[datasetIndex].desc=document.getElementById(\'dsdesc\').value;closeModal();render();notice(\'已更新预览说明\')">保存</button>')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
window.addEventListener('hashchange',()=>{const p=location.hash.slice(1);if(['list','kb','dataset'].includes(p)&&p!==currentPage){currentPage=p;closeModal();render()}});
if(['list','kb','dataset'].includes(location.hash.slice(1)))currentPage=location.hash.slice(1);render();
</script>
</body>
</html>
