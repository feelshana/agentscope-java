const demoRows=[['2026-09-01',892,190],['2026-09-02',1210,238],['2026-09-03',1268,254],['2026-09-04',1326,271],['2026-09-05',1184,245],['2026-09-06',642,142],['2026-09-07',598,129]];
const tables=[{name:'报表访问明细',rows:'18,420',cols:8,role:'事实表'},{name:'点击详情',rows:'26,810',cols:9,role:'事实表'},{name:'用户清单',rows:'1,800',cols:6,role:'维度表'},{name:'项目清单',rows:'48',cols:5,role:'维度表'}];
const s={route:'home',role:'admin',kb:'运营分析',kbs:[{name:'运营分析',desc:'报表访问、模块使用与用户行为，让业务判断有据可依。',tables:4,version:3,shared:false,manage:true},{name:'经营指标',desc:'销售、客户与渠道的统一业务口径。',tables:3,version:2,shared:true,manage:false}],files:[],docs:['运营指标口径.docx','数据字段说明.docx'],fieldConfirmed:true,modelStarted:true,modelDone:true,decision:false,deferred:false,draft:9,version:3,ready:true,trial:false,trialChecked:false,trialRun:false,modelTab:'dialog',resultTab:'chart',inspector:false,analysis:'',analysisConfirmed:false,busy:false,error:false,search:'',terms:[['活跃用户','活跃人数','近30天内有访问行为的去重用户。'],['访问量','PV、访问次数','汇总访问次数字段，不使用记录行数替代。'],['模块','功能模块','仅使用点击详情中的模块字段。']],services:[{name:'公司模型服务',model:'企业兼容模型',provider:'OpenAI兼容',current:true,tested:true},{name:'备用分析服务',model:'备用模型',provider:'Qwen',current:false,tested:false}],publicEnabled:true,history:['9月运营趋势','模块使用情况'],customQuestion:'',newKB:false,toolTab:'result',vote:''};
const canManage=()=>s.role==='admin'||s.kbs.find(x=>x.name===s.kb)?.owner===true||s.role==='manage'&&s.kbs.find(x=>x.name===s.kb)?.manage!==false;
const isAdmin=()=>s.role==='admin';
// Keep every library's editable state isolated while switching the prototype's scope.
const libraryKeys=['docs','fieldConfirmed','modelStarted','modelDone','decision','deferred','draft','version','ready','trialChecked','trialRun','terms','termDirty','publishedTerms','dirtyTerms','ruleEdited','anchorText','trialSQL','itemEdits','fieldNotes','fieldIncluded'];
s.publishedTerms=structuredClone(s.terms);s.dirtyTerms=[];
const libraries={};
function switchLibrary(name){if(s.kb)libraries[s.kb]=Object.fromEntries(libraryKeys.map(k=>[k,structuredClone(s[k])]));s.kb=name;if(!name)return;const k=s.kbs.find(k=>k.name===name);if(libraries[name])Object.assign(s,structuredClone(libraries[name]));else Object.assign(s,{docs:k.version?['示例业务规则.docx']:[],fieldConfirmed:!!k.version,modelStarted:!!k.version,modelDone:!!k.version,decision:!!k.version,deferred:false,draft:0,version:k.version,ready:!!k.version,trialChecked:false,trialRun:false,terms:[],publishedTerms:[],dirtyTerms:[],termDirty:false,ruleEdited:'',anchorText:'',trialSQL:'',itemEdits:{},fieldNotes:{},fieldIncluded:{}});s.trial=false;s.modelTab='dialog';}
const titles={home:'新对话',chat:'9月运营趋势',knowledge:'知识库',detail:'知识库详情',sources:'数据源',modeling:'语义建模',terms:'业务术语',tasks:'例行任务',more:'更多',services:'大模型服务',public:'公共知识库',fields:'字段整理'};
function nav(){const active=['home','chat'].includes(s.route)?'chat':s.route==='detail'||s.route==='fields'?'knowledge':s.route==='services'||s.route==='public'?'more':s.route;return `<div class="brand">${mark()}<span>Data Agent</span></div>${B('新建对话','new-chat','newchat','plus')}<nav class="nav">${[['chat','对话','chat'],['knowledge','知识库','book'],['sources','数据源','database'],['modeling','语义建模','model'],['terms','业务术语','file'],['tasks','例行任务','clock']].map(([r,l,i])=>`<button type="button" class="${active===r?'active':''}" data-action="go:${r==='chat'?'home':r}" ${active===r?'aria-current="page"':''}>${I(i)}<span>${l}</span></button>`).join('')}</nav><div class="history"><div class="row spread" style="padding:0 8px 10px;white-space:nowrap"><span class="tiny muted">最近对话</span>${X('搜索对话','search','search')}</div><label>今天</label>${s.history.map((h,i)=>`<button type="button" data-action="history:${i}" class="${s.route==='chat'&&i===0?'active':''}">${I('chat')}<span>${E(h)}</span></button>`).join('')}</div><div class="rail-bottom"><nav class="nav"><button type="button" class="${active==='more'?'active':''}" data-action="go:more">${I('more')}<span>更多</span></button></nav><button type="button" class="profile" data-action="profile"><span class="avatar">悦</span><span class="grow"><strong>林悦</strong><small>${isAdmin()?'全局管理员':s.role==='query'?'知识库使用者':'知识库管理者'} · 示例组织</small></span>${I('chevron')}</button></div>`}
function header(){return `${X('打开导航','mobile-open','menu').replace('class="iconbtn"','class="iconbtn mobilemenu"')}<span class="topbar-title">${E(titles[s.route]||'Data Agent')}</span><span class="grow"></span><button class="prototype" data-action="about" title="查看原型边界"><span class="dot"></span>交互原型 · 示例数据</button>${X('帮助与引导','help','info')}`}
function render(){if(['services','public'].includes(s.route)&&!isAdmin())s.route='more';if(['modeling','fields'].includes(s.route)&&!canManage())s.route='detail';$('#rail').innerHTML=nav();$('#header').innerHTML=header();const views={home,chat,knowledge,detail,sources,modeling,terms,tasks,more,services,public:publicPage,fields};$('#view').innerHTML=(views[s.route]||home)();$('#view').classList.toggle('fixed',s.route==='modeling'||s.route==='chat');}
function go(r){closeModal();if(['detail','modeling','terms','fields'].includes(r)&&!s.kb)switchLibrary(s.kbs[0].name);s.route=r;s.inspector=false;s.resultTab='chart';history.replaceState(null,'','#'+r);render();$('#view').scrollTop=0;mobileClose()}
function composer(id='question',compact=false){return `<form data-form="${id==='model-input'?'model':'chat'}" class="composer"><label class="visually-hidden" for="${id}">${id==='model-input'?'补充业务规则':'输入问题'}</label><textarea id="${id}" placeholder="${id==='model-input'?'补充业务规则，或描述你想调整的地方…':compact?'继续追问这份数据…':'描述你的问题，让数据给你答案…'}">${id==='question'?E(s.customQuestion):''}</textarea><div class="composer-foot">${id==='model-input'?`${B('添加业务文档','document','','upload')}<span class="grow"></span>`:`${B((s.kb?E(s.kb):'选择知识库')+I('down'),'scope','','book')}${B(s.analysis?E(methodName(s.analysis))+' ×':'分析'+I('down'),s.analysis?'analysis-clear':'analysis-menu',s.analysis?'soft':'','spark')}`}<button type="${s.busy?'button':'submit'}" class="iconbtn send" aria-label="${s.busy?'停止生成':'发送问题'}" ${s.busy?'data-action="stop"':''}>${I(s.busy?'stop':'send')}</button></div></form>`}
function home(){return `<div class="home"><div class="home-heading"><div class="hello-mark">${mark()}</div><h1>你好，林悦。<br>今天想从数据中了解什么？</h1><p>从一个问题开始，把数据变成清晰的判断。</p></div>${composer()}<div class="prompt-title">从这些问题开始</div><div class="prompts">${[['chart','9月运营趋势','查看每天的访问量与变化'],['user','模块使用情况','比较不同模块的使用人数'],['book','我有哪些数据？','先了解知识库的数据范围']].map(([i,t,d],n)=>`<button class="prompt" data-action="prompt:${n}">${I(i)}<strong>${t}</strong><span>${d}</span></button>`).join('')}</div><section class="onboarding"><div class="row spread"><h3>让你的数据准备好</h3>${B('查看引导','help','quiet sm','chevron')}</div><div class="stepgrid">${[['1','连接你的数据','上传文件，或关联现有数据源','new-kb'],['2','告诉助手业务口径','整理字段，补充业务规则','go:modeling'],['3','检查并发布','确认模型，开始可信问数','go:modeling']].map(([n,t,d,a])=>`<button class="step" data-action="${a}"><span class="stepnum">${n}</span><span><h3>${t}</h3><p>${d}</p></span></button>`).join('')}</div></section></div>`}
function tableHTML(rows=demoRows){return `<div class="tablewrap"><table><thead><tr><th>日期</th><th class="number">访问量（次）</th><th class="number">访问用户数（人）</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${E(r[0])}</td><td class="number">${Number(r[1]).toLocaleString()}</td><td class="number">${r[2]}</td></tr>`).join('')}</tbody></table></div>`}
const sql="SELECT visit_date AS 日期,\n       SUM(visit_count) AS 访问量,\n       COUNT(DISTINCT account) AS 访问用户数\nFROM report_visits\nWHERE visit_date >= '2026-09-01'\n  AND visit_date < '2026-09-08'\nGROUP BY visit_date\nORDER BY visit_date";
function chartSVG(){const xs=[55,153,251,349,447,545,643];const ys=demoRows.map(r=>210-r[1]/8);return `<svg class="chart" viewBox="0 0 700 260" role="img" aria-label="示例9月1至7日访问量折线图，最高1326次，合计7120次"><path fill="#f7f4fc" d="M55 210L${xs.map((x,i)=>x+' '+ys[i]).join('L')}L643 210z"/>${[0,400,800,1200,1600].map(n=>`<path class="grid" d="M55 ${210-n/8}H660"/><text x="38" y="${214-n/8}" text-anchor="end">${n.toLocaleString()}</text>`).join('')}${xs.map((x,i)=>`<path class="grid" d="M${x} 10V210"/><text x="${x}" y="238" text-anchor="middle">9月${i+1}日</text>`).join('')}<path class="curve" d="M${xs.map((x,i)=>x+' '+ys[i]).join('L')}"/>${xs.map((x,i)=>`<circle class="point" cx="${x}" cy="${ys[i]}" r="4"><title>${demoRows[i][0]}：${demoRows[i][1]}次</title></circle><text x="${x}" y="${ys[i]-14}" text-anchor="middle">${demoRows[i][1].toLocaleString()}</text>`).join('')}</svg>`}
function resultPanel(){return `<section class="panel result"><div class="tabs" role="tablist" aria-label="查询结果">${[['chart','趋势图','chart'],['table','数据表','table'],['evidence','查询依据','file']].map(([v,l,i])=>`<button role="tab" aria-selected="${s.resultTab===v}" class="${s.resultTab===v?'active':''}" data-action="result:${v}">${I(i)}${l}</button>`).join('')}</div>${s.resultTab==='chart'?`<div class="chartbox"><div class="row spread chart-title"><span>访问量（次）</span><span>2026年9月1–7日</span></div>${chartSVG()}</div>`:s.resultTab==='table'?tableHTML():`<div class="panelbody"><div class="row spread mb16"><h3>查询依据</h3>${B('查看完整过程','inspector','quiet sm','code')}</div><p class="small">基于已发布的「${E(s.kb||'运营分析')}」v${s.version}，按日期汇总访问次数；用户数按账号去重。</p><pre class="code mt16">${E(sql)}</pre></div>`}</section>`}
function inspector(){return `<aside class="inspector" aria-label="查询依据详情"><div class="inspector-head"><h3>查询依据</h3>${X('关闭查询依据','inspector')}</div><div class="inspector-body"><section class="evidence"><h3>${I('model')}语义模型</h3><div class="row spread"><strong class="small">运营分析模型</strong>${T('v'+s.version,'purple')}</div><small>用于分析报表访问与模块使用行为</small></section><section class="evidence"><h3>${I('database')}数据来源</h3><p>产品行为数据库（demo）</p><small>合成示例数据 · 非公司真实数据</small></section><section class="evidence"><h3>${I('book')}已发布知识库</h3><p>${E(s.kb||'运营分析')}</p><small>当前回答使用已发布版本，草稿修改不会自动生效。</small></section><section class="evidence"><h3>${I('file')}查询规则</h3><p>访问量汇总次数，用户数按账号去重。</p></section><section class="evidence"><h3>${I('code')}SQL 查询语句</h3><pre class="code">${E(sql)}</pre>${B('查看工具详情','tool','quiet sm','code')}</section><section class="evidence"><h3>${I('table')}查询结果</h3><p>7行结果 · 示例</p>${B('预览结果','preview','quiet sm','eye')}</section></div></aside>`}
function chat(){const question=s.customQuestion||'分析9月报表访问趋势，并给出图表。';return `<div class="conversation"><section class="chat-column"><div class="chat-scroll"><div class="thread"><div class="user-bubble">${E(question)}</div><div class="message-time">示例对话</div><div class="agent-line">${mark()}${s.busy?'<span class="loading-ring"></span><span>正在整理查询结果…</span>':s.error?'<span>本次生成已停止</span>':'<span>已完成 · 示例耗时12.8秒</span>'}</div>${s.error?`<div class="notice amber mt16">已停止本次生成，原有对话和结果保留。${B('重新生成','retry','sm','refresh')}</div>`:s.busy?`<div class="process"><p>读取已发布模型 → 查询数据 → 生成图表</p></div>`:`<details class="process"><summary>${I('check')}已读取业务口径 · 查询数据 · 生成图表 ${I('down')}</summary><div class="process-content"><span>${I('check')}业务口径 0.8秒</span><button class="pill-link" data-action="tool">${I('check')}查询数据 2.1秒</button><span>${I('check')}生成图表 0.4秒</span></div></details><article class="answer"><h2>${s.analysisConfirmed?'分析已完成，请结合业务背景判断':'本周访问量在9月4日达到高峰'}</h2><p>${s.analysisConfirmed?'本次确认指标：'+E(s.confirmedMetric||'访问次数')+'；期间：'+E(s.confirmedPeriod||'2026-09-01 至 2026-09-07')+'。当前为合成演示，不执行真实算法；下方固定示例图表只展示报告结构，不作为所选参数的计算结果。':'9月1–7日累计访问 <strong>7,120次</strong>，9月4日最高，为 <strong>1,326次</strong>。随后逐步回落，9月7日为598次。仅凭访问量变化无法判断原因，可以继续比较部门或项目。'}</p>${resultPanel()}<div class="attachment"><span class="filetype">${I('table')}</span><div class="grow"><strong>每日访问趋势.csv</strong><small>CSV · 7行数据 · 合成示例</small></div>${B('预览','preview','quiet sm','eye')}${B('下载','download','quiet sm','download')}</div><div class="feedback">${B('正确','vote:up','quiet sm '+(s.vote==='up'?'selected':''),'up')}${B('不正确','vote:down','quiet sm '+(s.vote==='down'?'selected':''),'info')}<span class="grow"></span>${B('为什么变化？','method:attribution','quiet sm','spark')}${B('有没有异常？','method:anomaly','quiet sm','chart')}</div>${s.analysisConfirmed?'<p class="tiny muted">分析类反馈仅记录评价，不进入问答召回。</p>':''}</article>`}</div></div><div class="chat-composer">${composer('followup',true)}<div class="disclaimer">原型演示结果，未连接模型与数据库。</div></div></section>${s.inspector?inspector():''}</div>`}
function knowledge(){return `<div class="page"><div class="pagehead"><div><h1>知识库</h1><p>把数据和业务口径放在一起，为每一次提问提供依据。</p></div>${B('新建知识库','new-kb','primary','plus')}</div><div class="toolbar"><div class="search">${I('search')}<input id="kb-search" aria-label="搜索知识库" placeholder="搜索知识库"></div><span class="grow"></span><span class="small muted">${s.kbs.length}个知识库</span></div><div class="kb-list" id="kb-list">${kbRows()}</div></div>`}
function kbRows(q=''){return s.kbs.filter(k=>k.name.includes(q)).map((k,i)=>`<article class="kbrow"><span class="kbicon">${I('book')}</span><div class="grow"><div class="row wrap"><h3>${E(k.name)}</h3>${T(k.version?'已发布 v'+k.version:'待建模',k.version?'green':'amber')}${T(k.shared?'全员可使用':s.role==='query'||!k.manage?'可使用':'可管理')}</div><p>${E(k.desc)}</p><div class="metadata"><span>${k.tables}张数据表</span><span>${k.shared?'由管理员共享':'我的知识库'}</span><span>今天更新</span></div></div>${B('查看详情','kb:'+s.kbs.indexOf(k),'quiet','chevron')}${B(k.version?'基于此库提问':'继续准备',k.version?'ask-kb:'+s.kbs.indexOf(k):'kb:'+s.kbs.indexOf(k),'','chat')}</article>`).join('')||'<div class="empty-inline">没有匹配的知识库</div>'}
function detail(){return `<div class="page"><div class="breadcrumbs"><button data-action="go:knowledge">知识库</button>${I('chevron')}<span>${E(s.kb)}</span></div><div class="pagehead"><div class="detailhead"><div class="row"><span class="kbicon">${I('book')}</span><h1>${E(s.kb)}</h1></div><div class="statline"><span>${s.version?'已发布 v'+s.version:'尚未发布'}</span><span>${tables.length}张数据表</span><span>${canManage()?'可管理':'可使用 · 只读'}</span></div></div><div class="row wrap">${canManage()?B('成员','members','','user'):''}${canManage()?B('语义建模','go:modeling','','model'):''}${s.version&&s.ready?B('基于此库提问','ask-current','primary','chat'):B('准备数据','upload','primary','upload')}</div></div>${!canManage()?'<div class="read-only">'+I('shield')+'你可以查看数据和已发布口径；数据预览最多20行。</div>':''}<div class="tabs mb16"><button class="active">数据表</button><button data-action="go:terms">业务术语</button>${canManage()?'<button data-action="model-tab:docs">业务文档</button>':''}</div><div class="toolbar"><span class="small muted">数据表与字段</span><span class="grow"></span>${canManage()?B('上传文件','upload','','upload')+B('关联外部表','associate','','link'):''}</div><section class="panel"><div class="tablewrap"><table><thead><tr><th>数据表</th><th>来源</th><th class="number">数据行数</th><th>字段</th><th>状态</th><th>操作</th></tr></thead><tbody>${tables.map((t,i)=>`<tr><td><strong>${E(t.name)}</strong><div class="cellmeta">${t.role}</div></td><td>${i<2?'Excel文件':'外部数据源'}</td><td class="number">${t.rows}</td><td>${t.cols}个</td><td>${T(s.fieldConfirmed?'已整理':'待整理',s.fieldConfirmed?'green':'amber')}</td><td>${B('查看','table:'+i,'quiet sm','eye')}${canManage()?B('整理字段','go:fields','quiet sm','edit'):''}</td></tr>`).join('')}</tbody></table></div></section>${canManage()&&s.draft?`<div class="notice mt24 row wrap"><span class="grow">有${s.draft}项草稿修改，发布后用于问数。</span>${B('检查草稿','draft','sm','file')}</div>`:''}</div>`}
function sources(){return `<div class="page"><div class="pagehead"><div><h1>数据源</h1><p>管理数据库连接，按需把表关联到知识库。</p></div>${B('新建数据源','source-new','primary','plus')}</div><section class="panel"><div class="tablewrap"><table><thead><tr><th>连接名称</th><th>类型</th><th>数据库</th><th>状态</th><th>操作</th></tr></thead><tbody><tr><td><strong>产品行为数据库</strong><div class="cellmeta">示例连接 · 未连接真实数据库</div></td><td>MySQL</td><td>product_demo</td><td>${T('演示可用','green')}</td><td>${B('查看连接','source-detail','quiet sm','eye')}${s.role!=='query'?B('关联表','associate','sm','link'):''}</td></tr>${s.addedSource?`<tr><td><strong>${E(s.addedSource.name)}</strong><div class="cellmeta">本地模拟连接</div></td><td>${E(s.addedSource.kind)}</td><td>${E(s.addedSource.db)}</td><td>${T('演示可用','green')}</td><td>${B('关联表','associate','sm','link')}</td></tr>`:''}</tbody></table></div></section><p class="small muted mt16">连接资料归本人管理；关联后的表按知识库权限使用。</p></div>`}

const data=[
[['日期','用户账号','报表名称','访问次数'],[['2026-09-01','user01','运营日报',12],['2026-09-01','user02','业务总览',8],['2026-09-02','user01','运营日报',15]]],
[['日期','用户账号','项目','模块','访问次数'],[['2026-09-01','user01','示例项目A','数据分析',5],['2026-09-01','user02','示例项目B','报表中心',3]]],
[['账号','公司','部门','职位'],[['user01','示例组织','运营部','员工'],['user02','示例组织','市场部','员工']]],

][index];return `<div class="tablewrap"><table><thead><tr>${data[0].map(v=>`<th>${E(v)}</th>`).join('')}</tr></thead><tbody>${data[1].map(row=>`<tr>${row.map(v=>`<td>${E(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function fields(){return `<div class="page"><div class="breadcrumbs"><button data-action="go:detail">${E(s.kb)}</button>${I('chevron')}<span>字段整理</span></div><div class="pagehead"><div><h1>让助手理解你的字段</h1><p>确认需要纳入的字段，保留关联键，并补充业务说明。</p></div>${T('1 / 4张表','purple')}</div><div class="notice mb16">当前整理「报表访问明细」。时间字段保持纳入；同名关联键保留以便跨表查询。以下为合成示例。</div><section class="panel screening"><div class="tablewrap"><table><thead><tr><th>纳入</th><th>字段</th><th>类型</th><th>角色判断</th><th>业务说明</th></tr></thead><tbody>${[['visit_date','DATE','业务字段','访问发生日期',true],['account','VARCHAR','关联键','访问用户的唯一账号',false],['visit_count','BIGINT','业务字段','访问次数，按总和计算',false],['report_name','VARCHAR','业务字段','被访问的报表名称',false],['trace_id','VARCHAR','技术字段','事件跟踪标识',false]].map(([n,t,r,d,locked],i)=>`<tr><td><input type="checkbox" aria-label="纳入${n}" ${s.fieldIncluded?.[n]??(i<4)?'checked':''} ${locked?'disabled':''}></td><td><strong>${n}</strong>${locked?'<div class="cellmeta">时间字段 · 固定纳入</div>':''}</td><td>${t}</td><td>${T(r,r==='技术字段'?'':'purple')}</td><td><input class="input" aria-label="${n}业务说明" value="${E(s.fieldNotes?.[n]||d)}"></td></tr>`).join('')}</tbody></table></div></section><div class="footer-action">${B('返回知识库','go:detail')}${B('确认字段并继续','fields-save','primary','check')}</div></div>`}
function modeling(){return `<div class="workbench ${s.trial?'trial-open':''}"><div class="workhead"><div class="row wrap"><button class="pill-link" data-action="go:detail">${I('back')}${E(s.kb)}</button><span class="muted">/</span><h1>语义建模</h1>${s.version?T('v'+s.version+' 已发布','green'):T(s.modelDone?'草稿已校验':'待建模','amber')}<span class="grow"></span>${B('试问','trial',s.trial?'soft':'','chat')}${s.ready&&s.version?B('去问数','ask-current','','arrow'):''}</div><div class="tabs">${[['dialog','建模对话'],['docs','资料'],['schema','语义模型']].map(([v,l])=>`<button data-action="model-tab:${v}" class="${s.modelTab===v?'active':''}">${l}</button>`).join('')}</div></div><div class="workbody">${s.modelTab==='dialog'?modelDialog():s.modelTab==='docs'?modelDocs():modelSchema()}${s.trial?trialPanel():''}</div>${s.modelTab==='dialog'&&s.modelStarted?`<div class="model-bottom">${composer('model-input',true)}</div>`:''}<div class="draftbar"><span class="dot" style="color:var(--accent)"></span><strong>草稿 · ${s.draft}项修改</strong>${!s.decision&&s.modelStarted?'<span class="small muted">· 1项待确定</span>':''}${B('查看全部','draft','quiet sm')}<span class="grow"></span>${s.busy?'<span class="small muted">助手运行中</span>':s.ready&&s.draft===0?T('已发布，问数已就绪','green'):!s.ready&&s.draft===0?'<span class="loading-ring"></span><span>问数准备中</span>':''}<button class="btn primary" data-action="publish" ${s.busy||!s.modelStarted||s.draft===0?'disabled':''}>检查并发布</button></div></div>`}
function modelDialog(){if(!s.modelStarted)return `<div class="model-chat"><div class="empty"><div>${mark()}</div><h2 class="mt16">先补充口径，再开始建模</h2><p class="mt16">已准备好数据表。上传业务规则与字段说明，让助手理解你的业务；没有文档也可以继续。</p><div class="row wrap" style="justify-content:center">${B('上传业务文档','document','','upload')}${B('开始自动建模','model-start','primary','spark')}</div><div class="mt24 small muted">${s.docs.map(E).join(' · ')||'尚未添加业务文档'}</div></div></div>`;return `<div class="model-chat"><div class="model-thread"><div class="user-bubble">按业务文档完善活跃用户口径。</div><div class="agent-line">${mark()}${s.busy?'<span class="loading-ring"></span>正在完善业务口径…':'已读取'+s.docs.length+'份文档 · '+(s.modelDone?'完成模型校验':'准备建模')}</div>${s.busy?'<p class="mt24">读取资料 → 确定口径 → 写入草稿 → 校验编译</p>':`<h2>${!s.docs.length?'基础模型已整理，尚未添加业务规则':s.decision?'已按你的选择更新口径':'模型已更新，1处口径需要你确定'}</h2><p>已补充数据表说明与关联关系${s.docs.length?'，并整理了文档中的业务口径':''}。所有修改保存在草稿中，检查并发布后才用于问数。</p><section class="panel change-list"><div class="panelhead"><strong class="grow">AI 建模结果</strong>${T('本轮修改','purple')}</div>${[['model','模型说明','描述3张表的业务含义与字段粒度'],['link','关联关系','访问明细与用户、项目的2组关联'],['file','业务语义',s.ruleEdited||(s.docs.length?'访问量、去重用户数与活跃用户定义':'无业务文档，不自动写业务规则')]].map(([i,t,d],n)=>`<div class="change-row">${I(i)}<div class="grow"><strong>${t}</strong><p>${E(s.itemEdits?.[n]||d)}</p></div>${B('编辑','edit-item:'+n,'quiet sm','edit')}</div>`).join('')}</section>${s.docs.length&&!s.decision?`<section class="decision"><div class="row spread"><h3>活跃用户的30天窗口，以哪一天为准？</h3>${T('需要你确定','amber')}</div><p class="small">文档尚未说明日期锚点，这会影响统计范围。</p><label class="radio-row"><input type="radio" name="anchor" value="question" checked><span>以提问指定日期为准 ${T('推荐','purple')}<small>没有日期时先澄清，不默认补全。</small></span></label><label class="radio-row"><input type="radio" name="anchor" value="latest"><span>以最新数据日期为准<small>以数据更新日期作为窗口结束日期。</small></span></label><div class="row wrap mt16">${B('提交选择','decision','primary sm','check')}${B(s.deferred?'已标记稍后处理':'稍后处理','defer','quiet sm')}</div></section>`:`<div class="notice green mt16">${!s.docs.length?'未添加文档，只整理模型说明；业务规则保持为空。':'已确定：'+E(s.anchorText||'以提问指定日期为准')+'。口径已写入草稿。'}</div>`}<div class="row wrap mt24"><span class="small muted">下一步</span>${B('核对一个问题','trial','sm','chat')}${B('检查并发布','publish','sm','arrow')}</div>`}</div></div>`}
function modelDocs(){return `<div class="model-assets"><div class="row spread mb16"><div><h2>业务资料</h2><p class="small mt8">文档、字段和说明，共同构成建模依据。</p></div>${B('上传文档','document','','upload')}</div><div class="panel panelbody">${s.docs.length?s.docs.map((d,i)=>`<div class="docrow">${I('file')}<div class="grow"><strong>${E(d)}</strong><p>已保存至草稿 · 上传内容由用户提供</p></div>${B('查看','doc:'+i,'quiet sm','eye')}</div>`).join(''):'<div class="empty-inline">还没有业务文档</div>'}</div><div class="row spread mt32 mb16"><h3>数据表与字段</h3>${B('整理字段','go:fields','sm','edit')}</div><div class="panel">${tables.map((t,i)=>`<div class="change-row">${I('table')}<div class="grow"><strong>${t.name}</strong><p>${t.cols}个字段 · ${t.role}</p></div>${B('预览','table:'+i,'quiet sm','eye')}</div>`).join('')}</div></div>`}
function modelSchema(){return `<div class="model-assets"><div class="row spread"><div><h2>语义模型</h2><p class="small mt8">查看模型、关系与业务规则。问数使用已发布版本。</p></div>${T(s.draft?'草稿与已发布有差异':'与已发布一致',s.draft?'amber':'green')}</div><div class="schema"><section class="schema-model"><div class="schema-title">报表访问明细</div>${[['account','用户账号'],['visit_date','日期'],['visit_count','访问次数'],['report_name','报表名称']].map(([n,d])=>`<div class="schema-field"><span>${n}</span><span>${d}</span></div>`).join('')}</section><div class="schema-join">N → 1<br>账号关联</div><section class="schema-model"><div class="schema-title">用户清单</div>${[['account','用户账号'],['company','公司'],['department','部门']].map(([n,d])=>`<div class="schema-field"><span>${n}</span><span>${d}</span></div>`).join('')}</section></div><div class="panel panelbody"><h3>业务规则</h3><p class="small mt16">${s.docs.length?'访问量汇总访问次数；用户数按账号去重；仅使用点击详情的模块字段。':'尚无业务文档，不自动添加业务规则。'}</p><p class="small mt8">${!s.docs.length?'请提供业务口径后再完善此处。':s.decision?'近30天活跃用户以'+E(s.anchorText||'提问指定日期')+'计算。':'活跃用户日期锚点尚待确定，不作为已确认口径。'}</p></div><details class="mt24"><summary class="small muted">查看工程结构（高级）</summary><pre class="code mt16">models/report_visits/\nmodels/users/\nrelationships.yml\nknowledge/rules/\nknowledge/questions/\nknowledge/sql/</pre></details></div>`}
function trialPanel(){return `<aside class="trial" aria-label="试问面板"><div class="row spread"><h3>试问</h3>${X('关闭试问','trial')}</div><p class="small mt16">先核对问题与SQL，确认正确后可作为问数示例。</p><div class="trial-q"><strong>9月1–7日每天的访问量是多少？</strong><div class="mt8">${T(s.trialChecked?'已确认':'待核对',s.trialChecked?'green':'amber')}</div><p class="tiny mt8">指标：访问次数总和<br>粒度：按天<br>范围：2026-09-01至09-07</p><details class="mt8" open><summary class="small">查询SQL</summary><pre class="code">${E(s.trialSQL||sql)}</pre></details>${s.trialRun?tableHTML(demoRows.slice(0,3)):''}<div class="row wrap mt16">${B(s.trialRun?'重新试运行':'试运行','trial-run','sm','refresh')}${!s.trialChecked?B('确认SQL正确','trial-confirm','primary sm','check'):''}${B('不正确','trial-wrong','quiet sm')}</div><p class="tiny muted mt8">SQL生成不等于已查询；本原型试运行展示合成数据。</p></div><div class="mt24">${field('再核对一个问题','trial-question','','text','placeholder="输入一个简单问题"')}${B('生成SQL','trial-add','sm','plus')}</div></aside>`}
function terms(){return `<div class="page"><div class="pagehead"><div><h1>业务术语</h1><p>让团队用相同的词，表达相同的业务含义。</p></div>${canManage()?B('添加术语','term-new','primary','plus'):''}</div><div class="toolbar">${B(E(s.kb)+I('down'),'scope','','book')}<span class="grow"></span>${T(canManage()?'编辑进入草稿':'仅查看已发布术语',canManage()?'purple':'')}</div>${canManage()?'<div class="notice mb16">术语属于当前知识库，修改后需要发布，才会在问数中生效。</div>':''}<section class="panel"><div class="tablewrap"><table><thead><tr><th>术语</th><th>同义词</th><th>含义</th><th>状态</th>${canManage()?'<th>操作</th>':''}</tr></thead><tbody>${(canManage()?s.terms:s.publishedTerms).map(([t,a,d],i)=>`<tr><td class="term-name">${E(t)}</td><td>${E(a)}</td><td>${E(d)}</td><td>${T(s.dirtyTerms.includes(i)&&canManage()?'草稿':'已发布',s.dirtyTerms.includes(i)&&canManage()?'amber':'green')}</td>${canManage()?`<td>${B('编辑','term:'+i,'quiet sm','edit')}</td>`:''}</tr>`).join('')}</tbody></table></div></section>${canManage()?`<div class="footer-action">${B('去检查并发布','go:modeling','','arrow')}</div>`:''}</div>`}
function tasks(){return `<div class="page"><div class="pagehead"><div><h1>例行任务</h1><p>周期性分析任务的内容和执行计划。</p></div>${T('后续版本开放')}</div><section class="panel"><div class="tablewrap"><table><thead><tr><th>任务名称</th><th>知识库</th><th>执行计划</th><th>状态</th></tr></thead></table></div><div class="empty">${I('clock')}<h3>把重复的工作，留给下一次升级</h3><p>当前版本暂不支持创建和执行例行任务。你可以先在对话中完成一次分析。</p>${B('开始一次分析','new-chat','','chat')}</div></section></div>`}
function more(){return `<div class="page"><div class="pagehead"><div><h1>更多</h1><p>帮助、个人资料与系统管理。</p></div></div>${[['book','帮助与引导','查看入门路径，重新打开使用引导。','help','查看'],['user','个人资料','示例姓名、公司、部门及当前身份。','profile','查看'],...(isAdmin()?[['model','大模型服务','配置服务、测试连接与手动切换全局模型。','go:services','管理'],['shield','公共知识库','配置全体已登录用户可使用的知识库。','go:public','管理']]:[])].map(([i,t,d,a,l])=>`<section class="settings-row">${I(i)}<div class="grow"><h3>${t}</h3><p>${d}</p></div>${B(l,a,'','chevron')}</section>`).join('')}<div class="mt32 small muted">管理功能按权限显示；公共知识库仅向已登录用户提供使用权限。</div></div>`}
function services(){return `<div class="page"><div class="breadcrumbs"><button data-action="go:more">更多</button>${I('chevron')}<span>大模型服务</span></div><div class="pagehead"><div><h1>大模型服务</h1><p>由全局管理员配置和手动切换；每一轮使用固定模型。</p></div>${B('添加服务','service-new','primary','plus')}</div><div class="notice mb16">激活影响新轮次；正在进行的轮次继续使用原模型。不会因故障自动切换到其他服务。</div>${s.services.map((m,i)=>`<section class="service"><div class="servicebody"><div class="grow"><div class="row wrap"><h3>${E(m.name)}</h3>${m.current?T('当前服务','green'):T(m.tested?'已测试':'尚未测试',m.tested?'green':'')}</div><p>${E(m.provider)} · ${E(m.model)}</p></div>${B('编辑','service:'+i,'','edit')}${B('测试连接','service-test:'+i,'','refresh')}${!m.current?B('设为当前','service-activate:'+i,'primary','check'):''}</div><footer><span>密钥已配置 · 不显示密钥内容</span><span>${m.tested?'最近测试：演示成功':'建议先测试再激活'}</span></footer></section>`).join('')}<p class="small muted mt24">原型只演示配置状态，不接受或保存真实密钥，不连接任何模型服务。</p></div>`}
function publicPage(){return `<div class="page"><div class="breadcrumbs"><button data-action="go:more">更多</button>${I('chevron')}<span>公共知识库</span></div><div class="pagehead"><div><h1>公共知识库</h1><p>让全体已登录用户使用已发布的数据与业务口径。</p></div></div><div class="notice mb16">公共表示组织内全员可使用，不代表公开到互联网；管理权限仍需单独授予。</div><section class="panel"><div class="panelhead"><span class="kbicon">${I('book')}</span><div class="grow"><h3>经营指标</h3><p class="small">已发布 v2 · 3张数据表</p></div><button data-action="public-toggle" aria-label="全员可使用经营指标" aria-pressed="${s.publicEnabled}" class="iconbtn"><span class="toggle ${s.publicEnabled?'on':''}"></span></button></div><div class="panelbody small muted">${s.publicEnabled?'全体已登录用户拥有QUERY使用权限。':'当前未启用全员使用。'}</div></section></div>`}
let returnFocus=null;
function modal(title,body,foot='',wide=false){if(!$('#layer').innerHTML)returnFocus=document.activeElement;$('#layer').innerHTML=`<div class="overlay" data-backdrop="true"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><header class="modalhead"><h2 id="dialog-title" class="grow">${title}</h2>${X('关闭弹窗','close')}</header><div class="modalbody">${body}</div>${foot?`<footer class="modalfoot">${foot}</footer>`:''}</section></div>`;document.querySelectorAll('.app > *').forEach(el=>el.inert=true);requestAnimationFrame(()=>$('#layer button, #layer input')?.focus())}
function closeModal(){document.querySelectorAll('.app > *').forEach(el=>el.inert=false);$('#layer').innerHTML='';if(returnFocus?.isConnected)returnFocus.focus();returnFocus=null}
let toastTimer;
function toast(t){$('#notification').innerHTML=`<div class="toast">${E(t)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#notification').innerHTML='',4200)}
function mobileClose(){$('#rail').classList.remove('open');$('#shade').classList.remove('open')}
function methodName(v){return ({attribution:'指标归因',anomaly:'异常检测',forecast:'趋势预测'})[v]||'分析'}
function chooseScope(){modal('选择知识库',`<p class="small muted mb16">每轮最多选择一个知识库；不选库时进行普通对话。</p><label class="pickrow"><input type="radio" name="scope" value="" ${!s.kb?'checked':''}><span>不选择知识库</span></label>${s.kbs.map(k=>`<div class="pickrow"><input id="scope-${s.kbs.indexOf(k)}" type="radio" name="scope" value="${E(k.name)}" ${s.kb===k.name?'checked':''} ${!k.version?'disabled':''}><label for="scope-${s.kbs.indexOf(k)}">${E(k.name)}<small>${k.version?'已发布 v'+k.version:'尚未发布，暂不可问数'}</small></label>${T(k.manage?'可管理':'可使用')}</div>`).join('')}`,B('取消','close')+B('使用此选择','scope-save','primary'))}
function analysisMenu(){modal('选择分析方法',`<p class="small muted mb16">选择后先确认指标、时间与口径，不会直接执行分析。</p>${[['attribution','指标归因','比较两个时期，分析维度变化的贡献。'],['anomaly','异常检测','检查每天或每小时是否存在异常波动。'],['forecast','趋势预测','基于足够的历史点数估计未来趋势与区间。']].map(([v,t,d])=>`<div class="settings-row">${I('chart')}<div class="grow"><h3>${t}</h3><p>${d}</p></div><button class="btn sm" data-action="method:${v}" ${!s.kb?'disabled':''}>选择</button></div>`).join('')}${!s.kb?'<div class="notice mt16">请先选择具有时间字段的知识库。</div>':''}`)}
function analysisParams(){const n=methodName(s.analysis);modal(n+' · 确认参数',`<p class="small muted mb16">确认后才进入取数、计算和生成结果。当前仅演示交互。</p>${field('分析指标','metric','访问次数')}${field('指标口径','metric-rule','汇总访问次数字段；不使用记录行数代替')}<div class="split">${field('开始日期','period-start','2026-09-01','date')}${field('结束日期','period-end','2026-09-07','date')}</div>${s.analysis==='attribution'?`<div class="split">${field('对比期开始','compare-start','2026-08-25','date')}${field('对比期结束','compare-end','2026-08-31','date')}</div>${field('分析维度（最多4个）','dimensions','部门、项目')}`:s.analysis==='forecast'?'<div class="notice amber">示例当前仅7个日数据点，少于14点；需要补充历史数据后才能预测。</div>':'<div class="notice">按天分析，季节性估计取决于实际数据点数。异常不等于业务原因。</div>'}<label class="radio-row"><input id="rule-filter" type="checkbox" checked><span>应用知识库已确认的默认业务过滤</span></label>`,B('取消','analysis-cancel')+`<button class="btn primary" data-action="analysis-start" ${s.analysis==='forecast'?'disabled':''}>开始分析</button>`,true)}
function uploadModal(){modal('上传数据文件',`<p class="small muted mb16">选择Excel或CSV。原型只读取文件名与大小，不解析、上传或保存文件内容。</p><label class="dropzone" for="upload-files">${I('upload')}选择Excel / CSV文件<small>演示策略：最多10个、单文件50MB、总计100MB</small><input id="upload-files" type="file" accept=".xlsx,.xls,.csv" multiple hidden></label><div class="filelist" id="file-list">${fileList()}</div><p class="tiny muted mt16">无需真实文件也可用合成数据体验完整流程。</p>`,B('使用示例文件','sample-files')+B('开始导入','import-start','primary','upload'))}
function fileList(){return s.files.map(f=>`<div class="row">${I('file')}<span class="grow">${E(f.name)}</span><span class="tiny muted">${f.status||'等待导入'}</span></div>`).join('')||'<div class="empty-inline small">尚未选择文件</div>'}
function documentModal(){modal('添加业务文档',`<p class="small muted mb16">支持多份业务文档。此处只记录文件名，不读取或上传真实内容。</p><label class="dropzone" for="document-file">${I('file')}选择业务规则或字段说明<input id="document-file" type="file" accept=".docx,.md,.txt,.pdf" multiple hidden></label><div id="document-list" class="filelist"></div>`,B('添加示例文档','document-sample')+B('完成','document-done','primary'))}
function publish(){if(!canManage())return toast('当前身份只有使用权限。');if(s.busy)return toast('助手运行中，请等待本轮结束。');if(!s.modelStarted)return toast('请先完成字段整理与建模。');if(s.draft===0)return toast('当前没有待发布修改。');modal('检查并发布',`<div class="notice green mb16">模型校验通过（模拟）。发布后，后续问数使用新版本。</div><div class="row spread mb16"><strong>将发布为 v${s.version+1}</strong><span class="small muted">${s.draft}项草稿修改</span></div>${!s.decision?'<div class="notice amber">还有1项口径未确定；该项不会作为已确认规则生效。你可以返回处理，也可以跳过并发布其他修改。</div>':'<p class="small">本轮口径已处理，可以发布。</p>'}<p class="small mt16">${s.trialChecked?'已确认1个SQL示例，将随版本发布。':'未确认的问题不会进入已确认问答示例。'}</p>`,B('返回处理','close')+B(!s.decision?'跳过待确定项并发布':'确认发布','publish-confirm','primary','check'))}
let runTimer;
function runDemo(analysis=false){closeModal();s.route='chat';s.busy=true;s.error=false;s.analysisConfirmed=analysis;s.resultTab='chart';render();clearTimeout(runTimer);runTimer=setTimeout(()=>{s.busy=false;if(s.route==='chat')render()},1100)}
function downloadCSV(){const text='\ufeff日期,访问量,访问用户数\r\n'+demoRows.map(r=>r.join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='每日访问趋势_合成示例.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('已下载7行合成示例数据。')}
function toolModal(){modal('查询工具 · 运行详情',`<div class="row wrap mb16">${T('演示成功','green')}<span class="small muted">run_sql · 示例耗时2.1秒</span></div><div class="tabs mb16">${[['result','结果'],['input','输入'],['raw','原始回执']].map(([v,l])=>`<button data-action="tool-tab:${v}" class="${s.toolTab===v?'active':''}">${l}</button>`).join('')}</div>${s.toolTab==='result'?tableHTML():s.toolTab==='input'?`<pre class="code">${E(sql)}</pre>`:`<pre class="code">${E(JSON.stringify({demo:true,status:'success',rowCount:7,columns:['日期','访问量','访问用户数'],rows:demoRows},null,2))}</pre>`}`,B('关闭','close'),true)}
function handle(a){const [act,...rest]=a.split(':');const arg=rest.join(':');
 switch(act){
 case'go':return go(arg);
 case'close':return closeModal();
 case'mobile-open':$('#rail').classList.add('open');$('#shade').classList.add('open');return;
 case'mobile-close':return mobileClose();
 case'new-chat':s.customQuestion='';s.analysis='';s.analysisConfirmed=false;s.vote='';return go('home');
 case'history':switchLibrary('运营分析');s.customQuestion=arg==='1'?'比较不同模块的使用人数。':'分析9月报表访问趋势，并给出图表。';return go('chat');
 case'prompt':s.customQuestion=['分析9月报表访问趋势，并给出图表。','比较不同模块的使用人数。','我有哪些数据？'][Number(arg)];render();$('#question')?.focus();return;
 case'scope':return chooseScope();
 case'scope-save':{const chosen=$('input[name=scope]:checked');switchLibrary(chosen?.value||'');closeModal();render();return}
 case'analysis-menu':return analysisMenu();
 case'analysis-clear':s.analysis='';render();return;
 case'method':s.analysis=arg;closeModal();return analysisParams();
 case'analysis-cancel':s.analysis='';closeModal();render();return;
 case'analysis-start':{const from=$('#period-start').value,to=$('#period-end').value;if(!$('#metric').value.trim()||!from||!to||from>to)return toast('请填写指标与有效日期范围。');if(arg==='forecast')return;s.confirmedMetric=$('#metric').value;s.confirmedPeriod=from+' 至 '+to;return runDemo(true)}
 case'result':s.resultTab=arg;render();return;
 case'inspector':s.inspector=!s.inspector;render();return;
 case'preview':return modal('每日访问趋势.csv',`<div class="row spread mb16"><span class="small muted">7行 · 合成示例数据</span>${T('CSV预览')}</div>${tableHTML()}`,B('关闭','close')+B('下载CSV','download','primary','download'),true);
 case'download':return downloadCSV();
 case'tool':s.toolTab='result';return toolModal();
 case'tool-tab':s.toolTab=arg;return toolModal();
 case'vote':s.vote=arg;render();return toast(s.analysisConfirmed?'已记录分析反馈，不进入问答召回。':arg==='up'?'演示：本轮成功业务查询已保存为当前库的问答示例。':'已记录反馈，不自动修改模型或撤销示例。');
 case'stop':clearTimeout(runTimer);s.busy=false;s.error=true;render();return;
 case'retry':return runDemo(s.analysisConfirmed);
 case'new-kb':return modal('新建知识库',`${field('知识库名称','kb-name','','text','placeholder="例如：部门运营分析" maxlength="60"')}${field('用途说明','kb-description','','textarea','placeholder="描述希望用这些数据回答什么问题"')}<p class="small muted">新库默认仅创建者和全局管理员可管理。</p>`,B('取消','close')+B('创建并上传数据','kb-create','primary','arrow'));
 case'kb-create':{const name=$('#kb-name').value.trim();if(!name)return toast('请输入知识库名称。');if(s.kbs.some(k=>k.name===name))return toast('演示中已有同名知识库，请换一个名称。');s.kbs.push({name,desc:$('#kb-description').value.trim()||'我的数据分析知识库',tables:0,version:0,manage:true,owner:true});switchLibrary(name);s.version=0;s.draft=0;s.ready=false;s.newKB=true;s.modelStarted=false;s.modelDone=false;s.decision=false;s.fieldConfirmed=false;s.docs=[];go('detail');return uploadModal()}
 case'kb':case'ask-kb':{const k=s.kbs[Number(arg)];switchLibrary(k.name);return go(act==='kb'?'detail':'home')}
 case'ask-current':return go('home');
 case'upload':return uploadModal();
 case'sample-files':s.files=[{name:'报表访问明细_示例.xlsx'},{name:'点击详情_示例.xlsx'},{name:'用户清单_示例.xlsx'},{name:'项目清单_示例.xlsx'}];$('#file-list').innerHTML=fileList();return;
 case'import-start':if(!s.files.length)return toast('请先选择文件或使用示例文件。');s.files=s.files.map(f=>({...f,status:'模拟导入完成'}));s.kbs.find(k=>k.name===s.kb).tables=4;closeModal();go('fields');return toast('模拟导入完成。请确认字段整理。');
 case'fields-save':{const checks=[...document.querySelectorAll('.screening input[type=checkbox]')];if(!checks.some(c=>c.checked))return toast('每张表至少纳入一个字段。');s.fieldNotes={};s.fieldIncluded={};document.querySelectorAll('.screening tbody tr').forEach(row=>{const n=row.querySelector('td:nth-child(2) strong').textContent;s.fieldNotes[n]=row.querySelector('input.input').value;s.fieldIncluded[n]=row.querySelector('input[type=checkbox]').checked;});s.fieldConfirmed=true;s.modelTab='dialog';go('modeling');return toast('示例字段整理已确认；可以补充业务文档并开始建模。')}
 case'document':return documentModal();
 case'document-sample':s.docs=[...new Set([...s.docs,'运营指标口径.docx','数据字段说明.docx'])];$('#document-list').innerHTML=s.docs.map(d=>`<div class="row">${I('file')}${E(d)}</div>`).join('');return;
 case'document-done':closeModal();if(s.modelStarted)s.draft+=1;render();return toast('文档文件名已记录（本地模拟），未上传真实内容。');
 case'doc':return modal(E(s.docs[Number(arg)]),'<p>示例业务口径：访问量汇总访问次数；用户数按账号去重；活跃用户为近30天有访问行为的用户，窗口锚点需要确定。</p><div class="notice mt16">这是合成预览文本，不是所选文件的真实内容。</div>',B('关闭','close'));
 case'model-note':return;
 case'model-start':if(!s.fieldConfirmed)return toast('请先确认字段整理。');s.modelStarted=true;s.busy=true;s.draft=s.docs.length?9:5;s.decision=!s.docs.length;render();setTimeout(()=>{s.busy=false;s.modelDone=true;if(s.route==='modeling')render()},1200);return;
 case'model-tab':s.modelTab=arg;return go('modeling');

 case'trial':s.trial=!s.trial;render();return;

 case'draft':return modal('全部草稿修改',`<p class="small muted mb16">问数仍使用已发布v${s.version}，以下修改尚未生效。</p>${[['模型说明','3项'],['关联关系','2项'],['业务语义','4项'],['已确认SQL示例',s.trialChecked?'1项':'0项']].map(([l,n])=>`<div class="change-row"><strong class="grow">${l}</strong><span>${n}</span>${B('查看','draft-view','quiet sm','chevron')}</div>`).join('')}${!s.decision?'<div class="notice amber mt16">1项业务口径等待确定，可返回对话处理。</div>':''}`,B('继续编辑','close')+B('检查并发布','publish','primary'),true);

 case'term-new':case'term':{s.termIndex=act==='term'?Number(arg):-1;const t=s.terms[s.termIndex]||['','',''];return modal(s.termIndex<0?'添加业务术语':'编辑业务术语',field('术语','term-name',t[0])+field('同义词','term-alias',t[1])+field('业务含义','term-definition',t[2],'textarea')+'<p class="small muted">本次修改进入当前知识库草稿，发布后生效。</p>',B('取消','close')+B('保存至草稿','term-save','primary'))}
 case'term-save':{const t=[$('#term-name').value.trim(),$('#term-alias').value.trim(),$('#term-definition').value.trim()];if(!t[0]||!t[2])return toast('请填写术语与业务含义。');s.termIndex<0?s.terms.push(t):s.terms[s.termIndex]=t;s.dirtyTerms=[...new Set([...s.dirtyTerms,s.termIndex<0?s.terms.length-1:s.termIndex])];s.termDirty=true;s.draft=Math.max(1,s.draft+1);closeModal();render();return toast('术语已保存至当前知识库草稿。')}
 case'members':return modal('知识库成员',`<p class="small muted mb16">使用者可问数与预览；管理者可建模和发布。</p><div class="pickrow"><span class="avatar">悦</span><span class="grow">林悦 <small class="muted">创建者 · 示例账号</small></span>${T('可管理','purple')}</div><div class="pickrow"><span class="avatar">宁</span><span class="grow">陈宁 <small class="muted">示例组织</small></span><select id="member-role" class="input" aria-label="陈宁的知识库角色" style="width:125px"><option ${s.memberRole!=='可管理'?'selected':''}>可使用</option><option ${s.memberRole==='可管理'?'selected':''}>可管理</option></select></div><p class="tiny muted mt16">本原型只模拟权限展示，不修改真实成员权限。</p>`,B('完成','member-save','primary'));
 case'member-save':s.memberRole=$('#member-role').value;closeModal();return toast('示例成员角色已更新。');
 case'profile':return modal('个人资料与原型身份',`<div class="row mb16"><span class="avatar">悦</span><div><h3>林悦</h3><p class="small">示例组织 · 产品运营部</p></div></div><p class="small muted mb16">下面只切换原型视角，不改变真实账号权限。</p><div class="field"><label for="role-preview">体验身份</label><select id="role-preview" class="input"><option value="admin" ${s.role==='admin'?'selected':''}>全局管理员</option><option value="manage" ${s.role==='manage'?'selected':''}>知识库管理者</option><option value="query" ${s.role==='query'?'selected':''}>知识库使用者（只读）</option></select></div>`,B('应用视角','role-save','primary'));
 case'role-save':s.role=$('#role-preview').value;closeModal();render();return toast('已切换本地原型视角。');
 case'public-toggle':s.publicEnabled=!s.publicEnabled;s.kbs[1].shared=s.publicEnabled;render();return toast('已更新本地模拟状态，未修改真实共享权限。');
 case'source-new':return modal('新建数据源',`${field('连接名称','source-name','','text','placeholder="例如：产品行为数据库"')}<div class="field"><label for="source-kind">数据库类型</label><select class="input" id="source-kind"><option>MySQL（含Doris协议）</option><option>PostgreSQL</option></select></div><div class="split">${field('主机（示例）','source-host','demo.internal')}${field('端口','source-port','3306')}</div>${field('数据库','source-db','product_demo')}<div class="notice">仅模拟连接配置。请勿输入真实数据库账号、密码或内网凭据。</div>`,B('取消','close')+B('模拟测试并保存','source-save','primary'));
 case'source-save':if(!$('#source-name').value.trim())return toast('请填写连接名称。');s.addedSource={name:$('#source-name').value.trim(),db:$('#source-db').value,kind:$('#source-kind').value};closeModal();toast('演示连接检查成功；未实际连接或保存凭据。');return go('sources');
 case'source-detail':return modal('产品行为数据库',`<p>MySQL · product_demo</p><p class="small mt16">合成连接信息。数据库连接和真实凭据不会由这个原型读取。</p>`,B('关闭','close'));
 case'associate':return modal('关联外部表',`<p class="small muted mb16">只将选中的表加入当前知识库，不复制或修改外部表。</p>${['用户清单','项目清单','访问事件'].map((n,i)=>`<label class="pickrow"><input type="checkbox" ${i<2?'checked':''}><span>${n}</span>${T(i<2?'维度表':'事实表')}</label>`).join('')}<div class="notice mt16">外部事实表还需确认时间字段与查询窗口；上传文件表不设此门禁。</div>`,B('取消','close')+B('下一步：时间范围','external-window','primary'));
 case'external-window':return modal('外部事实表 · 时间范围',`<p class="small muted mb16">访问事件：先确认有限的查询窗口，再开始建模。</p>${field('时间字段','external-time','event_time')}${field('最大查询天数','external-days','31','number','min="1" max="365"')}<div class="notice">仅影响登记的外部事实表。超出范围时需调整问题，不拆分查询规避门禁。</div>`,B('取消','close')+B('保存并整理字段','external-save','primary'));
 case'external-save':closeModal();return go('fields');
 case'service-new':case'service':{s.serviceIndex=act==='service'?Number(arg):-1;const m=s.services[s.serviceIndex]||{name:'',model:'',provider:'OpenAI兼容'};return modal(s.serviceIndex<0?'添加模型服务':'编辑模型服务',field('服务名称','service-name',m.name)+field('模型名称','service-model',m.model)+`<div class="field"><label for="provider">服务类型</label><select class="input" id="provider"><option>OpenAI兼容</option><option>DeepSeek</option><option>Qwen</option></select></div><div class="notice">原型不接收真实API Key。保存、测试与激活均为本地模拟。</div>`,B('取消','close')+B('保存配置','service-save','primary'))}
 case'service-save':{if(!$('#service-name').value.trim()||!$('#service-model').value.trim())return toast('请填写服务名称和模型名称。');const m={name:$('#service-name').value.trim(),model:$('#service-model').value.trim(),provider:$('#provider').value,current:s.services[s.serviceIndex]?.current||false,tested:false};if(s.serviceIndex<0)s.services.push(m);else s.services[s.serviceIndex]=m;closeModal();render();return toast('已保存本地模拟配置。')}
 case'service-test':s.services[Number(arg)].tested=true;render();return toast('模拟连接测试成功，未调用真实模型。');
 case'service-activate':s.services.forEach((m,i)=>m.current=i===Number(arg));render();return toast('模拟激活完成。新轮次使用新服务，在途轮次不变。');
 case'help':return modal('开始使用 Data Agent',`<p class="small muted">从数据到答案，按你的进度继续。</p><div class="helpsteps">${[['1','准备数据','上传Excel / CSV，或连接数据库。','new-kb'],['2','完善业务口径','整理字段、补充文档、处理需要确定的问题。','go:modeling'],['3','检查并发布','核对SQL示例，发布可用于问数的版本。','go:modeling'],['4','提问与继续分析','查看依据，预览下载图表和数据。','go:home']].map(([n,t,d,a])=>`<div class="helpstep"><span class="stepnum">${n}</span><div class="grow"><h3>${t}</h3><p>${d}</p></div>${B('前往',a,'quiet sm','chevron')}</div>`).join('')}</div>`,B('关闭','close')+B('体验完整流程','new-kb','primary','arrow'),true);
 case'about':return modal('关于这份交互原型','<p>基于2026年10月30日代码能力升级。所有数字、人员、模型服务与连接均为合成示例。</p><p class="mt16">上传、建模、试问、发布和权限变更仅更新当前页面内存；刷新后重置。CSV下载是包含7行合成数据的真实本地文件。</p><p class="mt16">例行任务尚未开放；不提供多库问数、Cube/View编辑、知识图谱或自动故障切模型。</p><div class="row wrap mt24"><a href="20261030-design-notes.md" target="_blank" rel="noopener">查看能力核对与设计说明</a><a href="../archive/previews/dataagent-design-preview-20261014.html" target="_blank" rel="noopener">查看旧原型</a></div>',B('知道了','close'));
 case'search':return modal('搜索对话',field('搜索关键词','chat-search','','text','placeholder="搜索标题"')+'<div id="search-results">'+s.history.map((h,i)=>`<div class="settings-row"><span class="grow">${E(h)}</span>${B('打开','history:'+i,'quiet sm','chevron')}</div>`).join('')+'</div>');
 default:return toast('此入口在本原型中用于展示信息结构。');
 }}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b&&!b.disabled){e.preventDefault();handle(b.dataset.action)}else if(e.target.dataset.backdrop)closeModal()});
document.addEventListener('submit',e=>{e.preventDefault();const form=e.target.dataset.form;if(form==='chat'){const text=e.target.querySelector('textarea').value.trim();if(!text)return toast('请先输入问题。');if(!s.kb)return modal('普通对话模式','<p>当前未选择知识库。真实产品可进行普通对话；本原型只演示知识库问数，请先选库。</p>',B('选择知识库','scope','primary'));if(s.kb==='经营指标')return modal('这份知识库的演示范围','<p>经营指标库在此原型中用于展示共享与权限。完整问数演示位于运营分析库，不把经营数据误画成报表访问数据。</p>',B('选择知识库','scope','primary'));if(s.analysis)return analysisParams();s.customQuestion=text;if(/哪些数据|数据范围/.test(text))return modal('当前可用数据',tables.map(t=>`<div class="change-row">${I('table')}<strong class="grow">${t.name}</strong><span>${t.cols}个字段</span></div>`).join('')+'<p class="small muted mt16">以上为合成示例数据清单。</p>',B('继续提问','close'));if(/模块/.test(text))return modal('模块使用情况 · 示例',`<p class="small muted mb16">仅使用点击详情的模块字段；用户数按账号去重。</p><div class="tablewrap"><table><thead><tr><th>模块</th><th>去重用户数</th></tr></thead><tbody><tr><td>数据分析</td><td>342</td></tr><tr><td>报表中心</td><td>218</td></tr><tr><td>项目管理</td><td>105</td></tr></tbody></table></div>`,B('继续提问','close'));if(!/9月|趋势|访问|报表/.test(text))return modal('可体验的问题','<p>这个离线原型提供三类合成示例：9月运营趋势、模块使用情况、数据清单。它不调用模型生成任意答案。</p>',B('体验运营趋势','history:0','primary'));s.vote='';runDemo(false)}else if(form==='model'){const text=e.target.querySelector('textarea').value.trim();if(!text)return toast('请先填写业务需求。');modal('补充业务说明',`<p class="small muted mb16">本地原型会把以下文本作为一条草稿说明保存，不实际执行建模。</p><p>${E(text)}</p>`,B('取消','close')+B('保存为草稿说明','model-note','primary'));}}
);
document.addEventListener('click',e=>{if(e.target.closest('[data-action="model-note"]')){s.ruleEdited=$('#layer .modalbody p:last-child')?.textContent||'';s.draft++;closeModal();render();toast('已保存为本地草稿说明。')}});
document.addEventListener('input',e=>{if(e.target.id==='kb-search')$('#kb-list').innerHTML=kbRows(e.target.value);if(e.target.id==='chat-search')$('#search-results').innerHTML=s.history.map((h,i)=>h.includes(e.target.value)?`<div class="settings-row"><span class="grow">${E(h)}</span>${B('打开','history:'+i,'quiet sm','chevron')}</div>`:'').join('')||'<div class="empty-inline">没有匹配的对话</div>'});
document.addEventListener('change',e=>{if(e.target.id==='source-kind')$('#source-port').value=e.target.value==='PostgreSQL'?'5432':'3306';if(e.target.id==='upload-files'){const fs=[...e.target.files];if(fs.length>10||fs.some(f=>f.size>50*1024*1024)||fs.reduce((n,f)=>n+f.size,0)>100*1024*1024){e.target.value='';return toast('超出演示策略限制：最多10个，单文件50MB，合计100MB。')}s.files=fs.map(f=>({name:f.name,size:f.size}));$('#file-list').innerHTML=fileList()}if(e.target.id==='document-file'){s.docs=[...new Set([...s.docs,...[...e.target.files].map(f=>f.name)])];$('#document-list').innerHTML=s.docs.map(d=>`<div class="row">${I('file')}${E(d)}</div>`).join('')}});
document.addEventListener('keydown',e=>{if(e.target.getAttribute('role')==='tab'&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const tabs=[...e.target.closest('[role=tablist]').querySelectorAll('[role=tab]')];const index=tabs.indexOf(e.target);const next=e.key==='Home'?0:e.key==='End'?tabs.length-1:(index+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length;const act=tabs[next].dataset.action;handle(act);document.querySelector('[data-action=\"'+act+'\"]')?.focus();return;}if(e.key==='Escape'){if($('#layer').innerHTML)closeModal();else if(s.inspector){s.inspector=false;render()}else if(s.trial){s.trial=false;render()}else mobileClose()}if(e.key==='Tab'&&$('#layer').innerHTML){const nodes=[...document.querySelectorAll('.modal button:not(:disabled),.modal input:not([hidden]),.modal textarea,.modal select,.modal a')].filter(n=>n.getClientRects().length);if(!nodes.length)return;const first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&e.target.tagName==='TEXTAREA'){e.preventDefault();e.target.closest('form')?.requestSubmit()}});
window.addEventListener('hashchange',()=>{const r=location.hash.slice(1);if(Object.hasOwn(titles,r)){s.route=r;render()}});
const initial=location.hash.slice(1);if(Object.hasOwn(titles,initial))s.route=initial;render();
