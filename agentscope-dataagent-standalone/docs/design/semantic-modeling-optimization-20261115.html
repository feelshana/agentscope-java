<script>'use strict';
const $=id=>document.getElementById(id);
const icon=name=>`<svg class="i" aria-hidden="true"><use href="#${name}"/></svg>`;
const esc=text=>String(text??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sql=`SELECT
  p.category AS 品类,
  SUM(oi.amount - oi.refund_amount) AS 净销售额
FROM 示例订单 oi
LEFT JOIN 示例商品 p ON oi.product_id = p.product_id
WHERE oi.order_time >= '2026-10-01'
  AND oi.order_time < '2026-11-01'
GROUP BY p.category
ORDER BY 净销售额 DESC`;
const viewSql=`SELECT
  o.order_id,
  o.order_time,
  o.customer_id,
  c.region AS customer_region,
  o.amount - o.refund_amount AS net_amount
FROM 示例订单 o
LEFT JOIN 示例客户 c
  ON o.customer_id = c.customer_id`;
const expandedSql=`-- 草稿展开示例，未执行查询
SELECT category, SUM(amount - refund_amount) AS net_amount
FROM data_agent.ds_example_order_items
LEFT JOIN data_agent.ds_example_products
  ON ds_example_order_items.product_id = ds_example_products.product_id
WHERE order_time >= '2026-10-01'
  AND order_time < '2026-11-01'
GROUP BY category`;
const groups=[['analyse','待分析'],['meaning','待确认口径'],['plan','待批准方案'],['sql','待核对 SQL'],['review','待复核'],['done','已确认']];
const qSeed=[
 {id:'q1',text:'上个月各品类的净销售额是多少？',group:'sql',step:2,sql,definition:'指标：销售金额 − 退款金额，单位为元\n时间：2026-10-01 至 2026-10-31\n范围：按商品品类汇总，包含全部订单状态'},
 {id:'q2',text:'最近 30 天的流失客户有哪些？',group:'meaning',step:1,sql:'',definition:'“流失客户”的判断标准尚未定义。'},
 {id:'q3',text:'各渠道的有效订单数量和销售额',group:'plan',step:1,sql:'',definition:'待确认“有效订单”的过滤规则。'},
 {id:'q4',text:'不同地区客户的客单价排名',group:'review',step:2,sql:`SELECT c.region, SUM(o.amount - o.refund_amount) / COUNT(DISTINCT o.order_id) AS 客单价\nFROM 示例订单 o\nLEFT JOIN 示例客户 c ON o.customer_id = c.customer_id\nGROUP BY c.region\nORDER BY 客单价 DESC`,definition:'指标：订单金额 / 去重订单数\n分组：客户所属地区',reason:'客户与订单的关联口径发生变化，需要按最新草稿重新核对。'},
 {id:'q5',text:'每个月的订单数量变化趋势',group:'done',step:3,sql:`SELECT DATE_FORMAT(order_time, '%Y-%m') AS 月份,\n       COUNT(DISTINCT order_id) AS 订单数\nFROM 示例订单\nGROUP BY DATE_FORMAT(order_time, '%Y-%m')`,definition:'按下单月份统计去重订单数。',published:true},
 {id:'q6',text:'各会员等级的退款金额占比',group:'analyse',step:0,sql:'',definition:''}
];
const assetSeed=[
 {id:'v1',name:'订单与客户地区',technical:'orders_customer_region',kind:'查询模板',status:0,reviewed:false,description:'按客户编号关联订单与客户，保留订单明细粒度，统一提供客户地区和净销售额。',sql:viewSql,time:'order_time',needsTime:true},
 {id:'v2',name:'客户首次下单',technical:'customer_first_order',kind:'查询模板',status:1,reviewed:true,description:'每位客户保留首次下单日期，用于新客与复购口径。',sql:viewSql,time:'order_time',needsTime:false},
 {id:'v3',name:'渠道每日销售',technical:'channel_daily_sales',kind:'加工表',status:2,reviewed:true,description:'按日期和销售渠道预先汇总销售金额。',sql:viewSql,time:'order_time',needsTime:true},
 {id:'v4',name:'订单明细公共口径',technical:'order_details_common',kind:'查询模板',status:3,reviewed:true,description:'供订单金额、退款金额与净销售额的共同查询使用。',sql:viewSql,time:'order_time',needsTime:false}
];
const tableSeed=[{name:'示例订单',included:18,total:22},{name:'示例客户',included:6,total:8},{name:'示例商品',included:9,total:9},{name:'订单明细',included:7,total:7}];
const docSeed=[{name:'经营指标口径.md',status:'UNCHANGED',versions:2},{name:'退款与有效订单规则.docx',status:'ADDED',versions:0}];
const assetLabels=['待核查','待验证','验证通过','已发布'];
let page='coach',mode='normal',questions=[],assets=[],documents=[],tables=[],selectedQ='q1',selectedV='v1',qFilter='',qStep=null,assetTab=0,contextTab='rules',contextVersion='draft',recommendation='q5',questionChoice='0',ownDefinition='',pendingDocument=null,toastTimer,dialogType='';
const picked=new Set(),codeSnippets=new Map();
function resetFixtures(){questions=qSeed.map(q=>({...q}));assets=assetSeed.map(a=>({...a,cases:[],checked:false,fileDirty:false,fileContent:''}));documents=docSeed.map(d=>({...d}));tables=tableSeed.map(t=>({...t}));if(mode==='empty'){questions=[];assets=[];documents=[];tables=[];}if(mode==='unpublished'){questions=[];assets=[];documents.forEach(d=>{d.status='ADDED';d.versions=0;});}selectedQ=questions[0]?.id??null;selectedV=assets[0]?.id??null;qStep=null;assetTab=0;qFilter='';picked.clear();}
function notify(text){$('toast').textContent=text;$('toast').classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('on'),3100);}
function tone(group){return group==='done'?'green':['meaning','plan','review'].includes(group)?'amber':group==='sql'?'purple':'';}
function qLabel(q){if(q.group==='done')return q.published?'已确认 · 已发布':'已确认 · 待发布';return groups.find(g=>g[0]===q.group)?.[1]??'待分析';}
function syntax(text){return esc(text).replace(/\b(SELECT|FROM|WHERE|JOIN|LEFT|ON|AND|GROUP BY|ORDER BY|AS|SUM|COUNT|DESC|LIMIT|WITH)\b/g,'<span class="code-keyword">$1</span>').replace(/(&#39;[^\n]*?&#39;)/g,'<span class="code-string">$1</span>');}
function code(key,title,text){codeSnippets.set(key,{title,text});return `<section class="code-box"><div class="code-head"><span>${esc(title)}</span><span class="grow"></span><button class="link" data-code="${key}">放大阅读</button></div><pre class="code"><code>${syntax(text)}</code></pre></section>`;}
function info(text,style=''){return `<div class="note ${style}">${icon('info')}<span>${text}</span></div>`;}
function heading(title,description,actions=''){return `<header class="page-head"><div><h2>${title}</h2><p>${description}</p></div><div class="head-buttons">${actions}</div></header>`;}
function pageButtons(){return `<button class="btn" id="showContext">${icon('book')}MDL 与规则</button><button class="btn primary" id="addQuestions">${icon('plus')}新增业务问题</button>`;}
function qList(){const shown=questions.filter(q=>!qFilter||q.group===qFilter);return `<aside class="surface list-panel"><header class="list-top"><h3>业务问题 <span class="small">${questions.length}</span><span class="grow"></span><select id="qFilter" aria-label="按问题状态筛选"><option value="">全部状态</option>${groups.map(([key,label])=>`<option value="${key}" ${qFilter===key?'selected':''}>${label}</option>`).join('')}</select></h3><p class="small">按题核对，已确认后仍需统一发布。</p></header><div class="list-items">${shown.length?shown.map(q=>`<div class="q-item ${selectedQ===q.id?'on':''}"><input type="checkbox" data-pick="${q.id}" aria-label="选中 ${esc(q.text)}" ${picked.has(q.id)?'checked':''} ${q.group==='done'?'disabled':''}><button class="q-select" data-question="${q.id}"><strong>${esc(q.text)}</strong><span class="q-meta"><span class="pill ${tone(q.group)}">${qLabel(q)}</span>${recommendation===q.id?'<span class="pill">推荐问题</span>':''}</span></button></div>`).join(''):'<div class="small" style="padding:25px 15px">当前筛选下没有问题。</div>'}</div><footer class="list-footer">${picked.size?`已勾选 ${picked.size} 题 <span class="grow"></span><button class="link" id="analysePicked" ${mode==='busy'?'disabled':''}>重新分析</button>`:`<span>每行一个问题，一次最多 10 个</span><span class="grow"></span><button class="link" id="addQuestionLink">添加</button>`}</footer></aside>`;}
function fixBox(){return `<details class="feedback"><summary>不正确？说明原因，让助手修正口径并重写 SQL</summary><textarea class="input" id="fixReason" rows="2" placeholder="说明需要修正的业务口径或 SQL…"></textarea><button class="btn" id="sendFix" ${mode==='busy'?'disabled':''}>交给助手修正</button></details>`;}
function sqlPane(q){return `${q.reason?info(esc(q.reason),'amber'):''}${q.definition?`<div class="definition">${esc(q.definition)}</div>`:''}${q.sql?code('question-sql','问数助手写的 SQL',q.sql)+`<div class="action-line"><button class="btn" id="expandSQL">查看展开后的 SQL</button></div><div id="expandedQuestion">${q.expanded?code('question-expanded','展开后的 SQL（未执行）',expandedSql):''}</div>`:info('批准的方案已起草，按新口径生成这道题的 SQL。')+`<button class="btn primary" id="generateQuestionSQL" ${mode==='busy'?'disabled':''}>生成 SQL</button>`}${fixBox()}`;}
function meaningPane(q){if(q.group==='plan')return `<section class="proposal"><header class="proposal-head"><span class="pill purple">规则</span><strong>补充有效订单口径</strong></header><p>统计有效订单时，默认排除已取消的订单。</p><p class="small">关联问题：${esc(q.text)}。批准后才起草，不直接影响线上。</p><label class="small" style="display:flex;gap:6px;margin:13px 0"><input type="checkbox" id="approveCheck">批准这项方案</label><div class="action-line"><button class="btn primary" id="approvePlan" disabled>批准并起草</button><button class="link" id="dismissPlan">暂不采用</button></div></section>`;
 if(q.group!=='meaning')return info('这道题不需要补口径或改模型。');
 return `<h4 class="section-title">需要你确定 <span class="small">1/1 · 会影响统计结果</span></h4><p style="font-size:13px;line-height:1.9">“流失客户”应按什么规则判断？</p><p class="small">依据：当前模型中没有流失的业务定义，不能仅凭最近一笔订单自动认定。</p>${[['0','近 30 天没有下单的历史客户','曾经下单，最近 30 天内没有订单。'],['1','近 90 天没有下单的历史客户','曾经下单，最近 90 天内没有订单。'],['own','自己写',''],['none','不采用','不设这条口径，删除这个问题']].map(([value,title,detail])=>`<label class="option"><input type="radio" name="meaning" value="${value}" ${questionChoice===value?'checked':''}><span><strong>${title}</strong>${detail?'<small>'+detail+'</small>':''}</span></label>`).join('')}<textarea id="ownDefinition" class="input" rows="2" placeholder="写下你要的口径" ${questionChoice==='own'?'':'hidden'}>${esc(ownDefinition)}</textarea><p class="error-text" id="meaningError"></p><div class="action-line"><button class="btn primary" id="confirmMeaning">确定</button><button class="btn" id="laterMeaning">稍后</button><button class="link" data-page="materials">上传业务文档</button></div>`;
}
function analysisPane(q){if(q.group==='analyse')return info('助手正在分析这道题，完成后自动刷新。')+`<button class="btn" id="reanalyse" ${mode==='busy'?'disabled':''}>重新分析</button>`;return `<h4 class="section-title">现有能力分析</h4><ul class="findings"><li>${icon('check')}订单表和商品表的关联已存在。</li><li>${icon('check')}金额、退款与日期字段已定义。</li><li class="${['meaning','plan'].includes(q.group)?'gap':''}">${icon(['meaning','plan'].includes(q.group)?'info':'check')}${['meaning','plan'].includes(q.group)?'还缺少明确的业务口径，需要你确认或批准。':'现有模型可以回答；仍需由你核对 SQL。'}</li></ul>${info('结论：'+(['meaning','plan'].includes(q.group)?'需要补充业务定义':'现有模型可以回答'))}<div class="action-line"><button class="btn primary" data-q-step="${q.step}">下一步：${q.step===1?'口径 / 方案':q.step===3?'查看问答':'核对 SQL'}</button><button class="btn" id="reanalyse" ${mode==='busy'?'disabled':''}>重新分析</button></div>`;}
function confirmedPane(q){return `${info('已确认，保存为问答。'+(q.published?'已发布，问数时可以被召回。':'待发布：在页面底部草稿栏统一发布后，问数时才会召回。'),'green')}<div class="action-line" style="margin:0 0 16px">${recommendation===q.id?'<span class="pill purple">推荐问题</span><button class="link" id="cancelRecommended">取消，恢复自动生成</button>':'<button class="btn" id="setRecommended">设为推荐问题</button>'}</div><p class="small">问数页选中这个知识库时会预填推荐问题，新手任务也用它做起步问题。</p>${code('confirmed-sql','已确认的 SQL',q.sql)}${fixBox()}`;}
function qBench(){const q=questions.find(q=>q.id===selectedQ);if(!q)return `<section class="surface"><div class="bench-body"><h3 style="font-size:16px">处理概况</h3><div class="overview-grid">${groups.map(([key,label])=>`<button class="overview-count" data-filter="${key}"><b>${questions.filter(q=>q.group===key).length}</b><span>${label}</span></button>`).join('')}</div><p class="small">点左侧任意一道题开始处理。</p></div></section>`;
 const step=qStep??q.step;return `<section class="surface"><header class="bench-head"><div class="grow"><h3>${esc(q.text)}</h3><div class="small">${q.group==='review'?'模型变动后请重新核对。':'按当前草稿分析；发布后问数才会使用。'}</div></div><span class="pill ${tone(q.group)}">${qLabel(q)}</span></header><nav class="step-tabs" aria-label="问题处理步骤">${['分析','口径 / 方案','SQL','保存问答'].map((label,i)=>`<button data-q-step="${i}" class="${step===i?'on':''}" aria-current="${step===i?'step':'false'}" ${i>q.step?'disabled':''}><span>${i<q.step?'✓':i+1}</span>${label}</button>`).join('')}</nav><div class="bench-body">${step===0?analysisPane(q):step===1?meaningPane(q):step===2?sqlPane(q):confirmedPane(q)}</div><footer class="bench-bottom"><span class="small">只检查 SQL 怎么写，不查询数据。</span>${step===2&&q.sql&&q.group!=='done'?'<button class="btn primary" id="confirmSQL">确认 SQL 正确</button>':step===3?'<span class="pill green">已确认</span>':''}</footer></section>`;}
function coachPage(){let result=heading('问数优化','用业务最常问的问题检查模型：补齐口径、核对 SQL，再把正确的问答保存为示例。',pageButtons());
 if(mode==='unpublished')return result+`<section class="surface locked"><div class="empty"><div class="empty-icon">${icon('spark')}</div><h3>先完成首次建模并发布</h3><p>发布后再用业务常问的问题检查模型，避免在基础模型尚未就绪时开始优化。</p><button class="btn primary" data-notice="正式产品返回语义模型完成首次发布">去建模 →</button></div></section>`;
 result+=methodFlow('coach');
 result+=`<div class="note" style="margin-top:0">${icon('info')}<span>所有修改先进草稿。已有 ${documents.filter(d=>d.status!=='DELETED').length} 份业务文档，文档里写明的口径会直接采用。</span><span class="grow"></span><button class="link" data-page="materials" style="white-space:nowrap">管理文档 →</button></div>`;
 if(mode==='busy')result+=info('<span class="spinner" style="vertical-align:-3px;margin-right:6px"></span>助手正在处理，完成后会刷新问题状态。');
 if(!questions.length)return result+`<section class="surface"><div class="empty"><div class="empty-icon">${icon('chat')}</div><h3>从业务最常问的问题开始</h3><p>挑选你最关心、又担心答不准的问题。带“有效”“流失”等口径词，跨表统计、排名或占比的问题，都适合从这里核对。</p><button class="btn primary" id="addFirstQuestions">${icon('plus')}写下常问的问题</button><div class="chips"><button class="chip" data-seed-question="上个月各品类的净销售额是多少？">上个月各品类的净销售额是多少？</button><button class="chip" data-seed-question="最近 30 天的流失客户有哪些？">最近 30 天的流失客户有哪些？</button></div></div></section>`;

rong><br>调整纳入范围后，助手只重新建模这张表。</p><div class="help-divider"></div><p><strong>文档提供业务依据</strong><br>把指标定义、过滤规则、术语和例外情况写清楚，可以减少反复确认。</p><div class="help-divider"></div><p><strong>所有修改先进草稿</strong><br>核对并发布后，新的业务口径才用于问数；线上版本保持独立。</p><button class="link" data-page="coach">用常问的问题检查口径 →</button></aside></div>`;}

const documentSamples={
 '经营指标口径.md':`# 经营指标口径

本说明用于统一订单、退款与客户分析中的指标定义。内容为设计稿示例。

## 统计范围

- 一行订单明细代表一笔订单中的一个商品行。
- **订单数按订单编号去重**，金额按明细行汇总。
- 查询时需明确时间范围，不将采样值视为全量数据。

## 核心指标

| 指标 | 计算方式 | 单位 |
| --- | --- | --- |
| 销售金额 | 汇总订单明细中的销售金额 | 元 |
| 退款金额 | 汇总订单明细中的退款金额 | 元 |
| 净销售额 | 销售金额 − 退款金额 | 元 |
| 客单价 | 销售金额 ÷ 去重订单数 | 元/单 |

净销售额与销售金额不是同一个指标，展示时应使用完整的指标名称。

## 时间口径

统计按下单时间 \`order_time\` 归属。自然月使用月初起、下月月初止的范围，避免遗漏月末的时间值。

> 示例：2026 年 10 月的范围为 2026-10-01（含）至 2026-11-01（不含）。

## 客户关联

订单按 \`customer_id\` 与客户表关联。客户侧唯一性需要业务确认，不能仅由同名字段或采样推断。

## 发布与使用

文档的新增、替换和删除进入草稿。核对相关模型与口径并发布后，问数才使用新版本。`,
 '退款与有效订单规则.docx':`# 退款与有效订单规则

本文为 Word 文档正文阅读的设计示例，供业务同事核对规则。

## 订单状态

“有效订单”指排除已取消状态后的订单。涉及订单状态的过滤，应在问题口径中明确说明。

| 场景 | 处理方式 |
| --- | --- |
| 已完成订单 | 纳入有效订单 |
| 已取消订单 | 不纳入有效订单 |
| 部分退款订单 | 保留订单，退款按实际退款金额扣减 |

## 退款口径

1. 退款金额按明细行汇总，金额单位为元。
2. 净销售额等于销售金额减去退款金额。
3. 涉及退款时间归属的问题，需要先明确使用下单时间还是退款发生时间。

## 需要业务确认的情况

- 全额退款是否仍计入有效订单数。
- 跨月退款归属在哪一个统计月份。
- 没有匹配到客户资料的订单应如何处理。

没有明确依据时，先确认业务口径，再将规则写入草稿。`

function highlightDocumentText(text,query=''){
 text=String(text);if(!query)return esc(text);
 const haystack=text.toLocaleLowerCase(),needle=query.toLocaleLowerCase();
 let result='',position=0,index=0;
 while((index=haystack.indexOf(needle,position))!==-1){result+=esc(text.slice(position,index))+'<mark>'+esc(text.slice(index,index+query.length))+'</mark>';position=index+query.length;}
 return result+esc(text.slice(position));
}
function inlineDocument(text,query=''){
 // Source HTML and links remain text; only these two inline styles are supported.
 const pattern=/(\*\*([^*\n]+)\*\*|`([^`\n]+)`)/g;let result='',position=0,match;
 while((match=pattern.exec(text))){result+=highlightDocumentText(text.slice(position,match.index),query);result+=match[2]?'<strong>'+highlightDocumentText(match[2],query)+'</strong>':'<code>'+highlightDocumentText(match[3],query)+'</code>';position=pattern.lastIndex;}
 return result+highlightDocumentText(text.slice(position),query);
}
function renderDocumentMarkdown(text,query=''){
 const lines=String(text).replace(/\r\n?/g,'\n').split('\n'),toc=[];let html='',i=0;
 const tableCells=line=>line.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(x=>x.trim());
 const startsBlock=line=>/^(#{1,6}\s|[-*]\s|\d+\.\s|```|>\s|\|)/.test(line);
 while(i<lines.length){const line=lines[i];if(!line.trim()){i++;continue;}
  if(/^```/.test(line)){const body=[];i++;while(i<lines.length&&!/^```/.test(lines[i]))body.push(lines[i++]);if(i<lines.length)i++;html+='<pre><code>'+highlightDocumentText(body.join('\n'),query)+'</code></pre>';continue;}
  const heading=/^(#{1,6})\s+(.+)$/.exec(line);
  if(heading){const level=Math.min(heading[1].length,3),id='document-heading-'+toc.length;toc.push({id,text:heading[2],level});html+=`<h${level} id="${id}">${inlineDocument(heading[2],query)}</h${level}>`;i++;continue;}
  if(line.includes('|')&&i+1<lines.length&&/^\s*\|?\s*:?-{3,}/.test(lines[i+1])){const header=tableCells(line);html+='<div class="doc-table-scroll"><table><thead><tr>'+header.map(cell=>'<th>'+inlineDocument(cell,query)+'</th>').join('')+'</tr></thead><tbody>';i+=2;while(i<lines.length&&lines[i].includes('|')&&lines[i].trim()){html+='<tr>'+tableCells(lines[i]).map(cell=>'<td>'+inlineDocument(cell,query)+'</td>').join('')+'</tr>';i++;}html+='</tbody></table></div>';continue;}
  if(/^[-*]\s+/.test(line)||/^\d+\.\s+/.test(line)){const ordered=/^\d+\./.test(line),type=ordered?'ol':'ul',pattern=ordered?/^\d+\.\s+/:/^[-*]\s+/;html+='<'+type+'>';while(i<lines.length&&pattern.test(lines[i]))html+='<li>'+inlineDocument(lines[i++].replace(pattern,''),query)+'</li>';html+='</'+type+'>';continue;}
  if(/^>\s?/.test(line)){const quote=[];while(i<lines.length&&/^>/.test(lines[i]))quote.push(lines[i++].replace(/^>\s?/,''));html+='<blockquote>'+inlineDocument(quote.join(' '),query)+'</blockquote>';continue;}
  const paragraph=[line];i++;while(i<lines.length&&lines[i].trim()&&!startsBlock(lines[i])){if(i+1<lines.length&&/^\s*\|?\s*:?-{3,}/.test(lines[i+1]))break;paragraph.push(lines[i++]);}html+='<p>'+inlineDocument(paragraph.join('\n'),query).replace(/\n/g,'<br>')+'</p>';
 }
 return {html,toc};
}
