# Include inside the chosen HTTPS server block. Replace matching locations, do not duplicate them.
# Copy the static simulator files and external private config to this dedicated directory.
location = /bi-sim { return 302 /bi-sim/; }
location /bi-sim/ {
    alias /data/app/dataagent/bi-sim/;
    index bi-simulator.html;
    autoindex off;
    # Keep module scripts executable even when the system MIME map omits mjs.
    types {
        text/html html;
        text/css css;
        application/javascript js mjs;
        application/json json;
    }
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}

# Build the frontend with DATAAGENT_BASE_PATH=/dataagent/ before packaging the application.
location = /dataagent { return 302 /dataagent/; }
location /dataagent/ {
    proxy_pass http://127.0.0.1:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    client_max_body_size 100m;
}
