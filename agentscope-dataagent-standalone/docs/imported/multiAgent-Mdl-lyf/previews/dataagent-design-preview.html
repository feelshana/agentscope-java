function searchbox(placeholder,oninput,value=''){return `<label class="search">${icon('search')}<input aria-label="${placeholder}" placeholder="${placeholder}" value="${esc(value)}" oninput="${oninput}"></label>`}
function chatComposer(isWelcome=false){return `<div class="composer"><div class="composerbox"><textarea id="ask" aria-label="输入数据问题" placeholder="${isWelcome?'想了解业务的哪个方面？':'继续提问，或调整分析范围…'}"></textarea><div class="composerfoot"><button class="scope" onclick="selectKB()">${icon('book')} 电商场景 ${icon('down')}</button><span class="spacer"></span><button class="send" aria-label="发送问题" onclick="go('answer')">${icon('up')}</button></div></div>${!isWelcome?'<div class="helper">结合业务口径核对分析结果</div>':''}</div>`}
function chatPage(){return `<div class="welcome"><div class="row mb24"><span class="spark">${icon('spark')}</span><span class="small sub">红海 DataAgent</span></div><h1>从一个问题，开始理解业务。</h1><p>选择知识库，查询数据、分析变化或生成报告。</p>${chatComposer(true)}<div class="prompts">${[['chart','分析销售表现','2025 年 9 月，各品类的销售额是多少？'],['layers','比较业务变化','各渠道对销售额的贡献有什么差异？'],['file','生成经营报告','总结本月销售情况，生成分析报告。']].map(([ic,t,d])=>`<button class="prompt" onclick="go('answer')">${icon(ic)}<strong>${t}</strong>${d}</button>`).join('')}</div><p class="sample-note" style="margin-top:24px">示例知识库：电商场景 · 4 个数据集 · 已发布 v${state.release}</p></div>`}
function answerPage(){return `<div class="answer"><div class="bubble">统计 2025 年 9 月各品类销售额，仅排除已取消订单。</div><div class="convtitle"><span class="spark">${icon('spark')}</span><strong style="font-size:13px">红海 DataAgent</strong><span class="spacer"></span><span class="badge green">分析完成</span></div><details><summary>查看分析过程 · 读取模型、查询数据、生成图表</summary><p class="small">使用电商场景已发布 v${state.release}，基于订单明细金额汇总，按商品品类分组。</p></details><h2>家用电器与手机数码贡献最多</h2><p>本次统计范围为 2025 年 9 月，仅排除已取消订单。家用电器销售额位居第一，与手机数码合计约占总销售额的 47.5%。</p><div class="metrics"><div class="metric"><small>销售总额</small><strong>754.23</strong><span>万元</span></div><div class="metric"><small>去重订单数</small><strong>159</strong><span>笔</span></div><div class="metric"><small>统计品类</small><strong>5</strong><span>类</span></div></div><div class="panel"><div class="tablewrap"><table><thead><tr><th>品类</th><th>销售额（元）</th><th>订单数</th></tr></thead><tbody>${[['家用电器','1,808,854.32',79],['手机数码','1,777,174.08',79],['美妆个护','1,404,014.95',77],['服装鞋帽','1,338,084.49',80],['食品饮料','1,214,174.71',69]].map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div><p class="sample-note mt8">一个订单可包含多个品类，品类订单数不可直接相加。</p><div class="filelist mt24"><button class="filechip" onclick="downloadDemo()">${icon('file')}品类销售额.csv ${icon('download')}</button><button class="filechip" onclick="showEvidence()">${icon('code')}查看查询依据</button></div><div class="row mt16"><span class="small muted">这次分析是否准确？</span><button class="btn quiet sm" onclick="this.classList.add('soft');toast('示例反馈已记录')">${icon('thumb')}准确</button><button class="btn quiet sm" onclick="feedback()">需要调整</button></div>${chatComposer()}</div>`}
function libraryPage(){const found=kbs.filter(k=>(k.name+k.desc).includes(state.kbSearch));return head('知识库','组织业务数据，建立可复用的分析基础。',btn('数据源管理',"go('sources')",'','database')+btn('创建知识库','editLibrary()','primary','plus'))+`<div class="toolbar">${searchbox('搜索知识库名称或说明',"state.kbSearch=this.value;updateLibraryResults()",state.kbSearch)}<span class="small muted" id="kbcount">${found.length} 个知识库</span><span class="spacer"></span><select class="select" aria-label="知识库排序" onchange="sortLibraries(this.value)"><option value="date">最近创建</option><option value="name">名称排序</option></select><button class="iconbtn" aria-label="切换卡片或列表" onclick="state.viewMode=state.viewMode==='grid'?'list':'grid';render()">${icon(state.viewMode==='grid'?'list':'grid')}</button></div><div id="kbresults">${libraryResults(found)}</div><div class="previewfooter">知识库描述、创建人和模型状态集中展示，便于选择合适的数据范围。</div>`}
function libraryResults(found){if(!found.length)return `<div class="empty"><h2>没有找到匹配的知识库</h2><p>试试更简短的名称，或清空搜索。</p></div>`;if(state.viewMode==='list')return `<div class="panel"><table><thead><tr><th>知识库</th><th>说明</th><th>创建人</th><th>模型状态</th><th></th></tr></thead><tbody>${found.map(k=>`<tr><td><button class="link" onclick="go('kb')">${k.name}</button></td><td>${k.desc}</td><td>${k.creator}</td><td>${badge(k.status,'green')}</td><td>${btn('查看',"go('kb')",'quiet sm')}</td></tr>`).join('')}</tbody></table></div>`;return `<div class="cardgrid">${found.map((k,i)=>`<article class="kbcard"><div class="row"><span class="heading-icon">${icon('book')}</span><h2>${esc(k.name)}</h2><span class="spacer"></span><button class="iconbtn" aria-label="${k.name}的更多操作" onclick="kbMenu(this,${kbs.indexOf(k)})">${icon('more')}</button></div><p>${esc(k.desc)}</p><div class="meta"><span>${k.count} 个数据集</span><span>${k.creator} 创建</span></div><div class="row mt16">${badge(k.status,i===0?'green':'')}<span class="spacer"></span><small class="muted" style="font-size:10px">${k.date}</small></div><footer><button class="link sub" onclick="go('kb')">查看详情 ${icon('arrow')}</button><button class="link" onclick="go('chat')">${icon('chat')} 基于此库提问</button></footer></article>`).join('')}</div>`}
function updateLibraryResults(){const found=kbs.filter(k=>(k.name+k.desc).includes(state.kbSearch));document.getElementById('kbresults').innerHTML=libraryResults(found);document.getElementById('kbcount').textContent=found.length+' 个知识库'}
function sortLibraries(order){kbs.sort((a,b)=>order==='name'?a.name.localeCompare(b.name,'zh'):b.date.localeCompare(a.date));updateLibraryResults()}
function kbMenu(el,i){menu(el,[['编辑名称与说明',`editLibrary(${i})`,'edit'],['语义建模',"go('modeling')",'layers'],['删除知识库',`deleteLibrary(${i})`,'trash','red']])}
function kbPage(){return head('电商场景','整合订单、商品与客户数据，分析销售表现、渠道贡献和客户行为。',btn('编辑信息','editLibrary(0)','','edit')+btn('基于此库提问',"go('chat')",'primary','chat'),'知识库')+`<div class="row small muted mb24"><span>${icon('table')} 4 个数据集</span><span>admin 创建</span><span>2026/10/10</span>${badge('已发布 v'+state.release,'green')}</div><div class="tabs"><button class="active">数据集 ${badge('4')}</button><button onclick="go('modeling')">语义建模 ${icon('external')}</button></div><div class="toolbar">${searchbox('搜索数据集',"filterRows(this.value,'datasets-table')")}<span class="spacer"></span>${btn('关联数据源','linkSource()','','link')}${btn('上传文件','uploadModal(\'data\')','primary','upload')}</div><div class="panel"><div class="tablewrap"><table id="datasets-table"><thead><tr><th>数据集</th><th>来源</th><th>行数</th><th>字段数</th><th>来源文件</th><th></th></tr></thead><tbody>${datasets.map(d=>`<tr><td><button class="namecell" onclick="go('dataset')">${icon('table')}${d[0]}</button></td><td>${badge('文件上传')}</td><td>${d[1]}</td><td>${d[2]}</td><td>${d[3]}</td><td>${btn('查看详情',"go('dataset')",'quiet sm','chev')}</td></tr>`).join('')}</tbody></table></div><div class="tablefoot"><span>共 4 个数据集</span><span>已全部显示</span></div></div><div class="notice mt24">${icon('layers')}<div><strong>继续完善业务口径</strong><p class="small">已有基础模型，可直接问数。补充业务规则有助于减少销售额、订单状态等口径歧义。</p></div><span class="spacer"></span>${btn('进入语义建模',"go('modeling')",'sm')}</div>`}
function datasetPage(){return head('订单明细',esc(datasets[0][4]),btn('编辑数据集描述','editDescription()','','edit'),'文件上传的数据集')+`<div class="row small muted mb24"><span>4,339 行</span><span>7 个字段</span><span>订单明细.xlsx</span></div><div class="tabs">${[['preview','数据预览'],['fields','字段信息'],['technical','技术信息']].map(([k,t])=>`<button class="${state.datasetTab===k?'active':''}" onclick="state.datasetTab='${k}';render()">${t}</button>`).join('')}</div>${state.datasetTab==='preview'?`<div class="toolbar"><span class="small sub">前 20 行预览</span><span class="small muted">当前原型展示 6 行示例</span></div><div class="panel"><div class="scrollpreview"><table><thead><tr>${fields.map(f=>`<th>${f[1]}<div class="muted" style="font-weight:400;font-size:10px;margin-top:5px">${f[0]}</div></th>`).join('')}</tr></thead><tbody>${sampleRows.map(r=>`<tr>${r.map((c,j)=>`<td class="${j>3?'num':''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="tablefoot"><span>数据预览不会修改源数据</span><span>金额单位：元</span></div></div>`:state.datasetTab==='fields'?`<div class="toolbar"><span class="small sub">明确字段的含义，帮助模型理解业务。</span><span class="spacer"></span>${btn('编辑字段说明','editFields()','','edit')}</div><div class="panel"><table><thead><tr><th>字段名称</th><th>显示名称</th><th>数据类型</th><th>业务说明</th></tr></thead><tbody>${fields.map(f=>`<tr><td><code class="purple">${f[0]}</code></td><td>${f[1]}</td><td>${badge(f[2],'purple')}</td><td style="max-width:480px">${f[3]}</td></tr>`).join('')}</tbody></table></div>`:`<div class="panel" style="max-width:760px"><div class="panelbody"><div class="keyvalue" style="grid-template-columns:120px 1fr"><span>所属知识库</span><span>电商场景</span><span>来源类型</span><span>文件上传</span><span>来源文件</span><span>订单明细.xlsx</span><span>物理库表</span><code>data_agent.ds_example_order_items</code><span>数据行数</span><span>4,339 行</span></div></div></div>`}`}
function modelShell(){const published=state.stage==='published';return `<header class="pagehead modelhead"><div><div class="eyebrow">电商场景</div><div class="row"><h1>语义建模</h1>${badge(published?'与已发布版本一致':state.stage==='initial'?'基础模型已就绪':'有未发布变更',published?'green':'amber')}</div><div class="versionline"><span class="dot green"></span><span>问数使用已发布 v${state.release}</span><span>草稿发布后生效</span></div></div><div class="actions">${btn(state.page==='assets'?'返回对话建模':'查看语义资产',state.page==='assets'?"go('modeling')":"go('assets')",state.page==='assets'?'':'soft',state.page==='assets'?'chat':'layers')}</div></header><nav class="stepnav" aria-label="建模流程">${[['prepare','数据准备','1'],['modeling','对话建模','2'],['publish','检查与发布','3']].map(([p,t,n])=>`<button class="${state.page===p?'active':''}" onclick="go('${p}')"><span class="stepnum ${n==='1'?'done':''}">${n==='1'?icon('check'):n}</span>${t}</button>`).join('')}<span class="spacer"></span><button class="optional ${state.page==='questions'?'active':''}" onclick="go('questions')">${icon('check')}问题验证 <span class="muted small">可选</span></button></nav>${state.page==='prepare'?preparePage():state.page==='assets'?assetsPage():state.page==='questions'?questionsPage():state.page==='publish'?publishPage():modelingPage()}`}
function scenarioControl(){return `<div class="mode-toolbar"><span>业务目标、口径与变更，在这里一起确认。</span><label>预览状态<select class="select" aria-label="预览建模状态" onchange="setStage(this.value)">${[['initial','首次进入'],['thinking','分析中'],['review','待审阅方案'],['applied','已写入草稿'],['error','校验未通过'],['published','已发布']].map(([v,t])=>`<option value="${v}" ${state.stage===v?'selected':''}>${t}</option>`).join('')}</select></label></div>`}
function setStage(s){state.stage=s;state.validated=s==='applied'||s==='published';render()}
function preparePage(){return `<div class="row between mb24"><div><h2>准备好数据，就可以开始</h2><p class="small mt8">业务文档和常用问题可随时补充。</p></div>${badge('基础模型已发布','green','check')}</div><div class="prepgrid"><section class="panel"><div class="panelhead"><h3>数据集</h3>${btn('管理数据',"go('kb')",'quiet sm','external')}</div><div class="panelbody">${datasets.map(d=>`<div class="listrow"><span class="fileicon">${icon('table')}</span><div><h3>${d[0]}</h3><p>${d[1]} 行 · ${d[2]} 个字段</p></div><span class="spacer"></span>${badge('已就绪','green')}</div>`).join('')}</div></section><section class="panel"><div class="panelhead"><h3>业务资料 <span class="muted small" style="font-weight:400">可选</span></h3>${btn('上传文档',"uploadModal('business')",'quiet sm','upload')}</div><div class="panelbody">${state.document?`<div class="listrow"><span class="fileicon">${icon('file')}</span><div><h3>电商业务口径说明.md</h3><p>说明指标定义、订单状态与渠道归属</p></div><span class="spacer"></span><button class="iconbtn" title="查看业务文档" onclick="showDocument()">${icon('external')}</button></div><div class="notice mt16">${icon('info')}<div>资料用于辅助理解业务。生成的口径变更会先提交给你审阅。</div></div><button class="link mt16" onclick="documentProposals()">查看文档提案 ${icon('arrow')}</button>`:`<div class="dropzone" onclick="uploadModal('business')">${icon('upload')}<strong>补充一份业务说明</strong>支持 Markdown、Word 和纯文本<br><small class="muted">没有文档也可以直接开始对话</small></div>`}<div class="divider"></div><div class="row between"><h3>常用分析问题 <span class="muted small">可选</span></h3><button class="link" onclick="addQuestions()">${icon('plus')}添加问题</button></div><p class="small mt8">例如：销售额如何计算？订单渠道与客户注册渠道有什么区别？</p></div></section></div><div class="footaction"><span class="small muted">已发布的基础模型也可直接用于问数</span>${btn('开始对话建模',"setStage('initial');go('modeling')",'primary','arrow')}</div>`}
function modelingPage(){const s=state.stage;return scenarioControl()+`<div class="modelgrid"><section class="conversation" aria-label="建模对话"><div class="convtitle"><span class="spark">${icon('spark')}</span><h3>建模助手</h3><small>理解业务，完善模型</small><span class="spacer"></span><button class="iconbtn" title="业务资料" onclick="showDocument()">${icon('file')}</button></div>${s==='initial'?`<div style="padding:50px 10px 34px"><h2 style="font-size:23px">让模型理解你的业务口径</h2><p class="mt16">我已经读取订单、订单明细、商品和客户数据。你可以告诉我指标如何计算，或从一个常用分析问题开始。</p><div class="stack mt24"><button class="prompt" onclick="startDemo('梳理销售额、订单数和平均订单金额的业务口径。')">${icon('sliders')}梳理销售额与订单统计口径</button><button class="prompt" onclick="startDemo('请阅读业务文档，整理需要补充的模型定义。')">${icon('file')}根据业务文档完善现有模型</button></div></div>`:`<div class="bubble">${esc(state.message||'保留原销售额口径，再增加一个「已完成订单销售额」，只统计已完成的订单。')}</div><div class="assistant"><div class="progressline">${s==='thinking'?'<span class="spinner"></span>':'<span class="green">'+icon('check')+'</span>'}${s==='thinking'?'正在读取模型与业务规则':'已检查现有模型和视图'}<button class="link" style="font-size:11px;margin-left:auto" onclick="showRunDetails()">查看过程</button></div>${s==='thinking'?`<p>正在核对订单状态与现有销售额定义，整理可以复用的字段和关联关系。</p><div class="notice mt24"><span class="spinner"></span><span>完成后会显示方案供你审阅。</span></div><div class="mt16">${btn('查看生成后的方案',"setStage('review')",'soft sm')}</div>`:s==='error'?`<p>方案已写入草稿，但工程检查发现一处字段引用问题。<strong>当前问数仍使用已发布 v${state.release}。</strong></p><div class="notice red mt16">${icon('alert')}<div><strong>找不到字段 orders.order_status</strong><p class="small">订单表实际使用 status 字段。需要修正视图引用后重新检查。</p></div></div><div class="mt16">${btn('让助手修复并重新检查','repairDemo()','primary','spark')}</div>`:s==='published'?`<p>新的业务模型已发布为 <strong>v${state.release}</strong>。问数现在可以使用「已完成订单销售额」。</p><p>原销售额定义已保留；两个指标的区别可以在视图详情中查看。</p><div class="mt16">${btn('开始问数',"go('chat')",'primary','chat')}</div>`:s==='applied'?`<p>方案已写入草稿，<strong>工程检查已通过</strong>。新增视图与业务规则将在发布后用于问数。</p><p>你可以先试问一个问题，也可以直接检查变更并发布。</p><div class="row mt16">${btn('检查与发布',"go('publish')",'primary','arrow')}${btn('试问验证',"go('questions')",'','check')}</div>`:`<p>可以。现有「销售明细」会继续保留，我们新增一个<strong>「已完成销售明细」</strong>视图，用于单独计算已完成订单销售额。</p><div class="mini-facts"><div><small>原销售额</small><strong>仅排除「已取消」</strong></div><div><small>已完成订单销售额</small><strong>仅保留「已完成」</strong></div></div><p>金额仍按订单明细的 <span class="tinycode">amount</span> 求和，保持明细粒度。渠道使用订单归属渠道，时间使用订单日期。</p><p>请审阅右侧方案。采纳后写入草稿，正式问数在发布后使用。</p>`}</div>`}<div class="composer"><div class="composerbox"><textarea id="model-message" aria-label="建模消息" placeholder="补充业务口径，或告诉我需要调整的地方…"></textarea><div class="composerfoot"><button class="iconbtn" title="上传业务文档" onclick="uploadModal('business')">${icon('plus')}</button><button class="scope" onclick="showDocument()">${icon('file')}业务资料</button><button class="scope" onclick="addQuestions()">${icon('chat')}常用问题</button><button class="send" aria-label="发送建模消息" onclick="sendModel()">${icon('up')}</button></div></div><div class="helper">方案需经你采纳后写入草稿，发布后生效。</div></div></section>${s==='initial'?modelContext():proposalPanel()}</div>`}
function modelContext(){return `<aside class="reviewpanel"><div class="reviewhead"><span class="badge">当前知识库</span><h2>电商场景</h2><p>开始前，了解已有的分析基础。</p></div><div class="reviewbody"><div class="change"><div class="row"><h3>基础数据</h3><span class="spacer"></span><span class="muted small">4 张表</span></div>${datasets.map(d=>`<div class="row mt16 small sub">${icon('table')}${d[0]}<span class="spacer"></span><small class="muted">${d[2]} 字段</small></div>`).join('')}</div><div class="change"><h3>业务资料</h3><button class="link mt8" onclick="showDocument()">${icon('file')}电商业务口径说明.md</button></div><div class="change"><h3>当前可用模型</h3><p>已发布 v${state.release}，可以直接开始问数。</p><button class="link mt8" onclick="go('assets')">查看语义资产 ${icon('arrow')}</button></div></div></aside>`}

function assetsPage(){const groups=[['models','table','基础模型','4'],['derived','branch','派生模型','0'],['relations','link','表关系','3'],['views','layers','业务视图','2'],['rules','term','术语与规则','3'],['files','code','技术文件','']];return `<div class="mode-toolbar"><span>当前草稿中的语义资产</span><span>问数使用已发布 v${state.release} ${badge('草稿','purple')}</span></div><div class="assetlayout"><nav class="assetnav" aria-label="语义资产分类"><div class="sectionlabel">语义资产</div>${groups.map(([v,ic,t,n])=>`<button class="${state.asset===v?'active':''}" onclick="state.asset='${v}';render()">${icon(ic)}${t}<small>${n}</small></button>`).join('')}</nav><section class="assetbody">${assetContent()}</section></div><p class="sample-note mt16">关系仅展示语义模型中的表关联，不启用已暂缓的知识图谱功能。当前数量与内容均为设计示例。</p>`}

if(a==='views')return `<div class="row"><h2>业务视图</h2><span class="spacer"></span>${btn('新建视图',"editView()",'sm','plus')}</div><p class="small mb24">将可复用的业务查询沉淀为明确的分析口径。</p>${[['已完成销售明细','仅统计已完成订单，保留订单明细粒度，用于已完成订单销售额分析。','本次新增'],['销售明细','排除已取消订单，保留其余订单状态，用于销售额、订单数和渠道分析。','沿用现有']].map(([t,d,st],i)=>`<div class="assetrow"><span class="heading-icon">${icon('layers')}</span><div class="details"><div class="row between"><h3>${t}</h3>${badge(st,i===0?'green':'')}</div><p>${d}</p><div class="assetmeta"><span>明细粒度</span><span>订单渠道</span><span>订单日期</span></div></div><button class="iconbtn" aria-label="查看${t}" onclick="showAssetDetail('${t}','view')">${icon('chev')}</button></div>`).join('')}<div class="notice mt24">${icon('info')}视图只是业务查询定义，不会修改数据库中的原始记录。</div>`;

return `<div class="row"><h2>技术文件</h2><span class="spacer"></span><select class="select" aria-label="技术文件版本" onchange="updateFileCode(this.value)"><option value="draft">当前草稿</option><option value="published">已发布 v${state.release}</option><option value="diff">查看差异</option></select></div><div class="row mb24"><span class="scope">${icon('folder')}views</span><select class="select" aria-label="选择技术文件" onchange="changeFile(this.value)"><option value="sql">已完成销售明细.sql</option><option value="yaml">metadata.yml</option><option value="rules">rules.md</option></select></div><pre class="codebox" id="file-code">${esc(sql)}</pre><p class="sample-note mt16">技术文件集中查看，便于核对定义和定位问题；业务修改仍通过可审阅的建模流程完成。</p>`}

function questionsPage(){const names={EXECUTED:['待业务确认','amber'],CONFIRMED:['已确认','green'],STALE:['需重新验证',''],FAILED:['验证失败','red'],REJECTED:['已退回','red'],DRAFT:['待验证','']};const q=state.question;const st=state.questionStates[q]||'DRAFT';return `<div class="row between mb24"><div><h2>验证常用分析问题</h2><p class="small mt8">查看查询依据与实际结果，确认后可沉淀为问数示例。</p></div>${btn('添加问题','addQuestions()','','plus')}</div><div class="notice mb24">${icon('info')}<span>问题验证可选。未测试或未确认的问题不阻碍发布；工程检查仍须通过。</span></div><div class="questionlayout"><nav class="questionlist" aria-label="分析问题">${state.questions.map((t,i)=>{const [label,color]=names[state.questionStates[i]||'DRAFT'];return `<button class="${q===i?'active':''}" onclick="state.question=${i};render()"><div>${esc(t)}</div>${badge(label,color)}</button>`}).join('')}</nav><section class="questionbody"><div class="row">${badge(...names[st])}<span class="spacer"></span><span class="small muted">${st==='STALE'?'上一次验证结果':'当前草稿 · 示例结果'}</span></div><h2>${esc(state.questions[q])}</h2><p class="small">${q===1?'按订单明细金额求和，仅保留已完成订单。':'按订单日期统计，销售额使用订单明细金额，排除已取消订单。'}</p>${st==='STALE'?`<div class="notice amber mt16">${icon('alert')}模型已发生变化。以下旧结果仅供参考，请重新验证后再确认。</div>`:st==='FAILED'?`<div class="notice red mt16">${icon('alert')}查询引用了不存在的字段，请修正 SQL 后重新执行。</div>`:st==='REJECTED'?`<div class="notice amber mt16">${icon('info')}此结果已退回。可以修改本题查询，或向建模助手提出模型修复请求。</div>`:''}${st==='DRAFT'||st==='FAILED'||q>2?'<div class="empty"><h3>等待验证结果</h3><p>原型不会执行数据库查询。请选择预设问题体验完整结果样式。</p></div>':`<div class="panel mt24"><div class="tablewrap"><table><thead><tr><th>${q===1?'指标':'品类'}</th><th>销售额（元）</th></tr></thead><tbody>${(q===1?[['已完成订单销售额','44,074,925.18']]:[['家用电器','1,808,854.32'],['手机数码','1,777,174.08'],['美妆个护','1,404,014.95']]).map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</tbody></table></div></div><div class="sample-note mt8">示例预览 ${q===1?'1':'3'} 行 · ${st==='STALE'?'旧草稿结果':'使用当前草稿查询'}</div>`}<details class="mt16"><summary>查看查询 SQL 与口径依据</summary><pre class="codebox">${esc(questionSql())}</pre></details><div class="divider"></div><div class="row wrap">${st==='EXECUTED'?btn('口径与结果正确','confirmQuestion()','primary','check')+btn('退回','rejectQuestion()'):st==='CONFIRMED'?`<span class="small green">${icon('check')}结果已确认</span>`:btn('重新验证','validateQuestion()','primary','refresh')}<span class="spacer"></span>${btn('修改查询','editQuery()','quiet sm','code')}${btn('请求模型修复',"startDemo('请诊断当前分析问题的业务模型并提出修复方案。')",'quiet sm','chat')}</div><p class="sample-note mt16">执行成功仅说明查询可运行，请同时核对指标、粒度、单位与筛选范围。</p></section></div>`}

const ready=state.validated&&state.stage==='applied';const err=state.stage==='error';return `<div class="row between mb24"><div><h2>检查本次变更，发布业务模型</h2><p class="small mt8">发布会让当前草稿成为新的问数依据。</p></div>${btn('刷新预览',"toast('示例变更预览已刷新')",'quiet sm','refresh')}</div><div class="publishgrid"><div class="stack"><section class="panel"><div class="panelhead"><h3>业务变更</h3><span class="small muted">对比已发布 v${state.release}</span></div><div class="panelbody"><div class="assetrow" style="padding-top:0"><span class="heading-icon">${icon('layers')}</span><div class="details"><h3>已完成销售明细</h3><p>新增独立视图，仅保留已完成订单。原销售明细继续沿用原口径。</p></div>${badge('新增','green')}</div><div class="assetrow" style="border:0;padding-bottom:0"><span class="heading-icon">${icon('term')}</span><div class="details"><h3>已完成订单销售额</h3><p>补充计算方式、订单状态筛选及使用规则。</p></div>${badge('规则','purple')}</div><details class="mt16"><summary>查看底层文件差异</summary><pre class="codebox"><span class="diffadd">+ views/已完成销售明细.sql</span><span class="diffadd">+ views/已完成销售明细/metadata.yml</span><span class="diffadd">+ rules.md：已完成订单销售额定义</span></pre></details></div></section><section class="panel"><div class="panelhead"><h3>模型工程检查</h3>${btn(ready?'重新检查':'运行检查','runValidation()','sm','refresh')}</div><div class="panelbody">${err?`<div class="notice red">${icon('alert')}字段引用检查失败，当前草稿无法发布。</div>`:''}${[['业务方案审阅','确认指标、过滤条件与粒度','plan'],['工程结构与字段','检查定义完整性和字段引用','structure'],['查询编译与构建','确认模型可编译并构建发布版本','compile']].map(([t,d,k])=>`<div class="checkrow"><span class="${ready?'green':err&&k==='structure'?'red':'muted'}">${icon(ready?'check':err&&k==='structure'?'alert':'clock')}</span><div><strong>${t}</strong><p>${d}</p></div><span class="spacer"></span>${badge(ready?'通过':err&&k==='structure'?'未通过':k==='plan'&&state.stage==='review'?'待采纳':'待检查',ready?'green':err&&k==='structure'?'red':'')}</div>`).join('')}${err?`<div class="mt16">${btn('返回建模修复',"go('modeling')",'soft sm','arrow')}</div>`:''}</div></section><div class="row"><span class="small muted">问题验证可 function runValidation(){if(state.stage==='review'||state.stage==='initial'||state.stage==='thinking')return modal('请先审阅业务方案','工程检查针对已经写入的草稿执行。','<p>当前方案尚未采纳。请先确认需要写入草稿的业务变更。</p>',btn('返回方案审阅',"closeModal();setStage('review');go('modeling')",'primary'));if(state.stage==='error')return toast('示例检查仍未通过，请返回建模修正字段引用');state.stage='applied';state.validated=true;render();toast('示例工程检查已通过')}

function termsPage(){const terms=[['销售额','订单明细金额之和，排除已取消订单。','销售总额、GMV'],['已完成订单销售额','仅统计已完成订单的明细金额。','完成订单金额'],['订单渠道','订单发生时的销售渠道，区别于客户注册渠道。','归属渠道'],...state.termSaved];return head('业务术语','把业务中的常用表达，变成一致的数据定义。',btn('添加术语','editTerm()','primary','plus'))+`<div class="toolbar"><label class="row small sub">知识库<select class="select" aria-label="术语所属知识库"><option>电商场景</option><option>红海数据集</option></select></label><span class="spacer"></span>${searchbox('搜索术语或同义词',"filterRows(this.value,'terms-table')")}</div><div class="panel"><table id="terms-table"><thead><tr><th style="width:23%">业务术语</th><th>业务定义</th><th style="width:23%">同义词</th><th></th></tr></thead><tbody>${terms.map((r,i)=>`<tr><td><strong style="font-weight:500;color:var(--ink)">${esc(r[0])}</strong></td><td>${esc(r[1])}</td><td class="muted">${esc(r[2])}</td><td><button class="iconbtn" aria-label="编辑${r[0]}" onclick="editTerm(${i})">${icon('edit')}</button></td></tr>`).join('')}</tbody></table><div class="tablefoot"><span>共 ${terms.length} 条术语</span><span>1 / 1 页</span></div></div><div class="notice mt24">${icon('info')}业务术语帮助理解问题中的表达；模型中的计算规则在语义建模中维护。</div>`}
function tasksPage(){return head('例行任务','把重复的数据分析，安排成有节奏的工作。',btn('创建任务','taskForm()','primary','plus'))+`<div class="toolbar">${searchbox('搜索任务名称',"filterRows(this.value,'tasks-table')")}<span class="small muted">${state.tasksEmpty?'0':'2'} 个任务</span><span class="spacer"></span><button class="link small" onclick="state.tasksEmpty=!state.tasksEmpty;render()">预览${state.tasksEmpty?'有数据':'空'}状态</button></div>${state.tasksEmpty?`<div class="panel"><div class="empty"><div class="heading-icon">${icon('clock')}</div><h2>让重要的分析定期发生</h2><p>为销售日报、经营周报等重复分析设置计划，在同一处查看任务状态。</p>${btn('创建第一个任务','taskForm()','primary','plus')}</div></div>`:`<div class="panel"><table id="tasks-table"><thead><tr><th>任务名称</th><th>执行计划</th><th>知识库</th><th>状态</th><th></th></tr></thead><tbody><tr><td><div class="namecell">${icon('file')}每日销售简报</div><p class="small muted mt8">汇总前一日销售表现与品类贡献</p></td><td>每天 09:00</td><td>电商场景</td><td>${badge(state.taskPaused?'已暂停':'待执行',state.taskPaused?'':'green')}</td><td class="num">${btn(state.taskPaused?'启用':'暂停',"state.taskPaused=!state.taskPaused;render()",'quiet sm',state.taskPaused?'play':'pause')}${btn('编辑','taskForm()','quiet sm','edit')}</td></tr><tr><td><div class="namecell">${icon('chart')}渠道贡献周报</div><p class="small muted mt8">比较各销售渠道的表现</p></td><td>每周一 10:00</td><td>电商场景</td><td>${badge('草稿')}</td><td class="num">${btn('编辑','taskForm()','quiet sm','edit')}</td></tr></tbody></table></div>`}<p class="sample-note mt16">此处用于预览任务列表、空状态与配置表单；实际调度和推送能力以项目后续实现为准。</p>`}
function workspacePage(){return head('工作区','集中查看分析中生成的文件与结果。',btn('返回对话',"go('chat')",'','chat'))+`<div class="toolbar">${searchbox('搜索文件',"filterRows(this.value,'workspace-table')")}<span class="small muted">3 个示例文件</span></div><div class="panel"><table id="workspace-table"><thead><tr><th>文件</th><th>所属会话</th><th>类型</th><th>生成时间</th><th></th></tr></thead><tbody>${[['品类销售额.csv','9 月各品类销售表现','CSV'],['渠道销售额.png','按渠道分析销售贡献','PNG'],['销售分析报告.md','9 月经营分析','Markdown']].map(r=>`<tr><td><div class="namecell">${icon('file')}${r[0]}</div></td><td>${r[1]}</td><td>${badge(r[2])}</td><td>今天 10:46</td><td>${btn('查看',"go('answer')",'quiet sm','external')}</td></tr>`).join('')}</tbody></table></div>`}

function showDocument(){modal('业务口径说明','电商场景 · 示例业务文档',`<article class="document"><h3>销售额</h3><p>销售额按订单明细表 amount 求和。排除状态为「已取消」的订单，保留其他状态。金额为下单口径，不代表实际到账收入。</p><h3>已完成订单销售额</h3><p>仅统计状态为「已完成」的订单，对其订单明细金额求和。作为独立指标，与原销售额同时保留。</p><h3>订单数与渠道</h3><p>订单数按 order_id 去重。渠道分析使用订单的归属渠道，不能用客户的注册渠道替代。</p><h3>时间范围</h3><p>使用订单日期筛选。统计区间根据用户问题确定，不将某次分析的日期写成永久限制。</p></article>`,btn('关闭','closeModal()')+btn('查看文档提案','documentProposals()','soft'),true)}
function documentProposals(){modal('审阅文档提案','资料中的定义与当前模型存在差异，请逐项核对。',`<div class="notice">${icon('info')}文档保存不等于模型已更新。提案采纳后写入草稿，发布后用于问数。</div><div class="assetrow"><div class="details"><div class="row"><h3>已完成订单销售额</h3>${badge(state.docApplied?'已采纳':'新增定义',state.docApplied?'green':'purple')}</div><p>建议增加仅包含已完成订单的销售明细视图，按 amount 计算销售额。</p></div>${btn(state.docApplied?'已采纳':'采纳',"state.docApplied=true;documentProposals();toast('示例提案已采纳到草稿')",'sm')}</div><div class="assetrow"><div class="details"><div class="row"><h3>订单渠道</h3>${badge('已覆盖','green')}</div><p>当前模型已使用订单归属渠道，无需重复新增定义。</p></div></div><div class="assetrow"><div class="details"><div class="row"><h3>订单数去重方式</h3>${badge('待核对','amber')}</div><p>建议按 order_id 去重，避免订单与明细关联后重复计数。</p></div>${btn('讨论口径',"closeModal();startDemo('请核对订单数按 order_id 去重是否符合当前业务。')",'sm')}</div>`,btn('完成审阅','closeModal()','primary'),true)}

function saveQuestions(){const values=[...document.querySelectorAll('#question-rows textarea')].map(e=>e.value.trim()).filter(Boolean);if(!values.length)return toast('请至少填写一个分析问题');for(const v of values){if(!state.questions.includes(v)){state.questions.push(v);state.questionStates.push('DRAFT')}}closeModal();state.question=state.questions.length-1;go('questions');toast('问题已保存到当前预览')}
function showRunDetails(){modal('建模过程','让业务进展可见，技术细节按需展开。',`<div class="checkrow"><span class="green">${icon('check')}</span><div><strong>读取已有模型与业务规则</strong><p>4 个基础模型、现有销售明细视图</p></div></div><div class="checkrow"><span class="green">${icon('check')}</span><div><strong>核对状态字段与关联关系</strong><p>订单状态字段：status</p></div></div><div class="checkrow"><span class="${state.stage==='error'?'red':'green'}">${icon(state.stage==='error'?'alert':'check')}</span><div><strong>${state.stage==='error'?'发现字段引用错误':'完成候选方案技术预检'}</strong><p>${state.stage==='error'?'orders.order_status 不存在，请使用 status。':'方案提交给用户审阅后，再写入模型草稿。'}</p></div></div><details><summary>技术执行信息</summary><pre class="codebox">读取工程：models / views / rules\n检查引擎：Wren\n检查范围：当前候选方案\n状态：${state.stage==='error'?'字段引用未通过':'预检通过'}\n\n以上为状态展示示例，未调用真实工具。</pre></details>`,btn('关闭','closeModal()'),true)}
function editLibrary(index){const item=Number.isInteger(index)?kbs[index]:null;modal(item?'编辑知识库':'创建知识库','名称与说明帮助使用者找到合适的数据。',`<div class="field"><label for="kb-name">知识库名称</label><input id="kb-name" class="input" value="${esc(item?.name||'')}" placeholder="例如：经营分析"></div><div class="field"><label for="kb-desc">说明</label><textarea id="kb-desc" class="input" placeholder="描述包含的数据与适用场景">${esc(item?.desc||'')}</textarea></div>`,btn('取消','closeModal()')+btn(item?'保存':'创建',`saveLibrary(${Number.isInteger(index)?index:-1})`,'primary'))}
function saveLibrary(index){const n=document.getElementById('kb-name').value.trim(),d=document.getElementById('kb-desc').value.trim();if(!n)return toast('请填写知识库名称');if(index>=0){kbs[index].name=n;kbs[index].desc=d}else kbs.push({name:n,desc:d||'暂无说明',count:0,date:'2026/10/10',creator:'admin',status:'等待添加数据'});closeModal();go('libraries');toast('已保存到当前预览')}
function deleteLibrary(i){modal('删除知识库',esc(kbs[i].name),'<p>这将移除当前原型中的示例卡片。刷新页面后恢复，不影响真实知识库。</p>',btn('取消','closeModal()')+btn('删除示例卡片',`kbs.splice(${i},1);closeModal();go('libraries')`,'','trash'))}
function editDescription(){modal('编辑数据集描述','人工补充说明，帮助模型准确理解这张表。',`<div class="field"><label for="ds-description">业务描述</label><textarea id="ds-description" class="input">${esc(datasets[0][4])}</textarea></div>`,btn('取消','closeModal()')+btn('保存描述',"datasets[0][4]=document.getElementById('ds-description').value;closeModal();render();toast('示例描述已保存')",'primary'))}
function editFields(){modal('编辑字段信息','字段描述支持多行编辑，长备注可以直接阅读和修改。',`<div class="tablewrap"><table><thead><tr><th style="width:18%">字段名称</th><th style="width:17%">原字段名称</th><th style="width:17%">字段类型</th><th style="width:48%">字段描述</th></tr></thead><tbody>${fields.map((f,i)=>`<tr><td><code>${f[0]}</code></td><td>${f[1]}</td><td><select class="input" aria-label="${f[0]}类型">${['BIGINT','VARCHAR','DECIMAL','DATETIME'].map(t=>`<option ${f[2]===t?'selected':''}>${t}</option>`).join('')}</select></td><td><textarea class="input field-note" data-field="${i}" aria-label="${f[0]}描述">${f[3]}</textarea></td></tr>`).join('')}</tbody></table></div>`,btn('取消','closeModal()')+btn('保存字段说明',"document.querySelectorAll('.field-note').forEach(e=>fields[Number(e.dataset.field)][3]=e.value);closeModal();render();toast('字段说明已保存到当前预览')",'primary'),true)}
function editView(){modal('新建业务视图','用一条 SELECT 查询定义可复用的业务口径。',`<div class="field"><label>视图名称</label><input class="input" id="view-name" placeholder="例如：已完成销售明细"></div><div class="field"><label>业务说明</label><textarea class="input" placeholder="说明用途、粒度和筛选范围"></textarea></div><div class="field"><label>查询 SQL</label><textarea class="input" style="min-height:170px;font-family:Consolas,monospace">${esc(sql)}</textarea></div>`,btn('取消','closeModal()')+btn('保存到草稿',"closeModal();toast('已演示手工创建视图表单，未写入真实模型')",'primary'),true)}
function showRule(name){modal(esc(name),'业务规则详情',`<div class="document"><h3>定义</h3><p>${name==='销售额'?'按订单明细 amount 求和，仅排除已取消订单。':name==='订单归属渠道'?'渠道分析采用订单.channel，避免与客户注册渠道混淆。':'仅统计已完成订单明细金额，其他状态不纳入该指标。'}</p><h3>生效范围</h3><p>当前知识库的问数。模型规则变更在发布后生效。</p></div>`,btn('关闭','closeModal()')+btn('讨论并调整',`startDemo('请帮助我检查${esc(name)}的定义。')`,'primary','chat'))}
function relationModal(){modal('添加表关系','明确关联字段与关系类型。',`<div class="fields2"><div class="field"><label>来源表</label><select class="input"><option>订单明细</option><option>订单</option></select></div><div class="field"><label>来源字段</label><select class="input"><option>order_id</option><option>product_id</option></select></div><div class="field"><label>目标表</label><select class="input"><option>订单</option><option>商品</option></select></div><div class="field"><label>目标字段</label><select class="input"><option>order_id</option><option>product_id</option></select></div></div><div class="field"><label>关系类型</label><select class="input"><option>多对一</option><option>一对多</option><option>一对一</option></select></div>`,btn('取消','closeModal()')+btn('保存关系',"closeModal();toast('关系编辑流程已演示')",'primary'))}
function relationProposals(){modal('关系候选','重新分析后保留已经确认或拒绝的决策。',`<div class="notice green">${icon('check')}当前 3 项关系均已确认，没有新的候选关系。</div><p class="small mt16">如果数据结构发生变化，可以重新分析，或手工补充关联。</p>`,btn('关闭','closeModal()'))}
function linkSource(){modal('关联数据库表','选择已接入的数据源，再选择需要纳入知识库的表。',`<label class="field"><span>数据源</span><select class="input"><option>电商业务数据库</option></select></label><div class="panel"><table><thead><tr><th style="width:40px"></th><th>数据库表</th><th>说明</th></tr></thead><tbody>${[['orders','订单'],['order_items','订单明细'],['products','商品'],['customers','客户']].map(([n,t])=>`<tr><td><input type="checkbox" aria-label="关联${t}" checked></td><td>${n}</td><td>${t}</td></tr>`).join('')}</tbody></table></div><p class="sample-note mt16">关联不会复制或修改原数据库中的记录。</p>`,btn('取消','closeModal()')+btn('关联所选表',"closeModal();toast('已演示选择数据源和表的流程')",'primary'),true)}
function selectKB(){modal('选择知识库','本次提问使用所选知识库中的数据与业务口径。',`<div class="stack">${kbs.map((k,i)=>`<label class="row" style="padding:15px;border:1px solid var(--line);border-radius:8px"><input type="checkbox" ${i===0?'checked':''}><span class="heading-icon">${icon('book')}</span><div><strong>${k.name}</strong><p class="small">${k.count} 个数据集</p></div></label>`).join('')}</div>`,btn('取消','closeModal()')+btn('使用所选知识库',"closeModal();toast('选择流程已演示，本原型继续使用电商示例数据')",'primary'))}
function editTerm(i){const examples=[['销售额','订单明细金额之和，排除已取消订单。','销售总额、GMV'],['已完成订单销售额','仅统计已完成订单的明细金额。','完成订单金额'],['订单渠道','订单发生时的销售渠道，区别于客户注册渠道。','归属渠道'],...state.termSaved];const t=examples[i]||['','',''];modal(Number.isInteger(i)?'编辑业务术语':'添加业务术语','当前知识库：电商场景',`<div class="field"><label for="term-name">业务术语</label><input id="term-name" class="input" value="${esc(t[0])}"></div><div class="field"><label for="term-def">业务定义</label><textarea id="term-def" class="input">${esc(t[1])}</textarea></div><div class="field"><label for="term-syn">同义词</label><input id="term-syn" class="input" value="${esc(t[2])}" placeholder="用逗号分隔"></div>`,btn('取消','closeModal()')+btn('保存',`saveTerm(${Number.isInteger(i)?i:-1})`,'primary'))}
function saveTerm(i){const t=['term-name','term-def','term-syn'].map(id=>document.getElementById(id).value.trim());if(!t[0]||!t[1])return toast('请填写术语和业务定义');if(i<0)state.termSaved.push(t);else if(i>=3)state.termSaved[i-3]=t;closeModal();render();toast(i>=0&&i<3?'编辑流程已演示，固定示例保持原样':'术语已保存到当前预览')}
function taskForm(){modal('配置例行任务','预览任务的分析内容与执行安排。',`<div class="field"><label for="task-name">任务名称</label><input class="input" id="task-name" value="每日销售简报"></div><div class="field"><label>知识库</label><select class="input"><option>电商场景</option><option>红海数据集</option></select></div><div class="field"><label>分析内容</label><textarea class="input">汇总前一日销售额、去重订单数和各品类贡献，说明主要变化。</textarea></div><div class="fields2"><div class="field"><label>执行频率</label><select class="input"><option>每天</option><option>每周</option><option>每月</option></select></div><div class="field"><label>执行时间</label><input type="time" class="input" value="09:00"></div></div><p class="sample-note">时间以 Asia/Shanghai 为准。本原型不创建实际定时任务。</p>`,btn('取消','closeModal()')+btn('保存草稿',"state.tasksEmpty=false;closeModal();render();toast('任务配置流程已演示，未启动调度')",'primary'))}
function feedback(){modal('反馈分析问题','说明结果中需要调整的地方。','<label class="field"><span>反馈内容（可选）</span><textarea class="input" placeholder="例如：时间范围不对，或金额口径需要调整…"></textarea></label>',btn('取消','closeModal()')+btn('提交反馈',"closeModal();toast('示例反馈已记录')",'primary'))}
function showEvidence(){modal('查询依据','电商场景 · 已发布模型',`<div class="keyvalue"><span>时间范围</span><span>2025/09/01 — 2025/09/30</span><span>金额</span><span>订单明细 amount 求和</span><span>状态</span><span>排除已取消</span><span>数据来源</span><span>销售明细视图</span></div><pre class="codebox mt24">SELECT category, SUM(amount) AS 销售额,\n       COUNT(DISTINCT order_id) AS 订单数\nFROM 销售明细\nWHERE order_date >= '2025-09-01'\n  AND order_date &lt; '2025-10-01'\nGROUP BY category\nORDER BY 销售额 DESC</pre>`,btn('关闭','closeModal()'),true)}
function downloadDemo(){const a=document.createElement('a');const url=URL.createObjectURL(new Blob(['\uFEFF品类,销售额（元）,订单数\n家用电器,1808854.32,79\n手机数码,1777174.08,79\n美妆个护,1404014.95,77\n服装鞋帽,1338084.49,80\n食品饮料,1214174.71,69'],{type:'text/csv;charset=utf-8'}));a.href=url;a.download='设计预览-品类销售额.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已下载原型内的示例 CSV')}
document.addEventListener('click',e=>{if(!e.target.closest('.dropdown')&&!e.target.closest('[data-menu-trigger]'))document.querySelectorAll('.dropdown').forEach(el=>el.remove())});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();document.querySelectorAll('.dropdown').forEach(el=>el.remove())}if(e.key==='Tab'&&document.querySelector('.modal')){const items=[...document.querySelectorAll('.modal button:not([disabled]),.modal input,.modal textarea,.modal select,.modal a[href]')].filter(el=>el.getClientRects().length);if(!items.length)return;const first=items[0],last=items[items.length-1];if(e.shiftKey&&(document.activeElement===first||document.activeElement.classList.contains('modal'))){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
window.addEventListener('hashchange',()=>{const p=location.hash.slice(1);if(p&&p!==state.page){state.page=p;closeModal();render();window.scrollTo(0,0)}});
render();
</script>
</body></html>
