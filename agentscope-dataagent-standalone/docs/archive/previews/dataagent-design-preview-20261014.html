function kbPage(){let k=kbs[state.kb];return crumb([['知识库','knowledge'],k.name])+`<div class="content">${head(E(k.name),E(k.desc),B('成员与权限','members','','users')+B('编辑信息','edit-kb','','edit')+B('基于此库提问','ask-kb:'+state.kb,'primary','chat',k.ready?'':'disabled'))}${k.ready?`<div class="notice green mb24">${I('circlecheck')}<div>已发布 v${state.version}，可以问数。业务口径可在语义建模中继续完善。</div><span class="spacer"></span>${L('完善业务模型','modeling')}</div>`:N('先添加数据，基础模型发布成功后即可开始问数。')}<div class="tabs"><button class="active">数据集 <span class="count">${k.count}</span></button><a href="#modeling">语义建模</a></div><div class="toolbar">${search('搜索数据集','dataset-search')}<span class="spacer"></span>${B('关联数据源','associate','','database')}${B('上传文件','upload','','upload')}</div>${k.ready?datasetTable():`<div class="panel empty"><div class="bookicon">${I('table')}</div><h2>从一份数据开始</h2><p>上传 Excel / CSV，或关联一个外部数据源中的表。</p>${B('上传文件','upload','primary','upload')}${B('关联数据源','associate','quiet','database')}</div>`}</div>`}
function datasetPage(){let d=datasets[state.datasetIndex||0],fields=fieldsFor(state.datasetIndex||0);return crumb([['知识库','knowledge'],[kbs[state.kb].name,'kb'],d[0]])+`<div class="content">${head(d[0],d[1]+' · 数据源关联 · '+d[2]+' 行 · '+d[3]+' 个字段',B('编辑数据集说明','edit-description','','edit'))}<div class="tabs"><button class="${state.datasetTab!=='fields'?'active':''}" data-act="dataset-tab:data">数据预览</button><button class="${state.datasetTab==='fields'?'active':''}" data-act="dataset-tab:fields">字段说明</button></div>${state.datasetTab==='fields'?`<div class="notice mb16">${I('info')}<div>字段类型来自数据源。可以补充业务说明，帮助模型理解；这里不修改源表结构。</div></div><div class="panel"><table><thead><tr><th>字段名</th><th>业务说明</th><th>类型</th><th>操作</th></tr></thead><tbody>${fields.map((f,i)=>`<tr><td>${f[0]}</td><td>${E(state.fieldEdits[(state.datasetIndex||0)+':'+i]||f[1])}</td><td>${S(f[2])}</td><td>${B('编辑说明','edit-field:'+i,'quiet sm','edit')}</td></tr>`).join('')}</tbody></table></div>`:`<div class="panel"><div class="tablewrap"><table><thead><tr>${fields.map(f=>`<th>${f[0]}</th>`).join('')}</tr></thead><tbody>${[0,1,2,3,4,5].map((n)=>`<tr>${fields.map((f,i)=>`<td>${sampleCell(f,n)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="foot"><span>演示数据预览 · 前 6 行</span><span>不是完整数据下载</span></div></div>`}</div>`}
function modelShell(){let r=state.route,active=['assets','questions'].includes(r)?'modeling':r;return crumb([['知识库','knowledge'],[kbs[state.kb].name,'kb'],'语义建模'])+`<header class="modhead"><div class="modtitle"><h1>语义建模</h1><div class="modmeta">${kbStatus()}</div><span class="spacer"></span>${r==='assets'?L('返回对话建模','modeling','back'):L('查看语义模型','assets','table')}</div><nav class="steps" aria-label="建模步骤">${[['prepare','1','数据准备'],['modeling','2','对话建模'],['publish','3','检查与发布']].map(([p,n,t])=>`<a href="#${p}" class="${active===p?'active':''}"><span class="n">${n}</span>${t}</a>`).join('')}<div class="right"><a href="#questions" class="${r==='questions'?'active':''}">问题验证（可选）</a></div></nav>${r==='modeling'?`<div class="contextbar"><button data-act="documents">${I('file')}业务文档 <span class="count">${state.docs.length}</span></button><a href="#questions" class="row" style="color:var(--sub)">${I('chat')}验证问题 <span class="count">${state.questions.length}</span><span class="muted small">可选</span></a><span class="spacer"></span><span class="sidehint small muted">只处理当前知识库</span>${B('检查与发布','to-publish','quiet sm','arrow')}</div>`:''}</header>${r==='modeling'?modelChat():`<div class="workcontent"><div class="workinner">${({prepare:preparePage,publish:publishPage,assets:assetsPage,questions:questionsPage})[r]()}</div></div>`}`}
function preparePage(){return `<div class="sectiontitle"><div><h2>确认数据，再补充业务资料</h2><p class="small mt8">已有基础模型可以直接问数。需要统一业务口径时，再继续建模。</p></div>${L('进入对话建模','modeling','arrow')}</div>${datasetTable()}<div class="sectiontitle"><h2>业务文档 <span class="small muted">可选</span></h2>${B('上传业务文档','document-upload','','upload')}</div><p class="small mb16">可以提供指标定义、统计规则或常见问题；没有文档，也可以直接描述。</p><div class="panel">${documentRows()}</div><div class="sectiontitle"><h2>常用分析问题 <span class="small muted">可选</span></h2>${B('添加问题','add-question','','plus')}</div><p class="small">已保存 ${state.questions.length} 个问题，方便后续验证业务口径。${L('查看问题','questions')}</p>`}
function documentRows(){return state.docs.map((n,i)=>`<div class="docrow">${I('file')}<div><strong>${E(n)}</strong><p>${i===0?'销售额、有效订单、渠道与日期口径':'常用问法与业务关注点'}</p></div><span class="spacer"></span>${S('已保存','green')}${B('查看','document:'+i,'quiet sm')}</div>`).join('')}
function proposalCard(){let pending=state.model==='proposal',draft=['draft','ready','failed','publishFailed'].includes(state.model);return `<section class="proposal" aria-label="业务定义确认"><div class="proptitle"><h3>${pending?'请确认这次业务定义':draft?'业务定义已写入草稿':'业务定义已发布'}</h3>${S(pending?'待你确认':draft?'待正式发布':'已生效',pending||draft?'amber':'green')}</div><dl class="definitions"><div class="defrow"><dt>销售额</dt><dd>汇总订单明细金额，单位为元；不重复乘折扣率。</dd></div><div class="defrow"><dt>有效订单</dt><dd>仅排除“已取消”状态，其余状态保留。</dd></div><div class="defrow"><dt>订单数</dt><dd>按订单号去重，同一订单的多条明细只计一单。</dd></div><div class="defrow"><dt>分析维度</dt><dd>订单日期按月统计，品类使用商品表中的分类。</dd></div></dl><div class="propfoot"><div class="hint">${I(pending?'info':'circlecheck')}${pending?'确认后写入草稿；检查并发布后，才用于正式问数。':draft?'草稿已保存。下一步检查并发布；问题验证可选。':'正式问数使用 v'+state.version+'，可以继续完善业务口径。'}</div><div class="row wrap">${pending?B('确认并写入草稿','accept','primary','check')+B('需要调整','adjust'):draft?L('去检查与发布','publish','arrow')+B('继续调整','adjust','quiet'):B('基于此库提问','ask-kb:'+state.kb,'primary','chat')+B('继续完善','adjust','quiet')}<button class="link" data-act="proposal-detail">查看详细变更</button></div></div></section>`}
function userMsg(t,time='10:24'){return `<article class="message"><div class="avatar">我</div><div class="msgbody"><div class="msgby">我 <time>今天 ${time}</time></div><div class="bubble">${E(t)}</div></div></article>`}
function aiMsg(t,extra=''){return `<article class="message"><div class="avatar ai">DA</div><div class="msgbody"><div class="msgby">红海DataAgent <time>${state.route==='chat'?'问答助手':'建模助手'}</time></div><div class="answer">${t}${extra}</div></div></article>`}
function modelChat(){let intro=state.model==='intro',analyzing=state.model==='analyzing';return `<section class="modelarea"><div class="chatstream" id="model-stream"><div class="thread">${intro?aiMsg(`<h2 style="font-size:18px;margin-bottom:10px">一起把业务口径说清楚</h2><p>告诉我你想分析什么，或者上传已有的业务文档。我会提出具体方案，由你确认后写入草稿。</p><div class="row wrap mt16">${B('按月份和品类分析销售额','model-example','soft')}${B('上传业务文档','document-upload','','upload')}</div>`):userMsg('请统一销售额口径，排除已取消订单，并按月份和品类分析。')+(analyzing?aiMsg('<p>正在梳理数据表和现有模型…</p><p class="small muted">完成后会在这里展示具体方案，请先审阅再确认。</p>'):aiMsg('<p>可以。我会保留现有数据表，完善表关系与“销售明细”业务视图。请先核对下面的统计口径。</p>',proposalCard()))}${state.proposedAdjust?userMsg(state.proposedAdjust)+aiMsg('<p>已收到调整意见。请继续核对更新后的业务定义，再决定是否写入草稿。</p>'):''}${state.modelExtra.map(m=>m.role==='user'?userMsg(m.text,'10:26'):aiMsg(`<p>${E(m.text)}</p>`)).join('')}${state.modelPending?userMsg(state.modelPending,'10:26')+aiMsg('<p>正在整理你的补充说明…</p>'):''}${state.modelStop?N('本次建模已停止。已保存草稿保持原状；可以继续描述需求。','amber'):''}</div></div><div class="composerwrap"><form id="model-form" class="composer"><label class="sr-only" for="model-input">建模消息</label><textarea id="model-input" placeholder="描述业务口径，或回答助手的问题…" rows="2"></textarea><div class="bottom"><button type="button" class="iconbtn" data-act="document-upload" aria-label="添加业务文档">${I('plus')}</button><span class="small muted">${state.model==='proposal'?'上方有方案等待确认':'当前知识库：'+E(kbs[state.kb].name)}</span>${analyzing||state.modelPending?B('停止','model-stop','quiet sm','stop'):`<button type="submit" class="send" aria-label="发送建模消息">${I('send')}</button>`}</div></form><div class="composerhint">确认方案、写入草稿、检查发布是三个不同步骤；不会因一条聊天消息直接发布。</div></div></section>`}
function publishPage(){let pending=state.model==='proposal',clean=['published','intro','analyzing'].includes(state.model),checking=state.check==='checking',ready=state.model==='ready',failed=state.model==='failed',pubfail=state.model==='publishFailed';return `<div class="sectiontitle"><div><h2>${clean?'当前模型已发布':pending?'还有方案等待确认':'检查这次变更，确认后发布'}</h2><p class="small mt8">${clean?'当前没有待发布的业务修改。':pending?'先在对话中确认业务方案，才会产生可检查的草稿。':'当前问数版本 v'+state.version+'。本次发布将生成 v'+(state.version+1)+'。'}</p></div>${B('返回对话建模','to-modeling','quiet','back')}</div>${pubfail?N('上次发布未成功，当前有效版本仍为 v'+state.version+'。请查看错误并重新检查；演示不执行真实发布。','red','alert'):''}${clean?N('模型与已发布版本一致，可以直接开始问数。','green','circlecheck'):pending?N('待确认方案尚未写入草稿。请返回对话，核对后点击“确认并写入草稿”。','amber'): `<div class="panel mb24"><div class="panelhead"><h3>本次变更</h3></div><div class="panelbody"><div class="keyvalue"><span>表关系</span><span>订单 → 客户；订单明细 → 订单；订单明细 → 商品</span><span>业务视图</span><span>销售明细 · 明细粒度，保留订单日期、品类、金额与订单号</span><span>统计口径</span><span>排除已取消；金额不重复折扣；订单按订单号去重</span></div></div></div>`}<div class="sectiontitle"><h2>模型工程检查 <span class="small muted">发布前必需</span></h2>${B(checking?'正在检查…':ready?'重新检查':'运行检查','run-check',clean||pending?'':'primary','refresh',clean||pending||checking?'disabled':'')}</div><div class="checkrow ${failed?'failed':''}">${I(failed?'alert':ready||clean?'circlecheck':'info')}<div class="text"><strong>模型结构与字段引用</strong><p>${checking?'正在检查 YAML、模型与字段…':ready?'检查通过，字段引用有效。':clean?'已发布版本的工程检查已通过。':failed?'销售明细引用了不存在的字段 orders.order_time。':'等待工程检查。'}</p></div>${S(ready||clean?'通过':failed?'未通过':checking?'检查中':'待检查',ready||clean?'green':failed?'red':'')}</div><div class="checkrow">${I(ready||clean?'circlecheck':'info')}<div class="text"><strong>关系与视图试跑</strong><p>${ready||clean?'已发布或当前待发布模型的数据源试跑通过。':'检查连接、表关系与业务视图能否实际执行。'}</p></div>${S(ready||clean?'通过':'待检查',ready||clean?'green':'')}</div>${failed?`<div class="notice red mt16">${I('alert')}<div>请返回对话修正字段。错误修复并重新检查通过后，才能发布。</div>${B('带错误返回对话','fix-model','sm')}</div>`:''}<div class="sectiontitle"><h2>业务问题验证 <span class="small muted">可选</span></h2>${L('查看问题','questions')}</div><p class="small">已确认 ${state.qStates.filter(x=>x==='confirmed').length} / ${state.questions.length} 个问题。没有问题或未全部确认，都不阻碍模型发布。</p><details class="mt16"><summary>查看技术文件与 SQL 变更</summary><pre class="codebox">${E(viewSql)}</pre></details><div class="publishaction"><div class="small sub">${pending?'先确认业务方案，再写入草稿。':clean?'当前已发布 v'+state.version:ready?'工程检查通过，可以发布。':'工程检查通过后，才可正式发布。'}</div><span class="spacer"></span>${ready?B('发布 v'+(state.version+1),'publish-confirm','primary','check'):clean?B('基于此库提问','ask-kb:'+state.kb,'primary','chat'):pending?L('去确认方案','modeling','arrow'):B('发布 v'+(state.version+1),'publish-confirm','primary','check','disabled')}</div>`}
function assetsPage(){let categories=[['models','基础模型',4],['relations','表关系',3],['views','业务视图',1],['rules','术语与规则',state.terms.length],['technical','技术文件','']];return `<div class="sectiontitle"><div><h2>查看模型、关系与业务口径</h2><p class="small mt8">查看草稿内容；正式问数当前使用已发布 v${state.version}。</p></div>${B('版本说明','version-info','quiet sm','info')}</div><nav class="assetnav" aria-label="语义资产分类">${categories.map(([id,t,n])=>`<button data-act="asset:${id}" class="${state.asset===id?'active':''}">${t} ${n!==''?`<span class="count">${n}</span>`:''}</button>`).join('')}</nav>${state.asset==='models'?`<div class="panel"><table><thead><tr><th>基础模型</th><th>业务名称</th><th>字段数</th><th>操作</th></tr></thead><tbody>${datasets.map((d,i)=>`<tr><td>${d[0]}</td><td>${d[1]}</td><td>${d[3]}</td><td>${B('查看字段','asset-model:'+i,'quiet sm')}</td></tr>`).join('')}</tbody></table></div>`:state.asset==='relations'?`<div class="panel"><table><thead><tr><th>业务关系</th><th>连接字段</th><th>类型</th><th>操作</th></tr></thead><tbody>${[['订单 → 客户','orders.customer_id = customers.customer_id'],['明细 → 订单','order_items.order_id = orders.order_id'],['明细 → 商品','order_items.product_id = products.product_id']].map((r,i)=>`<tr><td>${r[0]}</td><td><span class="small">${r[1]}</span></td><td>${S('多对一')}</td><td>${B('查看','relation:'+i,'quiet sm')}</td></tr>`).join('')}</tbody></table></div><div class="row mt16">${B('分析关系建议','relation-suggestions','','refresh')}${B('手工添加关系','manual-relation','','plus')}</div>`:state.asset==='views'?`<div class="panel"><table><thead><tr><th>业务视图</th><th>用途与粒度</th><th>操作</th></tr></thead><tbody><tr><td><strong>销售明细</strong><div class="meta">sales_detail</div></td><td>按订单明细分析金额、订单与品类<div class="meta">每行一条订单商品明细</div></td><td>${B('查看定义','view-detail','quiet sm','file')}</td></tr></tbody></table></div>`:state.asset==='rules'?`<div class="panel"><table><thead><tr><th>业务术语</th><th>定义</th></tr></thead><tbody>${state.terms.map(t=>`<tr><td>${E(t[0])}</td><td>${E(t[1])}</td></tr>`).join('')}</tbody></table></div><div class="row mt16">${L('管理业务术语','terms','term')}${B('查看建模规则','rules-detail','','file')}</div>`:`<div class="notice mb16">${I('info')}<div>技术文件用于排查和精细调整。正常建模可通过对话完成，无需手动编辑。</div></div><div class="panel">${['models/orders/metadata.yml','relationships.yml','views/sales_detail.yml','knowledge/rules/sales.md','已发布工程快照'].map((n,i)=>`<div class="docrow">${I('code')}<strong>${n}</strong><span class="spacer"></span>${B('查看','technical:'+i,'quiet sm')}</div>`).join('')}</div>`}`}
function questionResultTable(q){
 const text=state.questions[q]||'';
 const category=text.includes('品类'),average=text.includes('客单价');
 const heads=category?['品类','销售额（元）','去重订单数']:average?['指标','数值','单位']:['月份','销售额（元）','去重订单数'];
 const rows=category?[['家用电器','1,808,854.32','42'],['手机数码','1,777,174.08','38'],['美妆个护','1,404,014.95','35']]:average?[['销售额','66,728,198.85','元'],['去重订单数','1,399','单'],['客单价','47,697.07','元/单']]:[['2025-01','7,631,689.05','158'],['2025-02','6,658,080.11','147'],['2025-03','8,667,450.83','179']];
 return `<div class="panel mt16"><table class="resulttable"><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table><div class="foot">原型演示 · 展示 ${rows.length} 行</div></div>`;
}
function questionSql(q){let text=state.questions[q]||'';return text.includes('品类')?'SELECT category, SUM(amount), COUNT(DISTINCT order_id)\nFROM sales_detail\nGROUP BY category':text.includes('客单价')?'SELECT SUM(amount) / COUNT(DISTINCT order_id) AS avg_order_amount\nFROM sales_detail':"SELECT DATE_FORMAT(order_date, '%Y-%m') AS month,\n       SUM(amount), COUNT(DISTINCT order_id)\nFROM sales_detail\nGROUP BY DATE_FORMAT(order_date, '%Y-%m')"}

}

 'task-form':()=>showTask(),'save-task':()=>{let title=document.getElementById('task-title').value.trim(),prompt=document.getElementById('task-prompt').value.trim();if(!title||!prompt){toast('请填写任务名称和分析内容。');return}let t={title,prompt,kb:document.getElementById('task-kb').value,freq:document.getElementById('task-frequency').value,time:document.getElementById('task-time').value,paused:true};if(state.taskEditing<0)state.tasks.push(t);else state.tasks[state.taskEditing]=t;close();render();toast('演示：已保存任务配置，未启动调度或发送邮件。')},'refresh-tasks':()=>{render();toast('演示列表已刷新。')},
 'stop-chat':()=>{clearTimeout(state.chatTimer);let m=state.messages.at(-1);if(m)m.status='stopped';state.chatStatus='idle';render()},'retry-chat':()=>{let m=state.messages.at(-1);if(m){m.status='done';state.chatStatus='idle';render();toast('演示：重试完成。')}},
 'download-csv':()=>{const blob=new Blob(['\uFEFF月份,销售额（元）,去重订单数\n2025-01,7631689.05,158\n2025-02,6658080.11,147\n2025-03,8667450.83,179\n'],{type:'text/csv;charset=utf-8'});const a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download='原型演示-月度销售.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('已下载原型演示 CSV。')},'chart-detail':()=>modal('月度销售额','原型示例图表，不是真实查询。',lineChart(),B('关闭','close'),false,true),
 'copy-answer':()=>{const t='原型演示：2025年1月销售额 7,631,689.05 元，去重订单数 158。';if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast('演示结果已复制。')).catch(()=>modal('复制结果','可手动复制以下内容。',`<pre class="codebox">${t}</pre>`));else modal('复制结果','可手动复制以下内容。',`<pre class="codebox">${t}</pre>`)},
 capabilities:()=>modal('技能与工具','沿用现有能力入口，不扩展工具配置流程。',`<div class="docrow">${I('database')}<div><strong>数据查询</strong><p>通过知识库已发布模型查询数据。</p></div></div><div class="docrow">${I('chart')}<div><strong>Python 分析</strong><p>用于计算、图表和分析文件生成。</p></div></div><p class="small muted mt16">工具和权限依现有配置；本原型不修改 Agent 或技能内容。</p>`,B('关闭','close'),true),workspace:()=>modal('我的分析文件','只展示本人生成的结果。',`<div class="docrow">${I('file')}<div><strong>月度销售.csv</strong><p>原型演示文件 · 当前用户生成</p></div><span class="spacer"></span>${B('下载','download-csv','sm','download')}</div><p class="small muted mt16">不向库管理员展示其他成员的私有会话或附件。</p>`,B('关闭','close'),true),
 'admin-console':()=>modal('系统管理','仅全局管理员可见；沿用已有管理能力。',`<div class="mininav">${['运行概览','实例管理','会话诊断','运行配置'].map(t=>B(t,'admin-info','sm')).join('')}</div><p class="small muted mt16">此原型仅统一入口样式，不重新设计现有管理控制台，不新增用户注册和角色编辑。</p>`,B('关闭','close'),true),'admin-info':()=>toast('这是现有管理员功能的入口示意，详细页面本轮未重画。'),
 'relation-suggestions':()=>modal('审阅表关系建议','建议不直接生效，需确认或调整后写入草稿。',`<h3>订单明细 → 商品</h3><p class="small mt8">通过 product_id 连接，多条明细对应一个商品。</p><div class="keyvalue mt16"><span>连接字段</span><span>order_items.product_id = products.product_id</span><span>关系类型</span><span>多对一</span></div>`,B('暂不采纳','close')+B('调整','manual-relation')+B('确认写入草稿','accept-relation','primary')),
 'manual-relation':()=>modal('添加表关系','明确连接字段与关系类型，再写入草稿。',f('来源模型','relation-source','order_items')+f('目标模型','relation-target','products')+f('来源字段','relation-left','product_id')+f('目标字段','relation-right','product_id')+`<div class="field"><label for="relation-type">关系类型</label><select class="input" id="relation-type"><option>多对一</option><option>一对一</option><option>一对多</option></select></div>`,B('取消','close')+B('写入草稿','accept-relation','primary')),
 'accept-relation':()=>{state.model='draft';close();render();toast('演示：关系已写入草稿，正式问数版本未改变。')},revoked:()=>modal('当前无法访问此知识库','你的使用权限可能已被撤销。',`<p class="small">新查询不能继续使用该知识库。可以选择其他已授权知识库；本人已经生成的历史回答和结果仍保留。</p>`,B('返回选库','scope','primary'))
};
function handle(act){let colon=act.indexOf(':'),name=colon<0?act:act.slice(0,colon),arg=colon<0?'':act.slice(colon+1),n=Number(arg);if(actions[act]){actions[act]();return}switch(name){case'open-kb':state.kb=n;go('kb');break;case'ask-kb':state.kb=n;state.scope=[n];state.all=false;state.messages=[];state.chatStatus='idle';go('chat');break;case'dataset':state.datasetIndex=n;state.datasetTab='data';go('dataset');break;case'dataset-tab':state.datasetTab=arg;render();break;case'dataset-menu':modal(datasets[n][0]+' · 数据集操作','删除、覆盖等数据变更规则需另行确认。',`<p class="small">当前原型演示查看与编辑说明。没有执行删除，也不将未确认的数据更新方案包装成已有能力。</p>`,B('查看字段','fields-shortcut:'+n)+B('关闭','close'));break;case'fields-shortcut':close();state.datasetIndex=n;state.datasetTab='fields';go('dataset');break;case'edit-field':state.editField=n;modal('编辑字段说明',fieldsFor(state.datasetIndex||0)[n][0]+' · 类型 '+fieldsFor(state.datasetIndex||0)[n][2]+'（只读）',f('业务说明','field-description',state.fieldEdits[(state.datasetIndex||0)+':'+n]||fieldsFor(state.datasetIndex||0)[n][1],'textarea'),B('取消','close')+B('保存说明','save-field:'+n,'primary'));break;case'save-field':state.fieldEdits[(state.datasetIndex||0)+':'+n]=document.getElementById('field-description').value;close();render();break;case'asset':state.asset=arg;render();break;case'question':state.question=n;render();break;case'scenario':resetModel(arg);break;case'example':document.getElementById('chat-input').value=arg;document.getElementById('chat-input').focus();break;case'qa-scenario':clearTimeout(state.chatTimer);state.messages=[{text:'统计 2025 年每月销售额与去重订单数。',scopes:[0],all:false,status:arg}];state.chatStatus=['running','queued'].includes(arg)?arg:'idle';go('chat');break;case'document':modal(E(state.docs[n]),'已保存的业务资料',`<h3>销售业务口径</h3><p class="small mt16">销售额取订单明细 amount 汇总；排除已取消订单；使用订单日期和订单渠道；订单号去重。</p><div class="notice mt16">${I('info')}<div>业务文档仅作为参考。模型提出的变更需要你审阅后再采纳。</div></div>`,B('关闭','close')+B('查看建模建议','document-proposal','primary'),true);break;case'asset-model':modal(datasets[n][0]+' · '+datasets[n][1],'字段预览（演示数据）',`<table><thead><tr><th>字段</th><th>说明</th><th>类型</th></tr></thead><tbody>${fieldsFor(n).map(f=>`<tr><td>${f[0]}</td><td>${f[1]}</td><td>${f[2]}</td></tr>`).join('')}</tbody></table>`,B('关闭','close'),true);break;case'relation':modal('表关系详情','业务表关联，不是知识图谱。',`<div class="keyvalue"><span>关系</span><span>${['订单 → 客户','明细 → 订单','明细 → 商品'][n]}</span><span>连接类型</span><span>多对一</span></div><p class="small mt16">修改关系需要通过建模草稿并重新检查发布。</p>`,B('关闭','close')+B('通过对话调整','asset-adjust','primary'),true);break;case'technical':modal('技术文件','草稿与正式版本需要区分查看。',`<pre class="codebox">${E(n===4?'已发布 v'+state.version+'\nmodels: customers, orders, order_items, products\nviews: sales_detail':viewSql)}</pre>`,B('关闭','close'),true);break;case'revoke-member':state.members.splice(n,1);showMembers();toast('演示：已撤销，未修改真实授权。');break;case'source-edit':showSourceForm(n);break;case'source-detail':{let s=state.sources[n];modal(E(s.name),'外部连接详情',`<div class="keyvalue"><span>类型</span><span>${E(s.kind)}</span><span>主机与端口</span><span>${E(s.host)}:${E(s.port)}</span><span>数据库</span><span>${E(s.db)}</span><span>权限建议</span><span>业务表只读</span><span>凭据</span><span>不在详情中展示密码</span></div>`,B('关闭','close'),true);break}case'source-test':toast('演示：连接检测通过，未发起真实网络请求。');break;case'term-edit':showTerm(n);break;case'task-edit':showTask(n);break;case'task-toggle':state.tasks[n].paused=!state.tasks[n].paused;render();toast('演示：仅更改配置状态，不触发执行。');break;default:toast('请通过体验说明选择预览流程。')}}
document.addEventListener('click',event=>{const act=event.target.closest('[data-act]');if(act){event.preventDefault();if(!act.disabled)handle(act.dataset.act)}else if(event.target.classList.contains('overlay'))close()});
document.addEventListener('submit',event=>{event.preventDefault();if(event.target.id==='chat-form'){let t=document.getElementById('chat-input').value.trim();if(t)startQa(t);else toast('请先输入问题。')}if(event.target.id==='model-form'){let t=document.getElementById('model-input').value.trim();if(!t){toast('请先输入业务需求。');return}if(state.modelPending)return;state.modelPending=t;state.modelStop=false;render();scrollThread('model-stream');state.modelTimer=setTimeout(()=>{state.modelExtra.push({role:'user',text:t},{role:'assistant',text:'收到。这条补充说明会用于继续澄清口径；正式修改仍通过待确认方案写入草稿，不直接发布。'});state.modelPending='';if(state.model==='intro')state.model='proposal';if(state.route==='modeling'){render();scrollThread('model-stream')}},650)}});
document.addEventListener('input',event=>{let el=event.target;switch(el.id){case'kb-search':document.getElementById('kb-grid').innerHTML=kbCards(el.value,document.getElementById('kb-sort').value);break;case'dataset-search':document.querySelectorAll('.content table tbody tr').forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(el.value.toLowerCase()));break;case'scope-search':document.getElementById('scope-list').innerHTML=scopeRows(el.value);break;case'term-search':document.getElementById('term-rows').innerHTML=termRows(el.value);break;case'task-search':document.getElementById('task-table').innerHTML=taskRows(el.value);break;case'member-search':document.querySelector('#member-selected').closest('label').hidden=!('赵六 zhaoliu'.includes(el.value));break;case'source-name':case'source-host':case'source-db':case'source-port':case'source-user':case'source-password':state.sourceTested=false;break}});
document.addEventListener('change',event=>{let el=event.target;if(el.id==='role-preview'){state.role=el.value;if(state.role==='query'&&state.route==='kb')go('knowledge');else render();toast('仅切换原型角色，不改变真实账号权限。')}if(el.id==='kb-sort')document.getElementById('kb-grid').innerHTML=kbCards(document.getElementById('kb-search').value,el.value);if(el.id==='scope-all'){state.allDraft=el.checked;state.scopeDraft=el.checked?kbs.map((k,i)=>k.ready?i:-1).filter(i=>i>=0):[];document.getElementById('scope-list').innerHTML=scopeRows(document.getElementById('scope-search').value);document.getElementById('scope-summary').textContent=scopeSummary()}if(el.dataset.scope!==undefined){let n=Number(el.dataset.scope);if(state.allDraft){state.allDraft=false;state.scopeDraft=kbs.map((k,i)=>k.ready?i:-1).filter(i=>i>=0);document.getElementById('scope-all').checked=false}state.scopeDraft=el.checked?[...new Set([...state.scopeDraft,n])]:state.scopeDraft.filter(i=>i!==n);document.getElementById('scope-summary').textContent=scopeSummary()}if(el.dataset.member!==undefined){state.members[Number(el.dataset.member)].role=el.value;toast('演示：成员权限已更新。')}if(el.id==='term-kb'){state.kb=Number(el.value);render()}if(el.id==='source-kind'){document.getElementById('source-port').value=el.value.startsWith('Doris')?'9030':'3306';state.sourceTested=false}if(el.id==='upload-files'){let fs=Array.from(el.files);if(fs.length>10||fs.reduce((a,f)=>a+f.size,0)>100*1024*1024||fs.some(f=>f.size>50*1024*1024)){toast('超出限制：最多 10 个 / 100 MB，每个不超过 50 MB。');el.value='';return}state.upload=fs.map(f=>({name:f.name,progress:0,status:'等待导入'}));drawUploads()}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(document.getElementById('layer').innerHTML)close();else document.getElementById('rail').classList.remove('open')}if(event.key==='Tab'&&document.querySelector('.modal')){let nodes=[...document.querySelectorAll('.modal button:not(:disabled),.modal a[href],.modal input:not([hidden]),.modal textarea,.modal select,.modal summary')].filter(e=>e.getClientRects().length);let first=nodes[0],last=nodes.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus()}}if(event.key==='Enter'&&(event.ctrlKey||event.metaKey)&&event.target.tagName==='TEXTAREA'){event.preventDefault();event.target.closest('form')?.requestSubmit()}});
window.addEventListener('hashchange',()=>{close();render()});render();
</script>
