function toolOverlay(){return state.toolOpen&&(state.toolExpanded||window.innerWidth<=1120)}

function orderChart(){return `<div class="tool-chart"><div class="tool-chart-title row">各月订单数<span class="spacer"></span><span class="small muted">单位：单</span></div><svg viewBox="0 0 460 236" role="img" aria-label="2025 年 1 至 9 月订单数柱状图"><g stroke="#edf0f5"><path d="M25 35H450M25 90H450M25 145H450M25 200H450"/></g>${toolOrderRows.map((r,i)=>`<g><rect x="${40+i*45}" y="${200-r[1]*.72}" width="27" height="${r[1]*.72}" rx="3" fill="#8e7bda" tabindex="0" role="graphics-symbol" aria-label="${r[0]}：${r[1]} 单"><title>${r[0]}：${r[1]} 单</title></rect><text x="${54+i*45}" y="${191-r[1]*.72}" text-anchor="middle" font-size="14" fill="#818699">${r[1]}</text><text x="${54+i*45}" y="222" text-anchor="middle" font-size="14" fill="#969bad">${i+1}月</text></g>`).join('')}<path d="M25 80H450" stroke="#b9aecf" stroke-dasharray="4 4"/></svg></div>`}
function toolTrace(){let cs=getToolCalls(),visible=state.toolTraceAll||cs.length<=5?cs.map((_,i)=>i):[...new Set([1,3,7,11,state.toolIndex])].filter(i=>i<cs.length).sort((a,b)=>a-b);return `<section class="tool-trace" aria-label="本轮工具调用"><button class="tool-trace-head" data-act="tool-trace-toggle" aria-expanded="${state.toolTraceOpen}">${I('circlecheck')}<span>${state.toolScenario==='boundary'?'异常状态演示':state.toolScenario==='modeling'?'检查已完成 · 中途有错误返回':'已完成'}</span><span class="count">${cs.length} 次调用${state.toolScenario==='orders'?' · 51 秒':state.toolScenario==='chart'?' · 6 秒':''}</span>${I('down')}</button>${state.toolTraceOpen?`<div class="tool-trace-rows">${visible.map(i=>{let c=cs[i];return `<button class="tool-step-row ${state.toolOpen&&state.toolIndex===i?'active':''}" data-act="tool-open:${i}" aria-pressed="${state.toolOpen&&state.toolIndex===i}"><span class="seq">${String(i+1).padStart(2,'0')}</span>${I(c.kind==='python'?'code':c.kind==='chart'?'chart':'database')}<span class="step-name">${E(c.label)}</span><span class="step-status ${c.status==='failed'?'failed':c.status==='unknown'?'unknown':''}">${E(toolStatusMeta[c.status]?.[0]||'已返回')}</span>${I('chevron')}</button>`}).join('')}${cs.length>5?`<button class="tool-trace-more" data-act="tool-trace-all">${state.toolTraceAll?'收起为关键调用':'显示全部 '+cs.length+' 次调用（当前 '+visible.length+' 项）'}</button>`:''}</div>`:''}</section>`}


function toolsPage(){let model=state.toolScenario==='modeling',boundary=state.toolScenario==='boundary',chart=state.toolScenario==='chart',title=model?'基础模型检查':boundary?'工具异常与边界':chart?'交互式图表':'月度订单分析';return crumb(['对话',title])+`<div class="tool-casebar"><strong>工具详情设计演示</strong><span class="tool-case-help">使用真实体验整理的示例结构，不连接后台</span><span class="spacer"></span><label for="tool-scenario">切换示例</label><select id="tool-scenario"><option value="orders" ${!model&&!boundary&&!chart?'selected':''}>月度订单分析</option><option value="chart" ${chart?'selected':''}>交互式图表</option><option value="modeling" ${model?'selected':''} ${canManage()?'':'disabled'}>建模只读检查</option><option value="boundary" ${boundary?'selected':''}>异常与边界</option></select>${L(model?'返回对话建模':'返回原型对话',model?'modeling':'chat','back')}</div><div class="tool-workspace"><section class="tool-talk" aria-label="示例对话"><div class="tool-talk-scroll"><div class="thread">${userMsg(model?'只读取当前工程，列出基础模型并运行 validate；不要修改文件，也不要发布。':chart?'直接用已有月度结果生成交互式柱状图，不重新查库，也不重跑 Python。':boundary?'查看不同工具返回状态的展示方式。':'请按月份统计订单数，展示柱状图，并导出月度结果 CSV。不排除任何订单状态。')}${aiMsg(`<p>${model?'已完成工程只读检查。中途技能加载出现错误，随后通过官方 CLI 继续处理；没有修改文件或发布。':chart?'已使用上一轮结果生成图表。点击工具行可查看预览、输入及原始返回。':boundary?'下面各项是独立的状态示例，不代表同一轮真实执行，也不触发任何重试。':'已查询 2025 年 1—9 月的数据，共 1,500 单，月均 166.67 单。'}</p>${toolTrace()}${model?N('校验有效：4 个模型、0 个视图、0 个关系。validate 成功不等于 build 或已发布。','green','circlecheck'):boundary?N('空数据不等于零值；历史截断不等于完整结果；没有回执时不显示执行成功。','amber'):orderChart()}<p class="tool-note">${model?'当前问数仍使用已发布 v2；失败调用与后续成功调用分别保留。':boundary?'选择某个调用，体验结果、输入和原始内容的展示。':'来源：电商销售 · 已发布 v2。口径：按订单日期分月计数，保留全部订单状态。'}</p>`)}${state.toolFollowups.map(t=>userMsg(t,'10:30')+aiMsg('<p>消息已加入原型示例。这里不执行真实工具，也不会改变已展示的调用结果。</p>')).join('')}</div></div><div class="composerwrap"><form id="tool-chat-form" class="composer"><label class="sr-only" for="tool-chat-input">示例追问</label><textarea id="tool-chat-input" placeholder="继续提问，或补充需要核对的地方…" rows="2">${E(state.toolDraft||'')}</textarea><div class="bottom">${S(model?'当前工程：电商销售':'本轮知识库：电商销售','purple')}<button type="submit" class="send" aria-label="发送示例追问">${I('send')}</button></div></form><div class="composerhint">原型演示 · 右侧只查看调用内容；重新执行仍通过对话发起。</div></div></section>${toolOverlay()?'<div class="tool-dimmer" data-act="tool-close" aria-hidden="true"></div>':''}${state.toolOpen?toolInspector():''}</div>`}
function toolInspector(){let c=activeTool(),cs=getToolCalls(),overlay=toolOverlay(),model=state.toolScenario==='modeling';return `<aside class="tool-pane ${state.toolExpanded?'expanded':''}" style="--tool-width:${state.toolWidth}px" ${overlay?'role="dialog" aria-modal="true"':''} aria-label="工具调用详情"><div class="tool-resize" role="separator" aria-label="调整工具栏宽度" aria-orientation="vertical" aria-valuemin="360" aria-valuemax="720" aria-valuenow="${state.toolWidth}" tabindex="0" data-tool-resize></div><header class="tool-pane-head"><div class="bookicon">${I(c.kind==='python'?'code':c.kind==='chart'?'chart':c.kind==='file'?'file':'database')}</div><h2>${E(c.label)}</h2>${toolStatus(c)}<button class="iconbtn" data-act="tool-expand" aria-label="${state.toolExpanded?'恢复侧栏':'放大阅读工具详情'}" title="${state.toolExpanded?'恢复侧栏':'放大阅读'}">${I(state.toolExpanded?'back':'expand')}</button><button class="iconbtn" data-act="tool-close" aria-label="关闭工具详情">${I('close')}</button></header><div class="tool-pane-context"><span class="context-name">${I('book')} 电商销售</span>${S(model?'当前草稿':'已发布 v2')}<span class="small muted">${c.kind==='python'?'当前会话沙箱':model?'建模工程':'本轮知识库范围'}</span></div><div class="tool-pane-meta"><code>${E(c.tool==='wren_call_tool'?'Wren · '+c.operation:c.tool==='wren_cli'?'Wren CLI · '+c.operation:c.tool)}</code><label class="sr-only" for="tool-step">切换本轮工具调用</label><select id="tool-step">${cs.map((x,i)=>`<option value="${i}" ${i===state.toolIndex?'selected':''}>${i+1}/${cs.length} · ${E(x.label)}</option>`).join('')}</select></div><nav class="tool-tabs" role="tablist" aria-label="工具详情内容">${[['result','结果'],['input','输入'],['raw','原始内容']].map(([id,t])=>`<button id="tool-tab-${id}" role="tab" data-act="tool-tab:${id}" aria-controls="tool-detail-panel" aria-selected="${state.toolTab===id}" tabindex="${state.toolTab===id?'0':'-1'}">${t}</button>`).join('')}</nav><section class="tool-detail-scroll" id="tool-detail-panel" role="tabpanel" aria-labelledby="tool-tab-${state.toolTab} function toolTable(rows,columns=['月份','订单数'],preview=false){let shown=preview?rows.slice(0,state.toolRows):rows;return `<div class="tool-table-wrap"><table><thead><tr>${columns.map((h,i)=>`<th class="${rows.some(r=>typeof r[i]==='number')?'number':''}">${E(h)}</th>`).join('')}</tr></thead><tbody>${shown.map(row=>`<tr>${row.map((v,i)=>`<td class="${rows.some(r=>typeof r[i]==='number')?'number':''}">${v===null?'<span class="muted">NULL</span>':E(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${preview&&shown.length<rows.length?B('显示更多已返回行（'+shown.length+'/'+rows.length+'）','tool-more-rows','quiet sm','down'):''}`}
function toolResult(c){let d=c.data||{};switch(c.kind){
case 'sql':case 'large':{let rows=d.rows||[],large=c.kind==='large';return `<h3>${E(c.question||'查询结果')}</h3><p>完整查询条件可在「输入」中查看。</p>${large?N('接口标记结果已截断；这里只展示已返回的 '+rows.length+' 行，不能据此推断完整总量。','amber'):''}<details><summary>执行 SQL · 只读查看</summary><div class="row wrap">${B('复制 SQL','tool-copy-sql','quiet sm','code')}</div><pre class="codebox">${E(c.sql||'未提供')}</pre></details><div class="tool-result-caption"><strong>返回 ${d.row_count??rows.length} 行 · ${(d.columns||[]).length} 列</strong>${large?'<span class="muted">当前显示前 '+Math.min(rows.length,state.toolRows)+' 行</span>':''}</div>${rows.length?toolTable(rows,d.columns,large):`<div class="tool-empty"><div class="bookicon">${I('table')}</div><h3>查询成功，未返回数据行</h3><p>不等同于业务指标为 0。可核对日期、筛选条件和数据覆盖范围。</p></div>`}${c.artifact?`<div class="tool-file mt16">${I('file')}<div><strong>${E(c.artifact)}</strong><small>本次查询附件 · ${rows.length} 行 × ${(d.columns||[]).length} 列</small></div>${B('下载示例','tool-download-data','sm','download')}</div>`:''}<p class="tool-call-feedback">${large?'“显示更多”只展开这份返回值，不查询下一批。':''}</p>`}
case 'python':return `<h3>${E(c.input.description||'Python 执行结果')}</h3>${d.stderr?N('有警告输出。请核对生成产物；工具返回成功不代表图形已正确显示。','amber'):''}<div class="tool-result-caption"><strong>标准输出</strong><span class="spacer"></span>${B('复制输出','tool-copy-output','quiet sm')}</div><pre class="tool-stdout">${E(d.stdout||'没有标准输出。')}</pre>${d.stderr?`<details><summary>查看警告输出</summary><pre class="codebox">${E(d.stderr)}</pre></details>`:''}<div class="tool-result-caption mt24"><strong>本次调用产物 · ${(d.artifacts||[]).length} 个文件</strong></div>${(d.artifacts||[]).length?(d.artifacts||[]).map((name,i)=>`<div class="tool-file">${I(name.endsWith('.csv')?'table':'chart')}<div><strong>${E(name)}</strong><small>第 ${state.toolIndex+1} 项调用生成 · ${name.endsWith('.csv')?'数据文件':'图片'}</small></div>${!name.endsWith('.csv')?B('预览','tool-preview-chart','quiet sm'):''}${B('下载示例',name.endsWith('.csv')?'tool-download-data':'tool-download-chart','sm','download')}</div>`).join(''):'<p>本次调用未生成文件。</p>'}<p class="tool-note">不同调用产生的同名文件按调用分别保留，避免把初版产物与后续产物混在一起。</p><div class="row mt16">${B('查看本次代码','tool-tab:input','quiet sm','code')}</div>`;
case 'chart':return `<h3>图表预览</h3><p>直接查看本次图表；图表配置在输入中，原始回执单独保留。</p>${orderChart()}<div class="row wrap">${B('放大图表','tool-preview-chart','','chart')}${B('查看图表配置','tool-tab:input','quiet','code')}</div><p class="tool-note">图表无法加载时会显示具体提示；数据结果仍可单独查看。</p><details><summary>查看图表数据</summary>${toolTable(toolOrderRows)}</details>`;
case 'models':return `<h3>模型目录</h3><p>返回 ${(d.models||[]).length} 个模型。名称来自本次工具返回，不是重新扫描数据库。</p><div class="panel mt16">${(d.models||[]).map(name=>`<div class="assetline">${I('table')}<h3 style="margin:0">${E(name)}</h3></div>`).join('')}</div>`;
case 'schema':return `<h3>${E(d.name)} · 字段</h3><div class="tool-result-caption">${d.columns?.length||0} 个字段</div>${toolTable((d.columns||[]).map(x=>[x.name,x.type,x.description]),['字段','类型','说明'])}<p class="tool-note">仅显示工具已返回的结构；不把字段命名自动认定为主键或业务唯一值。</p>`;
case 'source':return `<h3>数据源类型</h3><dl class="tool-params"><div><dt>方言</dt><dd>MySQL</dd></div><div><dt>范围</dt><dd>当前知识库已发布工程</dd></div></dl>`;
case 'rules':return `<h3>业务规则与查询约束</h3><div class="tool-stdout">${E(d.instructions||'未返回规则内容。')}</div><p class="tool-note">按官方工具返回内容展示，不在页面额外生成业务结论。</p>`;
case 'recall':return `<h3>相似问答</h3>${(d.matches||[]).length?`<p>返回 ${d.matches.length} 条参考问答；参考示例不等于本次查询结果。</p>${d.matches.map((m,i)=>`<article class="tool-match"><h3>${i+1}. ${E(m.question)}</h3><p>${E(m.source||'来源未标注')}</p><details><summary>查看参考 SQL</summary><pre class="codebox">${E(m.sql)}</pre></details><details><summary>来源文件</summary><pre class="codebox">${E(m.path)}</pre></details></article>`).join('')}`:`<div class="tool-empty"><div class="bookicon">${I('search')}</div><h3>未找到相似问答</h3><p>这是正常检索结果。助手仍可依据当前已发布模型继续查询。</p></div>`}`;
case 'catalog':return `<h3>可用工具</h3><p>以下为示例返回的工具目录，不需要用户手动选择执行引擎。</p><div class="panel mt16">${(d.tools||[]).map(name=>`<div class="assetline"><code class="small">${E(name)}</code></div>`).join('')}</div>`;
case 'cli':return `<h3>官方 CLI 输出</h3><dl class="tool-params"><div><dt>命令</dt><dd><code>wren ${E(c.input.arguments.join(' '))}</code></dd></div><div><dt>退出码</dt><dd>${E(d.exitCode)}</dd></div></dl><div class="tool-result-caption">标准输出</div><pre class="tool-stdout">${E(d.stdout||'没有标准输出。')}</pre>${c.operation==='context validate'?N('校验通过不代表已编译、已发布，也不证明业务口径必然正确。'):''}`;

case 'error':return `<div class="tool-native-error"><h3>本次调用返回错误</h3><p>${E(d.error||'调用未成功返回')}</p></div><p class="mt16">${state.toolScenario==='modeling'?'后续调用已继续处理。保留这次错误，不把整轮回答误标为失败或将错误改成成功。':'本次没有可用数据，不能显示空表或将业务数值当作 0。'}</p><div class="row wrap mt16">${B('返回对话补充说明','tool-discuss','primary','chat')}${B('查看原始错误','tool-tab:raw','quiet','code')}</div><p class="tool-note">这里不直接重试工具；重新执行会通过正常会话流程和权限检查。</p>`;

case 'running':return `<h3><span class="tool-busy-mark"></span>工具执行中</h3><p>已发起调用，尚未收到结果。你可以先查看输入；返回后在这里更新。</p><p class="tool-note">本页为静态状态演示，不会自动完成或发起新请求。</p>`;

function toolRaw(c){let value=state.toolRawPart==='input'?JSON.stringify(c.input,null,2):c.raw;return `<div class="tool-raw-toolbar"><label class="sr-only" for="tool-raw-part">原始内容类型</label><select id="tool-raw-part"><option value="result" ${state.toolRawPart==='result'?'selected':''}>原始返回</option><option value="input" ${state.toolRawPart==='input'?'selected':''}>原始输入</option></select><span class="spacer"></span>${B('复制原文','tool-copy-raw','quiet sm','code',value===undefined?'disabled':'')}</div>${value===undefined?N(c.status==='running'?'暂未收到工具返回。':'当前记录没有保存结果回执。','amber'):`<pre class="codebox" style="margin-top:0">${E(value)}</pre>`}<p class="tool-note">保留原始字符、转义与错误信息供排查，不用“格式化展示”覆盖原始返回。界面不生成额外业务解释。</p>`}

function kbStatus(){return S('问数使用 v'+state.version,'green')+' '+S(state.model==='proposal'?'等待写入授权':state.model==='published'?'草稿与发布一致':state.model==='ready'?'草稿检查通过':'草稿待处理',state.model==='published'?'':'amber')}

function knowledgePage(){return crumb([['对话','chat'],'知识库'])+`<div class="content">${head('知识库','把数据、业务口径和使用权限放在一起管理。',(state.role==='query'?'':L('数据源管理','sources','database')+B('创建知识库','create-kb','primary','plus')))}<div class="toolbar">${search('搜索知识库','kb-search')}<span class="small muted">${kbs.length} 个知识库</span><span class="spacer"></span><select class="input" style="width:120px" aria-label="知识库排序" id="kb-sort"><option>最近更新</option><option>名称排序</option></select></div><div class="kbgrid" id="kb-grid">${kbCards()}</div><p class="small muted mt24">使用成员可基于已授权知识库提问；管理成员可维护数据、建模、发布及授权。</p></div>`}

function datasetPage(){let d=datasets[state.datasetIndex||0],fields=fieldsFor(state.datasetIndex||0),external=kbs[state.kb].kind!=='文件上传',s=getSample();return crumb([['知识库','knowledge'],[kbs[state.kb].name,'kb'],d[0]])+`<div class="content">${head(d[0],d[1]+' · '+(external?'外部表 · 总行数未统计':d[2]+' 行已导入')+' · '+d[3]+' 个字段',B('编辑数据集说明','edit-description','','edit'))}${external?`<div class="sample-strip"><div>${S(s.status==='FAILED'?'最近刷新失败':state.sampleBusy?'正在刷新样本':'样本已就绪',s.status==='FAILED'?'red':'green')}<p class="mt8">保留 ${s.count} 条样本 · 更新于 ${s.time}</p></div><span class="spacer"></span>${B(state.sampleBusy?'刷新中…':'刷新样本','refresh-sample','','refresh',state.sampleBusy?'disabled':'')}</div><p class="small muted mt8">样本最多 1000 行，不能代表总行数、完整枚举、唯一性或最新业务数据。${s.status==='FAILED'?'刷新失败，仍展示上次成功的摘要。':''}</p>`:''}<div class="tabs mt16">${[['data','数据预览'],['fields','字段说明'],['technical','技术信息']].map(([id,t])=>`<button class="${(state.datasetTab||'data')===id?'active':''}" data-act="dataset-tab:${id}">${t}</button>`).join('')}</div>${state.datasetTab==='fields'?`<div class="panel"><div class="tablewrap"><table><thead><tr><th>字段</th><th>说明</th><th>类型</th><th>操作</th></tr></thead><tbody>${fields.map((f,i)=>`<tr><td>${f[0]}</td><td>${E(state.fieldEdits[(state.datasetIndex||0)+':'+i]||f[1])}</td><td>${S(f[2])}</td><td>${B('编辑说明','edit-field:'+i,'quiet sm')}</td></tr>`).join('')}</tbody></table></div></div><p class="small muted mt16">类型只读；说明与样本摘要变更需要进入草稿并发布，才更新问数使用的工程资料。</p>`:state.datasetTab==='technical'?`<div class="panel panelbody"><div class="keyvalue"><span>来源</span><span>${external?'数据源关联':'文件上传'}</span><span>总行数</span><span>${external?'未统计':d[2]}</span><span>样本策略</span><span>${external?'有界取样，上限 1000 行':'导入后的数据预览'}</span><span>字段观察值</span><span>最多展示样本中观察到的 20 种值，不声明完整枚举</span></div></div>`:`<div class="panel"><div class="tablewrap"><table><thead><tr>${fields.map(f=>`<th>${f[0]}</th>`).join('')}</tr></thead><tbody>${[0,1,2,3,4,5].map(n=>`<tr>${fields.map(f=>`<td>${sampleCell(f,n)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="foot"><span>演示预览 · 前 6 行</span><span>${external?'总行数未统计':'已导入 '+d[2]+' 行'}</span></div></div>`}</div>`}

function modelShell(){let r=state.route,active=['assets','questions','examples'].includes(r)?'modeling':r;return crumb([['知识库','knowledge'],[kbs[state.kb].name,'kb'],'语义建模'])+`<header class="modhead"><div class="modtitle"><h1>语义建模</h1><div class="modmeta">${kbStatus()}</div><span class="spacer"></span>${r==='assets'?L('返回对话建模','modeling','back'):L('查看语义模型','assets','table')}</div><nav class="steps" aria-label="建模步骤">${[['prepare','1','数据与资料'],['modeling','2','对话建模'],['publish','3','检查与发布']].map(([p,n,t])=>`<a href="#${p}" class="${active===p?'active':''}"><span class="n">${n}</span>${t}</a>`).join('')}</nav>${r==='modeling'?`<div class="contextbar"><button data-act="documents">${I('file')}当前业务文档${I('down')}</button><a href="#questions" class="row">${I('chat')}常用问题（可选）</a><a href="#examples" class="row">${I('database')}SQL 问答对</a><button data-act="model-tool-design">${I('code')}工具调用过程</button><span class="spacer"></span><span class="sidehint small muted">只处理当前知识库</span></div>`:''}</header>${r==='modeling'?modelChat():`<div class="workcontent"><div class="workinner">${({prepare:preparePage,publish:publishPage,assets:assetsPage,questions:questionsPage,examples:examplesPage})[r]()}</div></div>`}`}

function documentRows(){return state.docs.length?`<div class="docrow">${I('file')}<div><strong>${E(state.docs[0])}</strong><p>已保存 · 不代表已分析或已修改模型</p></div><span class="spacer"></span>${B('查看','current-document','quiet sm')}</div>`:'<div class="empty"><h3>还没有业务文档</h3><p>也可以直接在对话中说明业务规则。</p></div>'}

function proposalCard(){let pending=state.model==='proposal',partial=state.model==='partial',writing=state.model==='writing';return `<section class="proposal" aria-label="草稿文件写入授权"><div class="authhead"><div class="bookicon">${I('file')}</div><div><h3>${pending?'授权本批草稿写入':writing?'正在写入草稿':partial?'部分文件写入未完成':state.model==='published'?'本批变更已发布':'草稿已更新'}</h3><p class="small">${pending?'共 4 项文件操作，按列出顺序执行':writing?'已授权，文件操作正在执行':partial?'3 项成功，1 项失败；已成功的修改仍在草稿中':'关系、销售明细、指标与业务规则'}</p></div></div><div class="authfiles"><div class="authfile"><span>文件路径</span><span>操作</span><span>业务说明</span></div>${state.authFiles.map((x,i)=>`<div class="authfile"><button data-act="auth-diff:${i}" title="查看文件差异">${E(x.path)}</button>${S(partial&&i===2?'失败':x.op,partial&&i===2?'red':x.op==='新建'?'green':'purple')}<span class="sub">${E(x.why)}</span></div>`).join('')}</div><div class="propfoot"><div class="hint">${I('info')}${pending?'仅授权草稿写入。助手继续检查，正式发布需要单独操作。':partial?'请让助手修正失败项，再检查完整草稿；不会自动回滚已写入的文件。':'写入完成不代表检查通过，也不代表已经发布。'}</div><div class="row wrap">${pending?B('允许本批写入','authorize-batch','primary','check')+B('不允许并反馈','deny-batch'):writing?S('正在执行…','purple'):partial?B('让助手修正失败项','repair-batch','primary','chat'):state.model==='published'?B('基于此库提问','ask-kb:'+state.kb,'primary','chat'):L('检查与发布','publish','arrow')}<button class="link" data-act="auth-details">查看逐项差异 ${I('chevron')}</button></div></div></section>`}

function userMsg(t,time='10:24'){return `<article class="message"><div class="avatar">我</div><div class="msgbody"><div class="msgby">我 <time>今天 ${time}</time></div><div class="bubble">${E(t)}</div></div></article>`}
function aiMsg(t,extra=''){return `<article class="message"><div class="avatar ai">DA</div><div class="msgbody"><div class="msgby">红海DataAgent <time>${state.route==='chat'||(state.route==='tools'&&state.toolScenario!=='modeling')?'问答助手':'建模助手'}</time></div><div class="answer">${t}${extra}</div></div></article>`}
function modelChat(){let intro=state.model==='intro',busy=state.model==='analyzing'||state.model==='writing';return `<section class="modelarea"><div class="chatstream" id="model-stream"><div class="thread">${intro?aiMsg(`<h2 style="font-size:18px;margin-bottom:10px">一起把业务问题变成可查询的模型</h2><p>告诉我你关心的业务问题，或提供已有规则。我会检查当前工程，在需要修改文件时向你请求授权。</p><div class="row wrap mt16">${B('按月份和品类分析销售额','model-example','soft')}${B('更新业务文档','document-upload','','upload')}</div>`):userMsg('销售金额不包含已取消的订单，同时需要保留订单明细，按月份和品类分析。')+aiMsg(state.model==='analyzing'?'<p>正在查看当前工程与数据字段…</p>':`<p>好的。我会维护订单、客户和商品之间的关系，整理销售明细视图，并补充销售指标 Cube 与业务说明。金额使用明细 amount，订单数按 order_id 去重。</p>${proposalCard()}${state.model==='ready'?N('工程检查已通过。请核对业务口径，再到检查与发布页显式发布。','green','circlecheck'):state.model==='failed'?N('工程检查未通过：日期字段引用有误。问数继续使用已发布版本。','red','alert'):''}`)}${state.modelExtra.map(m=>m.role==='user'?userMsg(m.text,'10:26'):aiMsg(`<p>${E(m.text)}</p>`)).join('')}${state.modelPending?userMsg(state.modelPending,'10:26')+aiMsg('<p>正在处理你的补充说明…</p>'):''}${state.modelStop?N('本轮已停止。已经写入的草稿保留，未执行的操作不会继续。','amber'):''}</div></div><div class="composerwrap"><form id="model-form" class="composer"><label class="sr-only" for="model-input">建模消息</label><textarea id="model-input" placeholder="描述业务问题，或回答助手的追问…" rows="2"></textarea><div class="bottom"><button type="button" class="iconbtn" data-act="document-upload" aria-label="更新业务文档">${I('plus')}</button><span class="small muted">${state.model==='proposal'?'有 4 项草稿文件操作等待授权':E(kbs[state.kb].name)+' · 单库建模'}</span>${busy||state.modelPending?B('停止','model-stop','quiet sm','stop'):`<button type="submit" class="send" aria-label="发送建模消息">${I('send')}</button>`}</div></form><div class="composerhint">检查通过不代表业务口径必然正确；公式、单位、筛选和去重仍需结合业务核对。</div></div></section>`}

function publishPage(){let pending=state.model==='proposal',clean=['published','intro'].includes(state.model),checking=state.check==='checking',ready=state.model==='ready',failed=['failed','partial'].includes(state.model),pubfail=state.model==='publishFailed';return `<div class="sectiontitle"><div><h2>${clean?'当前模型已发布':'检查草稿，再发布新版本'}</h2><p class="small mt8">问数使用已发布 v${state.version}；草稿中的修改需要发布后才生效。</p></div>${L('返回对话建模','modeling','back')}</div>${pubfail?N('发布未成功，正式版本仍为 v'+state.version+'。保留草稿，修正后重新检查发布。','red','alert'):pending?N('本轮文件写入还在等待授权。此处显示的是本轮计划；请回到对话处理授权。','amber'):clean?N('草稿与已发布版本一致，可以直接问数。','green','circlecheck'):''}<div class="panel mt16"><div class="panelhead"><h3>${pending?'本轮计划涉及的文件':clean?'上次发布涉及的文件':'本次草稿变更'}</h3></div>${state.authFiles.map((x,i)=>`<div class="assetline">${I('file')}<div><h3>${E(x.why)}</h3><p class="authpath">${E(x.path)}</p></div><span class="spacer"></span>${B('差异','auth-diff:'+i,'quiet sm')}</div>`).join('')}</div><div class="sectiontitle"><h2>模型工程检查</h2>${B(checking?'正在检查…':'运行检查','run-check','primary','refresh',pending||clean||checking||state.model==='writing'?'disabled':'')}</div>${[['结构校验','检查工程 YAML 与字段引用'],['编译','生成官方 MDL，核对模型、关系、视图和 Cube'],['查询检查','实际检查数据源连接与待发布定义']].map(([t,d],i)=>`<div class="checkrow ${failed&&i===2?'failed':''}">${I(ready||clean?'circlecheck':failed&&i===2?'alert':'info')}<div class="text"><strong>${t}</strong><p>${checking?'正在执行工程检查…':failed&&i===2?'当前定义未完成检查；请回到对话核对错误。':d}</p></div>${S(ready||clean?'通过':failed&&i===2?'未通过':checking?'检查中':'待检查',ready||clean?'green':failed&&i===2?'red':'')}</div>`).join('')}<div class="notice mt24">${I('info')}<div>工程检查只证明定义能够校验、编译和查询，不能替代业务验收。常用问题是可选输入，不要求逐题确认才能发布。</div></div><div class="publishaction"><span class="small sub">${ready?'草稿检查通过，发布时仍会重新检查。':clean?'当前生效版本 v'+state.version:'工程检查通过后可发布。'}</span><span class="spacer"></span>${clean?B('基于此库提问','ask-kb:'+state.kb,'primary','chat'):B('发布 v'+(state.version+1),'publish-confirm','primary','check',ready?'':'disabled')}</div>`}

function assetsPage(){let cats=[['schema','模型与关系'],['derived','SQL 定义模型'],['views','视图'],['cubes','Cube'],['glossary','业务知识与样例'],['sql','SQL 问答对'],['mdl','MDL 与工程快照']];let cards=state.asset==='schema'?datasets.map((d,i)=>[d[0],d[1]+' · '+d[3]+' 个字段','asset-model:'+i]).concat([['3 组表关系','订单 → 客户；明细 → 订单；明细 → 商品','relations-detail']]):state.asset==='derived'?[['sales_summary','通过 ref_sql 定义的派生模型 · 示例','refsql-detail']]:state.asset==='cubes'?[['sales_metrics','销售额、去重订单数；按月份与品类分析','cube-detail']]:state.asset==='glossary'?[['销售业务规则','knowledge/rules/sales.md · 当前草稿','rules-detail'],['查询经验与样例','knowledge/sql/*.md · 建模工程资料','open-examples']]:state.asset==='mdl'?[['当前草稿工程','YAML / SQL / knowledge · 建模与检查使用','draft-snapshot'],['已发布 v'+state.version,'正式问数使用的工程快照','published-snapshot']]:state.asset==='sql'?[['维护 SQL 问答对','区分建模积累与回答点赞两类来源','open-examples']]:[['sales_detail','销售明细 · 每行一条订单商品明细','view-detail']];return `<div class="sectiontitle"><div><h2>语义模型</h2><p class="small mt8">这里查看当前草稿；正式问数仍使用已发布 v${state.version}。</p></div>${B('版本说明','version-info','quiet sm','info')}</div><nav class="assetnav" aria-label="语义资产分类">${cats.map(([id,t])=>B(t,'asset:'+id,state.asset===id?'soft':'quiet')).join('')}</nav><div class="panel">${cards.map(([t,d,a])=>`<div class="assetline">${I(state.asset==='cubes'?'chart':state.asset==='glossary'?'file':'table')}<div><h3>${E(t)}</h3><p>${E(d)}</p></div><span class="spacer"></span>${B('查看',a,'quiet sm','chevron')}</div>`).join('')}</div><p class="small muted mt16">模型、关系、视图、Cube 和业务知识通过建模助手维护；这里的结构展示来自工程文件，表关系不代表知识图谱。</p>`}

function questionResultTable(q){
 const text=state.questions[q]||'';
 const category=text.includes('品类'),average=text.includes('客单价');
 const heads=category?['品类','销售额（元）','去重订单数']:average?['指标','数值','单位']:['月份','销售额（元）','去重订单数'];
 const rows=category?[['家用电器','1,808,854.32','42'],['手机数码','1,777,174.08','38'],['美妆个护','1,404,014.95','35']]:average?[['销售额','66,728,198.85','元'],['去重订单数','1,399','单'],['客单价','47,697.07','元/单']]:[['2025-01','7,631,689.05','158'],['2025-02','6,658,080.11','147'],['2025-03','8,667,450.83','179']];
 return `<div class="panel mt16"><table class="resulttable"><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table><div class="foot">原型演示 · 展示 ${rows.length} 行</div></div>`;
}
function questionSql(q){let text=state.questions[q]||'';return text.includes('品类')?'SELECT category, SUM(amount), COUNT(DISTINCT order_id)\nFROM sales_detail\nGROUP BY category':text.includes('客单价')?'SELECT SUM(amount) / COUNT(DISTINCT order_id) AS avg_order_amount\nFROM sales_detail':"SELECT DATE_FORMAT(order_date, '%Y-%m') AS month,\n       SUM(amount), COUNT(DISTINCT order_id)\nFROM sales_detail\nGROUP BY DATE_FORMAT(order_date, '%Y-%m')"}
function questionsPage(){return `<div class="sectiontitle"><div><h2>常用分析问题 <span class="small muted">可选</span></h2><p class="small mt8">把你想分析的问题交给助手，帮助澄清业务目标。</p></div>${L('返回对话建模','modeling','back')}</div>${N('每行一个问题，最多 50 条，每条不超过 1000 字。提交后作为一条消息发送给建模助手，不单独保存为问题审批流程。')}<div class="field mt24"><label for="optional-questions">分析问题</label><textarea id="optional-questions" class="input" style="min-height:220px" placeholder="例如：2025 年每月销售额是多少？">${E(state.questions.join('\n'))}</textarea><div class="hint">也可以不填写，直接在对话里描述需求。</div></div><div class="row wrap">${B('发送给建模助手','send-questions','primary','send')}${B('清空','clear-questions','quiet')}</div><p class="small muted mt24">问题输入不会自动生成 SQL 问答对。需要保存已核对的业务查询时，可在对话中让助手积累样例。</p>`}

function scopeLabel(){return state.all?'全部可用知识库':state.scope.length===0?'选择知识库':state.scope.length===1?kbs[state.scope[0]].name:'已选 '+state.scope.length+' 个知识库'}
function chatComposer(){return `<form id="chat-form" class="composer"><label class="sr-only" for="chat-input">问答消息</label><textarea id="chat-input" placeholder="${state.all||state.scope.length?'输入查询、分析或报告需求…':'输入问题；不选知识库时只进行普通聊天…'}" rows="2"></textarea><div class="bottom"><button type="button" class="scopebtn" data-act="scope" aria-haspopup="dialog">${I('book')}<span>${E(scopeLabel())}</span>${I('down')}</button>${['queued','running'].includes(state.chatStatus)?B('停止','stop-chat','quiet sm','stop'):`<button type="submit" class="send" aria-label="发送问题">${I('send')}</button>`}</div></form>`}
function lineChart(){return `<div class="chart" aria-label="月度销售额趋势图"><div class="row small sub">月度销售额<span class="spacer"></span><span class="muted">单位：万元</span></div><svg viewBox="0 0 700 180" role="img" aria-label="2025 年 1 至 9 月销售额折线图"><g stroke="#eceef4" stroke-width="1"><path d="M40 30H680M40 75H680M40 120H680"/></g><path d="M45 75L120 120L195 32L270 79L345 125L420 104L495 68L570 96L650 81" fill="none" stroke="#8170d7" stroke-width="2.5" stroke-linejoin="round"/><g fill="#9da3b0" font-size="11"><text x="30" y="160">1月</text><text x="185" y="160">3月</text><text x="335" y="160">5月</text><text x="485" y="160">7月</text><text x="640" y="160">9月</text></g></svg></div>`}
function answerFor(m){
 if(!m.scopes.length)return '<p>你好，我可以帮你整理思路、解释概念或撰写内容。这一轮没有选择知识库，所以没有查询业务数据。</p>'+feedbackFor(m);
 const rows=[['2025-01','7,631,689.05','158'],['2025-02','6,658,080.11','147'],['2025-03','8,667,450.83','179']];
 const results=m.scopes.map(i=>`<section class="mt16"><div class="row mb16"><strong>${E(kbs[i].name)}</strong><span class="spacer"></span>${S('已发布 v'+(m.version||state.version))}</div><div class="panel"><table class="resulttable"><thead><tr><th>月份</th><th>销售额（元）</th><th>去重订单数</th></tr></thead><tbody>${rows.map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`).join('');
 return `<p>${m.scopes.length>1?'按本轮所选 '+m.scopes.length+' 个知识库分别展示结果，各库独立统计，不直接跨库关联明细。':'已使用当前知识库的已发布业务口径查询。'}</p>${m.scopes.length===1?lineChart():''}${results}<p class="small mt16">口径：按订单日期，仅排除已取消订单；订单号去重。这里使用同套电商演示样本展示各来源结果，不执行真实查询。</p><details><summary>查看查询过程与 SQL</summary><div class="small sub">读取本轮授权范围 → 分别查询已发布业务视图 → 整理结果</div><pre class="codebox">SELECT DATE_FORMAT(order_date, '%Y-%m') AS month,
       SUM(amount), COUNT(DISTINCT order_id)
FROM sales_detail
GROUP BY DATE_FORMAT(order_date, '%Y-%m')</pre></details><div class="resultfoot">${B('下载 CSV','download-csv','quiet sm','download')}${B('查看图表','chart-detail','quiet sm','chart')}${B('复制结果','copy-answer','quiet sm')}</div>${feedbackFor(m)}`;
}
function chatPage(){let has=state.messages.length>0;return crumb(['对话',has?'销售分析':'新对话'])+(!has?`<div class="content"><section class="chatlanding"><h1>红海DataAgent</h1><h2>你的大数据智囊团</h2><p class="small">选择知识库查数据，也可以直接聊聊你的问题。</p>${chatComposer()}<div class="examplelist">${[['chart','按月份看销售变化','统计 2025 年每月销售额和去重订单数。'],['table','比较不同品类的表现','按品类统计销售额，排除已取消订单。'],['file','整理一份分析报告','基于所选知识库，整理销售趋势与主要变化。']].map(([i,t,q])=>`<button class="example" data-act="example:${E(q)}">${I(i)}<strong>${t}</strong><div class="small muted mt8">${q}</div></button>`).join('')}</div><p class="small muted mt24">未选知识库：普通聊天。多选：按本轮范围分析。全选：每次发送使用最新授权范围。</p></section></div>`:`<div class="modelarea"><div class="chatstream" id="qa-stream"><div class="thread">${state.messages.map(m=>`${userMsg(m.text)}<div class="small muted" style="text-align:right;margin:-14px 0 23px">${m.scopes.length?m.scopes.map(i=>E(kbs[i].name)).join('、'):'普通聊天'}${m.all?' · 发送时全部可用范围':''}</div>${aiMsg(m.status==='done'?answerFor(m):m.status==='queued'?'<p>当前问答较多，正在排队。</p><p class="small muted">可以离开查看其他内容，也可以停止本轮。</p>':m.status==='running'?(m.scopes.length?'<p>正在查询与整理结果…</p>':'<p>正在整理回复…</p>'):m.status==='stopped'?'<p class="sub">本轮已停止。可以调整知识库后重新提问。</p>':'<p class="red">本轮查询未完成，未生成可用结果。</p>'+B('重试本轮','retry-chat','quiet sm','refresh'))}`).join('')}</div></div><div class="composerwrap">${chatComposer()}<div class="composerhint">可在同一会话调整知识库。历史保留；新查询仅使用本轮选择。</div></div></div>`)}
function sourcesPage(){return crumb([['知识库','knowledge'],'数据源管理'])+`<div class="content">${head('数据源管理','配置用于关联业务表的外部连接。',B('添加数据源','source-form','primary','plus'))}<div class="panel"><div class="tablewrap"><table><thead><tr><th>数据源名称</th><th>连接类型</th><th>连接状态</th><th>操作</th></tr></thead><tbody>${state.sources.map((s,i)=>`<tr><td><strong>${E(s.name)}</strong><div class="meta">${E(s.db)}</div></td><td>${S(E(s.kind))}</td><td>${S('已连通（演示）','green')}</td><td>${B('详情','source-detail:'+i,'sm')}${B('配置','source-edit:'+i,'quiet sm')}${B('检测连接','source-test:'+i,'quiet sm','refresh')}</td></tr>`).join('')}</tbody></table></div><div class="foot">共 ${state.sources.length} 个数据源</div></div><p class="small muted mt24">一个知识库关联一个外部数据源。Doris 通过 MySQL 协议接入；是否兼容以实际连接、发布和问答验收为准。</p></div>`}
function termsPage(){return crumb([['对话','chat'],'业务术语'])+`<div class="content">${head('业务术语','按知识库维护术语，供成员查阅。',canManage()?B('添加术语','term-form','primary','plus'):'')}<div class="toolbar"><label class="small sub" for="term-kb">知识库</label><select class="input" style="width:220px" id="term-kb">${kbs.map((k,i)=>({...k,i})).filter(k=>k.ready).map((k)=>`<option value="${k.i}" ${state.kb===k.i?'selected':''}>${E(k.name)}</option>`).join('')}</select><span class="spacer"></span>${search('搜索业务术语','term-search')}</div><div class="panel"><div class="tablewrap"><table><thead><tr><th>业务术语</th><th>业务定义</th><th>同义词</th><th>操作</th></tr></thead><tbody id="term-rows">${termRows()}</tbody></table></div><div class="foot">当前知识库的术语 · 不跨库共用定义</div></div>${N('这里保存的术语不会自动改写已发布模型。需要影响问数口径时，请在建模对话中完善工程业务知识，再检查发布。')} ${state.role==='query'?`<p class="small muted mt16">使用成员只读；由知识库管理成员维护。</p>`:''}</div>`}
function termRows(q=''){let ts=state.terms.map((t,i)=>({t,i})).filter(({t})=>t.join(' ').includes(q));return ts.length?ts.map(({t,i})=>`<tr><td><strong>${E(t[0])}</strong></td><td>${E(t[1])}</td><td>${E(t[2])}</td><td>${canManage()?B('编辑','term-edit:'+i,'quiet sm','edit'):S('只读')}</td></tr>`).join(''):`<tr><td colspan="4">没有匹配的术语</td></tr>`}
function tasksPage(){return crumb([['对话','chat'],'例行任务'])+`<div class="content">${head('例行任务','管理周期性分析任务的内容和执行计划。',B('创建任务','task-form','primary','plus'))}<div class="toolbar">${search('搜索任务','task-search')}<span class="small muted">${state.tasks.length} 个任务</span><span class="spacer"></span>${B('刷新','refresh-tasks','quiet sm','refresh')}</div><div class="panel" id="task-table">${taskRows()}</div><p class="small muted mt24">此原型仅演示任务配置与启停样式，不模拟真实调度、运行记录或邮件送达。</p></div>`}
function taskRows(q=''){let ts=state.tasks.map((t,i)=>({...t,i})).filter(t=>t.title.includes(q));return ts.length?`<div class="tablewrap"><table><thead><tr><th>任务名称</th><th>知识库</th><th>执行计划</th><th>配置状态</th><th>操作</th></tr></thead><tbody>${ts.map(t=>`<tr><td><strong>${E(t.title)}</strong><div class="meta">${E(t.prompt).slice(0,32)}</div></td><td>${E(t.kb||kbs[0].name)}</td><td>${E(t.freq)} ${E(t.time)}</td><td>${S(t.paused?'已暂停':'已启用',t.paused?'':'green')}</td><td>${B('编辑','task-edit:'+t.i,'quiet sm')}${B(t.paused?'启用':'暂停','task-toggle:'+t.i,'quiet sm')}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><h3>没有匹配的任务</h3><p>可以换个关键词，或创建任务。</p>${B('创建任务','task-form','primary','plus')}</div>`}
function morePage(){return crumb([['对话','chat'],'更多'])+`<div class="content">${head('更多','工作区保存本人生成的分析结果。')}<div class="panel"><div class="docrow">${I('folder')}<div><strong>工作区</strong><p>本人分析文件与下载结果</p></div><span class="spacer"></span>${B('打开','workspace','quiet sm','chevron')}</div>${modelServicesMoreEntry()}</div></div>`}

function settingsPage(){return crumb([['更多','more'],'偏好设置'])+`<div class="content">${head('偏好设置','保持统一的浅色界面与清晰的内容层级。')}<div class="panel"><div class="docrow"><div><strong>界面主题</strong><p>本次原型使用浅色设计，便于长时间阅读数据。</p></div><span class="spacer"></span>${S('浅色')}</div><div class="docrow"><div><strong>减少动效</strong><p>遵循操作系统的减少动态效果设置。</p></div><span class="spacer"></span>${S('跟随系统')}</div></div></div>`}
function guidePage(){return crumb(['设计预览','体验说明'])+`<div class="content"><div class="guideintro"><h1>把业务意图、草稿操作和正式版本讲清楚</h1><p>10 月 16 日合并版更新：沿用上一版导航与页面骨架，以当前官方 Wren 主流程重新整理交互。</p><p>这是可交互的静态原型，所有操作只改变当前页面的演示状态。刷新后重置，不执行真实查询、授权、发布或任务调度。</p></div><div class="guidelist">${[['工具调用详情','真实体验后整理：SQL 表格、Python 输出与产物、图表预览、原始内容及异常状态。','tools'],['对话建模','业务需求 → 原生文件写入授权 → 草稿 → 官方工程检查 → 页面显式发布。','modeling'],['模型与问答对','普通模型、SQL 定义模型、关系、视图、Cube、业务知识；维护两类 SQL 样例。','assets'],['数据与资料','一份当前业务文档、可选问题输入；外部表总行数与样本数分开显示。','prepare'],['问答与反馈','每轮选库、同会话切换、正确/不正确反馈、点赞资料共享。','chat'],['成员与私有结果','使用权限与管理权限分开；知识库共享不等于共享个人历史与附件。','knowledge'],['例行任务','保留入口与配置操作；调度、邮件和任务运行记录不在本轮承诺内。','tasks']].map(([t,d,p])=>`<section class="guideitem"><h3>${t}</h3><p>${d}</p>${L('打开体验',p,'arrow')}</section>`).join('')}</div><h2 class="mt24">体验不同状态</h2><div class="mininav mt16">${[['intro','首次建模'],['proposal','待文件授权'],['partial','部分写入失败'],['draft','已有草稿'],['failed','工程检查失败'],['ready','可以发布'],['publishFailed','发布失败'],['published','发布完成']].map(([s,t])=>B(t,'scenario:'+s,'sm')).join('')}</div><div class="mininav mt16">${B('问答排队','qa-scenario:queued','sm')}${B('问答执行中','qa-scenario:running','sm')}${B('问答失败','qa-scenario:failed','sm')}${B('SQL 样例索引失败','example-error-demo','sm')}${B('样本刷新失败','sample-error-demo','sm')}${B('上传部分成功','upload-partial','sm')}${B('模拟撤权','revoked','sm')}</div>${N('本轮已启动真实服务并体验上传、基础发布、问答、Python、交互图表和建模只读检查。这里仍是 HTML 设计演示；异常示例不会执行真实工具，历史业务问题另行跟踪。','amber')}<p class="small mt16"><a href="dataagent-design-notes-20261014.md">阅读本版设计说明</a> · <a href="dataagent-design-preview.html#modeling">10 月 10 日原版</a></p></div>`}

function toast(t){clearTimeout(toastTimer);let el=document.getElementById('toast');el.className='toast';el.textContent=t;toastTimer=setTimeout(()=>{el.textContent='';el.className=''},3700)}
function modal(title,desc,body,foot='',drawer=false,large=false){modalReturnFocus=document.activeElement;document.querySelectorAll('.main,.rail,.previewbar').forEach(el=>el.inert=true);document.getElementById('layer').innerHTML=`<div class="overlay ${drawer?'drawer':''}"><section class="modal ${large?'large':''}" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><header class="modalhead"><div><h2 id="dialog-title">${title}</h2>${desc?`<p>${desc}</p>`:''}</div><button class="iconbtn" data-act="close" aria-label="关闭弹窗">${I('close')}</button></header><div class="modalbody">${body}</div><footer class="modalfoot">${foot||B('关闭','close')}</footer></section></div>`;const focus=document.querySelector('#layer input:not([type=checkbox]),#layer textarea,#layer select,#layer button');focus?.focus()}
function close(){document.querySelectorAll('.main,.rail,.previewbar').forEach(el=>el.inert=false);document.getElementById('layer').innerHTML='';modalReturnFocus?.isConnected&&modalReturnFocus.focus();if(state.route==='tools')toolAccess()}
function f(label,id,value='',type='text',hint=''){return `<div class="field"><label for="${id}">${label}</label>${type==='textarea'?`<textarea class="input" id="${id}">${E(value)}</textarea>`:`<input class="input" id="${id}" value="${E(value)}" type="${type}">`}${hint?`<div class="hint">${hint}</div>`:''}</div>`}
function showMembers(){modal('成员与权限',kbs[state.kb].name,`<p class="small mb16">使用：选库问答、下载本人结果。管理：还可维护数据、建模、发布和授权。</p><div class="docrow" style="padding-left:0"><div class="avatar">张</div><div><strong>张三</strong><p>创建者 · 固定拥有管理权限</p></div><span class="spacer"></span>${S('管理')}</div><div class="panel mt16"><table><thead><tr><th>成员</th><th>权限</th><th>操作</th></tr></thead><tbody>${state.members.map((m,i)=>`<tr><td>${E(m.name)}<div class="meta">${E(m.username)}</div></td><td><select class="input" data-member="${i}" aria-label="${E(m.name)}的权限"><option value="query" ${m.role==='query'?'selected':''}>使用</option><option value="manage" ${m.role==='manage'?'selected':''}>管理</option></select></td><td>${B('撤销','revoke-member:'+i,'quiet sm')}</td></tr>`).join('')}</tbody></table></div>`,B('添加成员','add-member','','plus')+B('完成','close','primary'))}
function showScope(){state.scopeDraft=[...state.scope];state.allDraft=state.all;modal('选择本轮知识库','可以多选；不选时只进行普通聊天。',`${search('搜索可用知识库','scope-search')}<label class="checkline allline"><input type="checkbox" id="scope-all" ${state.allDraft?'checked':''}><div><strong>全部可用知识库</strong><div class="small">每次发送时使用最新授权范围</div></div></label><div class="pickerlist" id="scope-list">${scopeRows()}</div>`,`<button class="link" data-act="clear-scope">清空选择</button><span class="spacer"></span><span class="small muted" id="scope-summary">${scopeSummary()}</span>${B('完成','save-scope','primary')}`)}
function scopeSummary(){return state.allDraft?'全部可用知识库':state.scopeDraft.length?'已选 '+state.scopeDraft.length+' 个':'普通聊天'}
function scopeRows(q=''){return kbs.map((k,i)=>({...k,i})).filter(k=>k.ready&&k.name.includes(q)).map(k=>`<label class="checkline"><input type="checkbox" data-scope="${k.i}" ${(state.allDraft||state.scopeDraft.includes(k.i))?'checked':''}><div class="bookicon" style="width:30px;height:30px;margin:0">${I('book')}</div><div><strong>${E(k.name)}</strong><div class="small">创建人：${E(k.owner)} · 已发布</div></div></label>`).join('')||'<p class="small muted">没有匹配的知识库</p>'}
function showUpload(partial=false){state.upload=[];modal('上传数据文件','当前知识库：'+kbs[state.kb].name,`<div class="dropzone">${I('upload')}<h3>选择 Excel 或 CSV 文件</h3><p class="small mt8">单文件 ≤ 50 MB；一次最多 10 个文件 / 100 MB</p><label class="btn" for="upload-files">选择文件</label><input type="file" id="upload-files" multiple accept=".xlsx,.xls,.csv" hidden><div class="small muted mt8">原型只读取文件名，不上传、不解析文件内容。</div></div><p class="small muted mt16">每文件最多 10 万行、100 列、200 万单元格。重名覆盖与多工作表规则待单独完善，不在这里承诺。</p><div id="upload-list" class="mt16"></div>`,B('演示上传结果','upload-demo')+B('取消','close')+B('开始导入','upload-start','primary','upload','id="upload-start" disabled'));if(partial){state.upload=[{name:'订单.xlsx',progress:100,status:'已导入'},{name:'商品.csv',progress:100,status:'导入失败：缺少表头'},{name:'客户.xlsx',progress:100,status:'数据已导入，模型未就绪'}];drawUploads()}}
function drawUploads(){let el=document.getElementById('upload-list');if(!el)return;el.innerHTML=state.upload.map(u=>`<div class="docrow" style="padding-left:0"><div style="width:100%"><div class="row"><strong>${E(u.name)}</strong><span class="spacer"></span><span class="small ${u.status.includes('失败')?'red':'sub'}">${E(u.status)}</span></div><div class="progress"><span style="width:${u.progress}%"></span></div></div></div>`).join('')+(state.upload.some(u=>u.status.includes('模型未就绪'))?`<div class="notice amber mt16">${I('info')}<div>数据已保存，不必重传。请进入检查与发布，处理模型错误后重试。</div></div>`:'');let btn=document.getElementById('upload-start');if(btn)btn.disabled=!state.upload.length||state.upload.some(u=>u.progress>0)}
function showSourceForm(index=-1){let s=state.sources[index]||{name:'',kind:'MySQL',host:'',port:'3306',db:''};state.sourceEditing=index;state.sourceTested=false;modal(index<0?'添加数据源':'配置数据源','填写连接参数，检测通过后保存。',`${f('数据源名称','source-name',s.name)}<div class="split2"><div class="field"><label for="source-kind">接入方式</label><select class="input" id="source-kind"><option ${s.kind==='MySQL'?'selected':''}>MySQL</option><option ${s.kind!=='MySQL'?'selected':''}>Doris（MySQL 协议）</option></select></div>${f('端口','source-port',s.port)}</div>${f('主机地址','source-host',s.host)}${f('数据库','source-db',s.db)}<div class="split2">${f('用户名','source-user','readonly_user')}${f('密码','source-password','','password','原型无需填写真实密码。')}</div><div id="source-test-result" aria-live="polite"></div>`,B('检测连接','test-source')+B('取消','close')+B('保存','save-source','primary'))}

function showTerm(index=-1){let t=state.terms[index]||['','',''];state.termEditing=index;modal(index<0?'添加业务术语':'编辑业务术语','仅属于当前知识库：'+kbs[state.kb].name,`${f('业务术语 *','term-name',t[0])}${f('业务定义 *','term-definition',t[1],'textarea')}${f('同义词','term-alias',t[2],'text','多个同义词可用顿号或逗号分隔。')}`,B('取消','close')+B('保存','save-term','primary'))}
function startQa(text){if(['running','queued'].includes(state.chatStatus)){toast('当前会话还有一轮未结束，请先停止或等待。');return}let scopes=state.all?kbs.map((k,i)=>k.ready?i:-1).filter(i=>i>=0):[...state.scope];state.messages.push({text,scopes,all:state.all,status:'running',version:state.version});state.chatStatus='running';render();state.chatTimer=setTimeout(()=>{state.messages.at(-1).status='done';state.chatStatus='idle';if(state.route==='chat'){render();scrollThread('qa-stream')}},900);scrollThread('qa-stream')}

function handle(act){let colon=act.indexOf(':'),name=colon<0?act:act.slice(0,colon),arg=colon<0?'':act.slice(colon+1),n=Number(arg);if(actions[act]){actions[act]();return}switch(name){case'open-kb':state.kb=n;go('kb');break;case'ask-kb':state.kb=n;state.scope=[n];state.all=false;state.messages=[];state.chatStatus='idle';go('chat');break;case'dataset':state.datasetIndex=n;state.datasetTab='data';go('dataset');break;case'dataset-tab':state.datasetTab=arg;render();break;case'dataset-menu':modal(datasets[n][0]+' · 数据集操作','删除、覆盖等数据变更规则需另行确认。',`<p class="small">当前原型演示查看与编辑说明。没有执行删除，也不将未确认的数据更新方案包装成已有能力。</p>`,B('查看字段','fields-shortcut:'+n)+B('关闭','close'));break;case'fields-shortcut':close();state.datasetIndex=n;state.datasetTab='fields';go('dataset');break;case'edit-field':state.editField=n;modal('编辑字段说明',fieldsFor(state.datasetIndex||0)[n][0]+' · 类型 '+fieldsFor(state.datasetIndex||0)[n][2]+'（只读）',f('业务说明','field-description',state.fieldEdits[(state.datasetIndex||0)+':'+n]||fieldsFor(state.datasetIndex||0)[n][1],'textarea'),B('取消','close')+B('保存说明','save-field:'+n,'primary'));break;case'save-field':state.fieldEdits[(state.datasetIndex||0)+':'+n]=document.getElementById('field-description').value;close();render();break;case'asset':state.asset=arg;render();break;case'question':state.question=n;render();break;case'scenario':resetModel(arg);break;case'example':document.getElementById('chat-input').value=arg;document.getElementById('chat-input').focus();break;case'qa-scenario':clearTimeout(state.chatTimer);state.messages=[{text:'统计 2025 年每月销售额与去重订单数。',scopes:[0],all:false,status:arg}];state.chatStatus=['running','queued'].includes(arg)?arg:'idle';go('chat');break;case'document':modal(E(state.docs[n]),'已保存的业务资料',`<h3>销售业务口径</h3><p class="small mt16">销售额取订单明细 amount 汇总；排除已取消订单；使用订单日期和订单渠道；订单号去重。</p><div class="notice mt16">${I('info')}<div>业务文档仅作为参考。模型提出的变更需要你审阅后再采纳。</div></div>`,B('关闭','close')+B('查看建模建议','document-proposal','primary'),true);break;case'asset-model':modal(datasets[n][0]+' · '+datasets[n][1],'字段预览（演示数据）',`<table><thead><tr><th>字段</th><th>说明</th><th>类型</th></tr></thead><tbody>${fieldsFor(n).map(f=>`<tr><td>${f[0]}</td><td>${f[1]}</td><td>${f[2]}</td></tr>`).join('')}</tbody></table>`,B('关闭','close'),true);break;case'relation':modal('表关系详情','业务表关联，不是知识图谱。',`<div class="keyvalue"><span>关系</span><span>${['订单 → 客户','明细 → 订单','明细 → 商品'][n]}</span><span>连接类型</span><span>多对一</span></div><p class="small mt16">修改关系需要通过建模草稿并重新检查发布。</p>`,B('关闭','close')+B('通过对话调整','asset-adjust','primary'),true);break;case'technical':modal('技术文件','草稿与正式版本需要区分查看。',`<pre class="codebox">${E(n===4?'已发布 v'+state.version+'\nmodels: customers, orders, order_items, products\nviews: sales_detail':viewSql)}</pre>`,B('关闭','close'),true);break;case'revoke-member':state.members.splice(n,1);showMembers();toast('演示：已撤销，未修改真实授权。');break;case'source-edit':showSourceForm(n);break;case'source-detail':{let s=state.sources[n];modal(E(s.name),'外部连接详情',`<div class="keyvalue"><span>类型</span><span>${E(s.kind)}</span><span>主机与端口</span><span>${E(s.host)}:${E(s.port)}</span><span>数据库</span><span>${E(s.db)}</span><span>权限建议</span><span>业务表只读</span><span>凭据</span><span>不在详情中展示密码</span></div>`,B('关闭','close'),true);break}case'source-test':toast('演示：连接检测通过，未发起真实网络请求。');break;case'term-edit':showTerm(n);break;case'task-edit':showTask(n);break;case'task-toggle':state.tasks[n].paused=!state.tasks[n].paused;render();toast('演示：仅更改配置状态，不触发执行。');break;default:toast('请通过体验说明选择预览流程。')}}

 'relations-detail':()=>modal('模型与关系','工程中的三组多对一关系。',`<div class="keyvalue"><span>订单 → 客户</span><span>orders.customer_id = customers.customer_id</span><span>明细 → 订单</span><span>order_items.order_id = orders.order_id</span><span>明细 → 商品</span><span>order_items.product_id = products.product_id</span></div><p class="small muted mt16">关系来自工程文件。调整通过建模对话完成。</p>`,B('关闭','close'),true),
 'refsql-detail':()=>modal('SQL 定义模型 · sales_summary','ref_sql 类型的展示示意，按官方工程契约维护。',`<p class="small">由 SQL 定义派生模型，后续模型可以引用它。</p><pre class="codebox">SELECT order_id, SUM(amount) AS amount\nFROM order_items\nGROUP BY order_id</pre><p class="small muted">这是当前草稿示例，不是直接跨知识库查询入口。</p>`,B('关闭','close')+B('通过对话调整','asset-adjust','primary'),true),
 'cube-detail':()=>modal('Cube · sales_metrics','指标与维度来自当前工程定义。',`<div class="keyvalue"><span>来源</span><span>sales_detail</span><span>销售额</span><span>SUM(amount) · 元</span><span>有效订单数</span><span>COUNT(DISTINCT order_id) · 单</span><span>维度</span><span>订单日期、商品品类、订单渠道</span></div><p class="small muted mt24">能编译和查询不代表指标口径正确；公式、聚合粒度和筛选条件需要业务核对。</p><details><summary>查看文件路径</summary><pre class="codebox">cubes/sales_metrics/metadata.yml</pre></details>`,B('关闭','close')+B('通过对话调整','asset-adjust','primary'),true),
 'draft-snapshot':()=>modal('当前草稿工程','建模和检查使用，未必与发布版本一致。',`<pre class="codebox">models/\nrelationships.yml\nviews/sales_detail/sql.yml\ncubes/sales_metrics/metadata.yml\nknowledge/\ntarget/mdl.json</pre>`,B('关闭','close'),true),
 'published-snapshot':()=>modal('已发布 v'+state.version,'普通问数只使用这个正式快照。',N('草稿修改不会自动影响已发布工程。')+`<pre class="codebox">发布版本：v${state.version}\n模型 / ref_sql / 关系 / 视图 / Cube / knowledge\n官方编译 MDL 与工程快照</pre>`,B('关闭','close'),true),
 'refresh-sample':()=>{state.sampleBusy=true;render();setTimeout(()=>{state.sampleBusy=false;let x=getSample();x.status='SUCCESS';x.time='刚刚';state.model='draft';state.check='idle';if(state.route==='dataset')render();toast('演示：样本已刷新；新摘要需要进入工程并发布。')},650)},
 'sample-error-demo':()=>{state.kb=0;state.datasetIndex=0;state.datasetTab='data';getSample().status='FAILED';go('dataset')}
});
const legacyHandle=handle;
function handle16(act){let [name,...args]=act.split(':'),arg=args.join(':'),n=Number(arg);if(name==='auth-diff'){authDiff(n);return}if(name==='examples-filter'){state.exampleSource=arg;render();return}if(name==='example-open'){state.exampleSelected=arg;state.exampleError=false;render();return}if(name==='vote-up'||name==='vote-down'){let m=state.messages[n];m.vote=name==='vote-up'?'up':'down';if(m.vote==='down'){render();return}m.memory=m.scopes.length?'busy':'none';render();if(m.scopes.length)setTimeout(()=>{m.memory='saved';m.scopes.forEach(kb=>{if(!state.sqlExamples.some(x=>x.id==='liked-answer-'+n+'-'+kb))state.sqlExamples.push({id:'liked-answer-'+n+'-'+kb,kb,source:'liked',file:'answer_'+n+'.md',question:m.text,sql:questionSql(0),note:'来自本库回答点赞；会话与附件仍私有。'})});if(state.route==='chat')render()},600);return}legacyHandle(act)}


Object.assign(actions,{
 'model-tool-design':()=>{state.toolScenario='modeling';state.toolIndex=3;state.toolOpen=true;state.toolTab='result';state.toolExpanded=false;go('tools')},
 'tool-design':()=>{state.toolScenario='orders';state.toolIndex=7;state.toolOpen=true;state.toolExpanded=false;state.toolTab='result';state.toolTraceAll=false;go('tools')},
 'tool-close':()=>{state.toolOpen=false;state.toolExpanded=false;render();document.querySelector('[data-act="tool-open:'+state.toolIndex+'"]')?.focus()},
 'tool-expand':()=>{state.toolExpanded=!state.toolExpanded;render();document.querySelector('#tool-tab-'+state.toolTab)?.focus()},
 'tool-trace-toggle':()=>{state.toolTraceOpen=!state.toolTraceOpen;render()},
 'tool-trace-all':()=>{state.toolTraceAll=!state.toolTraceAll;render()},
 'tool-prev':()=>switchTool(state.toolIndex-1),'tool-next':()=>switchTool(state.toolIndex+1),
 'tool-raw-input':()=>{state.toolTab='raw';state.toolRawPart='input';render();document.querySelector('#tool-tab-raw')?.focus()},
 'tool-more-rows':()=>{state.toolRows+=20;render()},
 'tool-copy-sql':()=>copyToolText(activeTool().sql||activeTool().input.arguments?.sql||'','SQL'),
 'tool-copy-code':()=>copyToolText(activeTool().input.code||'','代码'),
 'tool-copy-output':()=>copyToolText(activeTool().data.stdout||'','输出'),
 'tool-copy-raw':()=>{let c=activeTool();copyToolText(state.toolRawPart==='input'?JSON.stringify(c.input,null,2):c.raw||'','原文')},
 'tool-download-data':()=>downloadToolData(false),'tool-download-chart':()=>downloadToolData(true),
 'tool-preview-chart':()=>modal('本次调用的图表预览','原型示例图；真实页面使用本次调用关联的附件或图表。',orderChart()+N('不同调用生成的同名文件按调用分别展示；这里不替换或删除任何真实产物。'),B('关闭','close')+B('下载示例 SVG','tool-download-chart','','download'),false,true),
 'tool-discuss':()=>{state.toolOpen=false;state.toolExpanded=false;state.toolDraft='请核对刚才「'+activeTool().label+'」的错误或不完整结果，并说明下一步。';render();document.getElementById('tool-chat-input')?.focus()}
});
const handleBeforeToolDesign=handle16;
handle16=function(act){let colon=act.indexOf(':'),name=colon<0?act:act.slice(0,colon),arg=colon<0?'':act.slice(colon+1);if(name==='tool-open'){switchTool(Number(arg));return}if(name==='tool-tab'){state.toolTab=arg;state.toolRawPart='result';render();document.querySelector('#tool-tab-'+arg)?.focus();return}handleBeforeToolDesign(act)};
document.addEventListener('change',event=>{let e=event.target;if(e.id==='tool-scenario')setToolScenario(e.value);if(e.id==='tool-step')switchTool(Number(e.value));if(e.id==='tool-raw-part'){state.toolRawPart=e.value;render();document.getElementById('tool-raw-part')?.focus()}});
document.addEventListener('input',event=>{if(event.target.id==='tool-chat-input')state.toolDraft=event.target.value});
document.addEventListener('submit',event=>{if(event.target.id==='tool-chat-form'){event.preventDefault();let text=document.getElementById('tool-chat-input').value.trim();if(!text){toast('请填写示例追问。');return}state.toolFollowups.push(text);state.toolDraft='';render();requestAnimationFrame(()=>{let e=document.querySelector('.tool-talk-scroll');if(e)e.scrollTop=e.scrollHeight});toast('消息仅加入原型，没有发起真实查询。')}});
function resizeToolPane(width){let max=Math.max(360,Math.min(720,Math.floor((innerWidth-216)*.56),innerWidth-216-420));state.toolWidth=Math.max(360,Math.min(max,width));let e=document.querySelector('.tool-pane');if(e)e.style.setProperty('--tool-width',state.toolWidth+'px');document.querySelector('[data-tool-resize]')?.setAttribute('aria-valuenow',String(state.toolWidth))}
let resizingToolPane=false;
document.addEventListener('pointerdown',event=>{if(event.target.closest('[data-tool-resize]')&&innerWidth>1120&&!state.toolExpanded){resizingToolPane=true;event.preventDefault()}});
document.addEventListener('pointermove',event=>{if(resizingToolPane)resizeToolPane(innerWidth-event.clientX)});
document.addEventListener('pointerup',()=>{resizingToolPane=false});
let toolsResizeFrame;window.addEventListener('resize',()=>{if(state.route==='tools'){cancelAnimationFrame(toolsResizeFrame);toolsResizeFrame=requestAnimationFrame(()=>render())}});

document.addEventListener('click',event=>{const act=event.target.closest('[data-act]');if(act){event.preventDefault();if(!act.disabled)handle16(act.dataset.act)}else if(event.target.classList.contains('overlay'))close()});
document.addEventListener('submit',event=>{event.preventDefault();if(event.target.id==='chat-form'){let t=document.getElementById('chat-input').value.trim();if(t)startQa(t);else toast('请先输入问题。')}if(event.target.id==='model-form'){let t=document.getElementById('model-input').value.trim();if(!t){toast('请先输入业务需求。');return}if(state.modelPending)return;state.modelPending=t;state.modelStop=false;render();scrollThread('model-stream');state.modelTimer=setTimeout(()=>{state.modelExtra.push({role:'user',text:t},{role:'assistant',text:'收到。这条补充说明会用于继续澄清口径；涉及文件写入时会请求授权，随后继续检查；正式发布需另行操作。'});state.modelPending='';if(state.model==='intro')state.model='proposal';if(state.route==='modeling'){render();scrollThread('model-stream')}},650)}});
document.addEventListener('input',event=>{let el=event.target;switch(el.id){case'kb-search':document.getElementById('kb-grid').innerHTML=kbCards(el.value,document.getElementById('kb-sort').value);break;case'dataset-search':document.querySelectorAll('.content table tbody tr').forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(el.value.toLowerCase()));break;case'scope-search':document.getElementById('scope-list').innerHTML=scopeRows(el.value);break;case'term-search':document.getElementById('term-rows').innerHTML=termRows(el.value);break;case'task-search':document.getElementById('task-table').innerHTML=taskRows(el.value);break;case'member-search':document.querySelector('#member-selected').closest('label').hidden=!('赵六 zhaoliu'.includes(el.value));break;case'source-name':case'source-host':case'source-db':case'source-port':case'source-user':case'source-password':state.sourceTested=false;break}});
document.addEventListener('change',event=>{let el=event.target;if(el.id==='role-preview'){state.role=el.value;if(state.role==='query'&&state.route==='kb')go('knowledge');else render();toast('仅切换原型角色，不改变真实账号权限。')}if(el.id==='kb-sort')document.getElementById('kb-grid').innerHTML=kbCards(document.getElementById('kb-search').value,el.value);if(el.id==='scope-all'){state.allDraft=el.checked;state.scopeDraft=el.checked?kbs.map((k,i)=>k.ready?i:-1).filter(i=>i>=0):[];document.getElementById('scope-list').innerHTML=scopeRows(document.getElementById('scope-search').value);document.getElementById('scope-summary').textContent=scopeSummary()}if(el.dataset.scope!==undefined){let n=Number(el.dataset.scope);if(state.allDraft){state.allDraft=false;state.scopeDraft=kbs.map((k,i)=>k.ready?i:-1).filter(i=>i>=0);document.getElementById('scope-all').checked=false}state.scopeDraft=el.checked?[...new Set([...state.scopeDraft,n])]:state.scopeDraft.filter(i=>i!==n);document.getElementById('scope-summary').textContent=scopeSummary()}if(el.dataset.member!==undefined){state.members[Number(el.dataset.member)].role=el.value;toast('演示：成员权限已更新。')}if(el.id==='term-kb'){state.kb=Number(el.value);render()}if(el.id==='source-kind'){document.getElementById('source-port').value=el.value.startsWith('Doris')?'9030':'3306';state.sourceTested=false}if(el.id==='upload-files'){let fs=Array.from(el.files);if(fs.length>10||fs.reduce((a,f)=>a+f.size,0)>100*1024*1024||fs.some(f=>f.size>50*1024*1024)){toast('超出限制：最多 10 个 / 100 MB，每个不超过 50 MB。');el.value='';return}state.upload=fs.map(f=>({name:f.name,progress:0,status:'等待导入'}));drawUploads()}});

document.addEventListener('keydown',event=>{if(state.route!=='tools'||document.querySelector('.modal'))return;if(event.target.closest('[data-tool-resize]')&&['ArrowLeft','ArrowRight'].includes(event.key)){event.preventDefault();resizeToolPane(state.toolWidth+(event.key==='ArrowLeft'?20:-20));return}if(event.target.getAttribute('role')==='tab'&&event.target.closest('.tool-tabs')&&['ArrowLeft','ArrowRight','Home','End'].includes(event.key)){event.preventDefault();let ids=['result','input','raw'],i=ids.indexOf(state.toolTab);state.toolTab=ids[event.key==='Home'?0:event.key==='End'?2:(i+(event.key==='ArrowRight'?1:2))%3];render();document.getElementById('tool-tab-'+state.toolTab)?.focus();return}if(event.key==='Escape'&&state.toolOpen){event.preventDefault();event.stopImmediatePropagation();actions['tool-close']();return}if(event.key==='Tab'&&toolOverlay()){let nodes=[...document.querySelectorAll('.tool-pane button:not(:disabled),.tool-pane select,.tool-pane summary,.tool-pane [tabindex="0"]')].filter(e=>e.getClientRects().length),first=nodes[0],last=nodes.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus()}}});

document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(document.getElementById('layer').innerHTML)close();else document.getElementById('rail').classList.remove('open')}if(event.key==='Tab'&&document.querySelector('.modal')){let nodes=[...document.querySelectorAll('.modal button:not(:disabled),.modal a[href],.modal input:not([hidden]),.modal textarea,.modal select,.modal summary')].filter(e=>e.getClientRects().length);let first=nodes[0],last=nodes.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus()}}if(event.key==='Enter'&&(event.ctrlKey||event.metaKey)&&event.target.tagName==='TEXTAREA'){event.preventDefault();event.target.closest('form')?.requestSubmit()}});
window.addEventListener('hashchange',()=>{close();render()});
</script>
