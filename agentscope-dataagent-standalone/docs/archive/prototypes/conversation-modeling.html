<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>对话建模 · 交互原型</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6fa;color:#202537;font:14px/1.65 "Microsoft YaHei",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #e1e3ed;background:white;color:#555e76;border-radius:9px;padding:9px 16px}button:hover{background:#f0efff}button.primary{background:#6155db;color:white;border:0}header{height:76px;background:white;border-bottom:1px solid #e8eaf0;display:flex;align-items:center;justify-content:space-between;padding:0 36px}h1{font-size:18px;margin:0}small,.muted{color:#8990a3}.badge{font-size:12px;padding:4px 10px;border-radius:20px;background:#ecf7f1;color:#32815b;margin-left:12px}.steps{display:flex;gap:36px;align-items:center;padding:22px 36px;color:#9a9fb0}.step.active{color:#6155db;font-weight:bold}.step.done{color:#32815b}.number{display:inline-grid;place-items:center;width:24px;height:24px;background:#e9eaf1;border-radius:50%;margin-right:8px}.active .number{background:#6155db;color:white}main{max-width:1440px;margin:0 auto;padding:0 32px 24px;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px}.panel{background:white;border:1px solid #e6e8ef;border-radius:16px;overflow:hidden}.chat{height:calc(100vh - 175px);min-height:620px;display:flex;flex-direction:column}.title{padding:18px 24px;border-bottom:1px solid #eef0f5;display:flex;justify-content:space-between;align-items:center}.title strong{font-size:16px}.messages{padding:28px 32px;overflow:auto;flex:1}.message{display:flex;gap:12px;margin-bottom:24px}.avatar{flex-shrink:0;width:32px;height:32px;border-radius:10px;background:#efedff;color:#6155db;display:grid;place-items:center;font-weight:bold}.bubble{max-width:680px}.bubble p{margin:5px 0 12px}.user{justify-content:flex-end}.user .bubble{background:#f0effb;border-radius:12px;padding:12px 18px}.hint{border-left:3px solid #6155db;background:#f8f7ff;padding:12px 16px;margin:16px 0;color:#5b5880}.composer{padding:18px 24px;border-top:1px solid #eef0f5}.inputbox{border:1px solid #dadde8;border-radius:12px;padding:12px}textarea{width:100%;border:0;resize:none;outline:0;height:65px;color:#30364a}.tools{display:flex;justify-content:space-between;align-items:center}.link{border:0;background:transparent;padding:5px;color:#777f94}.footnote{font-size:12px;text-align:center;color:#9b9faf;margin-top:9px}.side{padding:22px}.side h3{margin:0 0 8px;font-size:15px}.card{border:1px solid #e3e1f6;border-radius:12px;padding:16px;margin:18px 0;background:#fcfbff}.card strong{font-size:15px}.status{font-size:12px;color:#6155db;margin:5px 0 16px}.check{padding:7px 0;color:#9aa0af}.check.done{color:#43866b}.check.now{color:#6155db;font-weight:bold}.definition{font-size:12px;border-top:1px solid #eceaf4;margin-top:12px;padding-top:12px;color:#798196}.next{background:#f7f8fb;padding:15px;border-radius:12px;margin-top:18px}.next strong{display:block;margin-bottom:5px}.next button{width:100%;margin-top:14px}details{margin-top:22px;color:#798196}summary{cursor:pointer}.empty{padding:20px 0;color:#9299aa}.table{width:100%;border-collapse:collapse;margin:12px 0}.table td,.table th{text-align:left;padding:9px 14px;border-bottom:1px solid #eceef5}.table th{background:#f7f8fb}.review{border:1px solid #e5e7ef;border-radius:12px;padding:16px;margin:12px 0}.mock{color:#a1a6b4;font-size:12px}.modal{position:fixed;inset:0;background:#20253755;display:none;align-items:center;justify-content:center}.modal.open{display:flex}.dialog{background:white;width:560px;max-width:90vw;padding:28px;border-radius:16px}.dialog pre{background:#f5f6fa;padding:18px;white-space:pre-wrap}.reset{font-size:12px}@media(max-width:900px){main{grid-template-columns:1fr;padding:0 14px}.chat{height:700px}.steps{gap:12px;padding:18px 14px;font-size:12px}header{padding:0 18px}.side{margin-bottom:20px}}
</style>
<header><div><h1>订单分析 <span class="badge" id="badge">基础模型可问数</span></h1><small>语义建模 · 将业务问题变成可靠的分析口径</small></div><div><button class="link" onclick="showModel()">查看模型</button><button class="link reset" onclick="location.reload()">重置原型</button></div></header>
<nav class="steps"><span class="step done"><span class="number">✓</span>数据准备</span><span class="step active" id="s1"><span class="number">2</span>对话建模</span><span class="step" id="s2"><span class="number">3</span>验证与确认</span><span class="step" id="s3"><span class="number">4</span>发布</span></nav>
<main><section class="panel chat"><div class="title"><strong id="chatTitle">对话建模</strong><span class="muted" id="subtitle">从一个业务问题开始</span></div><div class="messages" id="messages"></div><div class="composer" id="composer"><div class="inputbox"><textarea id="input" placeholder="输入一个常用问题，或告诉我你想分析什么…"></textarea><div class="tools"><div><button class="link" onclick="document.getElementById('file').click()">＋ 添加业务文档（可选）</button><input id="file" type="file" hidden onchange="attach(this)"><span class="mock" id="filename"></span></div><button class="primary" onclick="send()">发送 ↑</button></div></div><div class="footnote">已有数据和文档会用于理解口径，你不需要重复填写。</div></div></section>
<aside class="panel side"><h3>本次建模</h3><span class="muted">问题与进度随对话更新</span><div id="progress"></div><details><summary>数据与模型变化</summary><p>已连接：订单、客户</p><div id="changes">基础模型已准备好。<br>本次暂无业务口径变更。</div><button class="link" onclick="showModel()">查看模型详情 →</button></details><p class="mock" style="margin-top:30px">交互原型 · 数据与执行结果均为模拟</p></aside></main>
<div class="modal" id="modal"><div class="dialog"><h3>模型详情</h3><p>业务口径和模型结构作为辅助信息，按需查看。</p><pre id="modelText"></pre><button onclick="document.getElementById('modal').classList.remove('open')">关闭</button></div></div>
<script>
let stage=0,question='',required=false;
const $=id=>document.getElementById(id);
function msg(text,user=false){let row=document.createElement('div');row.className='message'+(user?' user':'');if(!user){let a=document.createElement('div');a.className='avatar';a.textContent='✦';row.appendChild(a)}let b=document.createElement('div');b.className='bubble';b.innerHTML=text;row.appendChild(b);$('messages').appendChild(row);$('messages').scrollTop=$('messages').scrollHeight}
function escapeText(s){let n=document.createElement('span');n.textContent=s;return n.innerHTML}
function render(){let labels=['已记录问题','已确认业务口径','已完善模型','已验证实际结果','已确认结果'];if(!stage){$('progress').innerHTML='<div class="empty">还没有分析问题。<br>在左侧说说你希望回答什么，<br>这里会自动记录建模进度。</div>';return}
let count=stage===1?1:stage===2?3:stage===3?4:5;
$('progress').innerHTML='<div class="card"><strong>'+escapeText(question)+'</strong><div class="status">'+(['','待澄清口径','待验证','待审阅结果','待发布','已发布'][stage])+'</div>'+labels.map((x,i)=>'<div class="check '+(i<count?'done':i===count?'now':'')+'">'+(i<count?'✓ ':i===count?'◉ ':'○ ')+x+'</div>').join('')+'<div class="definition">'+(stage>=2?'已支付 · 未删除 · 排除内部客户<br>人民币元 · 按订单时间逐月统计':'业务口径将在对话中逐步补全')+'</div><label class="definition" style="display:block"><input type="checkbox" '+(required?'checked':'')+' onchange="required=this.checked"> 设为发布前必验问题</label></div>';
if(stage===1)$('progress').innerHTML+='<div class="next"><strong>下一步：补充业务口径</strong><span class="muted">回答左侧的问题即可继续。</span></div>';
if(stage===2)$('progress').innerHTML+='<div class="next"><strong>下一步：验证这个问题</strong><span class="muted">查看模型能否按约定口径回答。</span><button class="primary" onclick="validate()">验证问题</button></div>';
if(stage===3)$('progress').innerHTML+='<div class="next"><strong>下一步：审阅实际结果</strong><span class="muted">确认左侧结果符合业务预期。</span></div>';
if(stage===4)$('progress').innerHTML+='<div class="next"><strong>下一步：发布模型</strong><span class="muted">发布后，问数将使用这些业务口径。</span><button class="primary" onclick="publish()">发布模型</button></div>';
if(stage===5)$('progress').innerHTML+='<div class="next"><strong>建模完成</strong><span class="muted">业务口径已发布为 v2。</span><button class="primary" onclick="query()">开始问数</button><button class="link" onclick="again()">继续完善模型</button></div>';
}
function send(){let text=$('input').value.trim();if(!text)return;$('input').value='';msg(escapeText(text),true);
if(stage===0){question=text;stage=1;msg('<p>已记录你的分析问题。我们先把它的业务口径说清楚。</p><p>这个原型以<strong>月度有效营收</strong>为演示场景。根据已有业务文档，我建议：</p><div class="hint">只统计已支付、未删除的订单，排除内部客户；金额使用人民币元，按订单时间统计月份。</div><p>这个口径符合你的预期吗？可以直接补充或修改。</p>');render()}
else if(stage===1){stage=2;msg('<p>已按你的补充更新本次口径，并完成对应模型草稿。</p><p>这次修改包括有效订单规则、客户关联和月度营收指标。工程检查已通过，接下来需要用实际结果验证这个问题。</p><span class="mock">原型演示：口径修改与模型生成已模拟完成。</span>');$('changes').innerHTML='✓ 关联订单与客户<br>✓ 增加有效订单规则<br>✓ 增加月度营收指标';render()}
else{msg('<p>已记录补充说明。你可以使用右侧当前主动作继续体验验证与发布流程。</p>')}
}
function validate(){stage=3;$('s1').className='step done';$('s2').className='step active';$('chatTitle').textContent='验证与确认';$('subtitle').textContent='审阅同一个问题的实际结果';msg('<p>已按约定口径完成验证，请检查结果是否符合你的业务预期。</p><div class="review"><strong>2025 年月度有效营收</strong><table class="table"><tr><th>月份</th><th>营收（元）</th></tr><tr><td>2025-01</td><td>99.00</td></tr><tr><td>2025-02</td><td>2,990.00</td></tr></table><small>口径：已支付、未删除、排除内部客户。只展示存在数据的月份。</small><p class="mock">以上为模拟结果，不代表真实查询。</p><button class="primary" onclick="confirmResult(this)">结果符合预期</button> <button onclick="revise(this)">需要调整口径</button></div>');render()}
function confirmResult(button){button.parentElement.querySelectorAll('button').forEach(b=>b.disabled=true);stage=4;$('s2').className='step done';$('s3').className='step active';msg('<p>你已确认这个问题的结果。本次模型可以发布。</p><p>发布后，新业务口径将用于后续问数。</p>');render()}
function revise(button){button.parentElement.querySelectorAll('button').forEach(b=>b.disabled=true);stage=1;$('s1').className='step active';$('s2').className='step';$('chatTitle').textContent='对话建模';msg('<p>请告诉我哪里不符合预期，我们会先调整口径，再重新验证。</p>');render();$('input').focus()}
function publish(){stage=5;$('s3').className='step done';$('badge').textContent='业务模型已发布 v2';$('subtitle').textContent='已完成';msg('<p><strong>模型已发布。</strong>月度有效营收口径已生效，现在可以开始问数。</p>');render()}
function query(){msg('<p>已切换到问数体验。按已发布口径，2025 年 1 月有效营收为 99 元，2 月为 2,990 元。</p><span class="mock">这是模拟问数回答。正式版本将进入问数页面，调用 Wren。</span>')}
function again(){stage=0;$('s1').className='step active';$('s2').className='step';$('s3').className='step';$('chatTitle').textContent='对话建模';msg('<p>接下来你希望增加哪个分析问题？已发布模型仍可用于问数。</p>');render();$('input').focus()}
function attach(input){if(input.files.length){$('filename').textContent=input.files[0].name;msg('<p>已添加文档：'+escapeText(input.files[0].name)+'</p><span class="mock">原型只展示附件交互，不会上传或分析文件。</span>')}}
function showModel(){$('modelText').textContent='订单 → 客户（多对一）\n\n有效订单：已支付 AND 未删除 AND 非内部客户\n指标：月度有效营收 = SUM(金额)\n时间维度：订单时间\n单位：人民币元\n\n当前显示的是模拟模型。';$('modal').classList.add('open')}
$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
msg('<p><strong>你希望用这些数据回答什么业务问题？</strong></p><p>可以直接输入一个常用问题，例如“2025 年每个月的有效营收是多少”；也可以先描述分析目标。</p><p class="muted">我会记录问题，结合已有资料补全口径，再带你验证结果并发布模型。</p>');render();
</script></html>
