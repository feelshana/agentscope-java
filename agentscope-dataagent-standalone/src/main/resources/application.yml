server:
  port: 8080

spring:
  application:
    name: agentscope-dataagent
  web:
    error:
      include-message: always
  webflux:
    static-path-pattern: /**
  resources:
    static-locations:
      - classpath:/static/

  # --------------------------------------------------------------------------
  # Multipart upload limits for dataset files (Excel/CSV).
  # Default Spring limit is 1MB which is too small for typical datasets.
  # --------------------------------------------------------------------------
  http:
    codecs:
      max-in-memory-size: 50MB

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # --------------------------------------------------------------------------
  # User + agent metadata are persisted via Spring Data JPA. The default
  # backend is MySQL at localhost:3306/dataagent_platform — matching the
  # dataset store convention (root/1234).
  #
  # To fall back to embedded H2 for local dev without MySQL, activate the
  # `h2` Spring profile (`--spring.profiles.active=h2`) which switches the
  # DataSource to a file-based H2 in `application-h2.yml`. You can also
  # override individual settings via `DATAAGENT_DB_*` env vars.
  # --------------------------------------------------------------------------
  datasource:
    url: ${DATAAGENT_DB_URL:jdbc:mysql://localhost:3306/dataagent_platform?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    driver-class-name: ${DATAAGENT_DB_DRIVER:com.mysql.cj.jdbc.Driver}
    username: ${DATAAGENT_DB_USER:root}
    password: ${DATAAGENT_DB_PASSWORD:123456}

  jpa:
    open-in-view: false
    hibernate:
      # 'update' is fine for dev / single-node. Production deployments should
      # pin the schema with Flyway/Liquibase and switch this to `validate`.
      ddl-auto: ${DATAAGENT_JPA_DDL_AUTO:update}
    # Run the SQL init scripts AFTER Hibernate creates the schema. Required so
    # `data-mysql.sql` finds the `dataagent_user` table to INSERT into.
    defer-datasource-initialization: true
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # --------------------------------------------------------------------------
  # `data-${platform}.sql` seeding. Setting platform=mysql makes Spring run
  # `data-mysql.sql`; the bundled script seeds two demo accounts (bob / alice,
  # passwords identical to the usernames) so a fresh local checkout is usable
  # without first calling the admin API. The script is idempotent
  # (INSERT ... ON DUPLICATE KEY UPDATE).
  #
  # The `h2` profile overrides platform to `h2` and runs `data-h2.sql` instead.
  # --------------------------------------------------------------------------
  sql:
    init:
      mode: ${DATAAGENT_SQL_INIT_MODE:always}
      platform: ${DATAAGENT_SQL_INIT_PLATFORM:mysql}
      continue-on-error: false

# --------------------------------------------------------------------------
# agentscope-dataagent configuration
#
# Property prefix is `dataagent.*`. Env vars use `DATAAGENT_*`.
# --------------------------------------------------------------------------
dataagent:
  model-services:
    encryption-key: ${DATAAGENT_MODEL_ENCRYPTION_KEY:}

  # Uploaded Excel/CSV limits; the UI reads the same policy from the upload-policy endpoint.
  upload:
    max-file-size: 50MB
    max-selection-size: 100MB
    max-files: 10
    max-rows: 500000
    max-columns: 100
    max-cells: 10000000
    concurrent-files: 8
  external-datasource:
    allowed-endpoints: ${DATAAGENT_EXTERNAL_DATASOURCE_ALLOWED_ENDPOINTS:}

  # spec105: approved files ship in deploy/demo-samples; copy to samples-dir before enabling. The read-only
  # demo_data source loaded from them. Off by default; needs a password for the reader account.
  demo:
    enabled: ${DATAAGENT_DEMO_ENABLED:false}
    samples-dir: ${DATAAGENT_DEMO_SAMPLES_DIR:data/demo-samples}
    jdbc-url: ${DATAAGENT_DEMO_JDBC_URL:jdbc:mysql://localhost:3306/demo_data}
    username: ${DATAAGENT_DEMO_USERNAME:demo_reader}
    password: ${DATAAGENT_DEMO_PASSWORD:}

  # JWT signing secret (>= 32 chars). MUST be overridden in production.
  jwt:
    ttl-seconds: ${DATAAGENT_JWT_TTL_SECONDS:1800}
    secret: ${DATAAGENT_JWT_SECRET:dataagent-dev-secret-for-local-only-do-not-use-in-prod-2026}

  auth:
    password-login-enabled: ${DATAAGENT_PASSWORD_LOGIN_ENABLED:true}
    bi:
      account-login-enabled: ${DATAAGENT_BI_ACCOUNT_LOGIN_ENABLED:false}
      enabled: ${DATAAGENT_BI_LOGIN_ENABLED:false}
      shared-key: ${DATAAGENT_BI_SHARED_KEY:}

  # Working directory. If blank, defaults to the JVM's current working
  # directory. .agentscope/agentscope.json is read from (or auto-created in)
  # this directory.
  workspace: ${DATAAGENT_WORKSPACE:}

  # ---- Per-user Docker sandbox ----
  # Image used for every (userId, agentId) container. The agent's run_python
  # tool executes pandas/matplotlib/scipy code inside these containers, which
  # run with --network=none, so the analysis stack must be baked into the
  # image. Build the default tag once (from the module directory):
  #   docker build -f docker/sandbox.Dockerfile -t agentscope/dataagent-sandbox:latest .
  # Override (env DATAAGENT_SANDBOX_IMAGE) to point at any image that ships
  # Python 3 + the analysis stack and runs as root.
  sandbox:
    image: ${DATAAGENT_SANDBOX_IMAGE:agentscope/dataagent-sandbox:latest}
    # How long an idle container stays alive before being evicted.
    idle-ttl-min: 15
    eviction-poll-sec: 60
    instance-id: ${DATAAGENT_SANDBOX_INSTANCE_ID:standalone}
    max-containers: ${DATAAGENT_SANDBOX_MAX_CONTAINERS:16}
    memory-mb: ${DATAAGENT_SANDBOX_MEMORY_MB:1024}
    cpus: ${DATAAGENT_SANDBOX_CPUS:1}
    workspace-mb: ${DATAAGENT_SANDBOX_WORKSPACE_MB:512}

  chat:
    max-active: 16
    max-active-per-user: 2
    max-waiting: 16
    max-waiting-per-user: 1
    wait-seconds: 30
    execution-seconds: 600

  # Durable files must be stored outside the application/sandbox container lifecycle.
  artifacts:
    directory: ${DATAAGENT_ARTIFACTS_DIRECTORY:./data/artifacts}
    max-file-mb: ${DATAAGENT_ARTIFACTS_MAX_FILE_MB:20}
    user-quota-mb: ${DATAAGENT_ARTIFACTS_USER_QUOTA_MB:1024}
    max-session-files: ${DATAAGENT_ARTIFACTS_MAX_SESSION_FILES:100}
    total-quota-mb: ${DATAAGENT_ARTIFACTS_TOTAL_QUOTA_MB:10240}
    min-free-disk-mb: ${DATAAGENT_ARTIFACTS_MIN_FREE_DISK_MB:2048}
    restore-max-files: ${DATAAGENT_ARTIFACTS_RESTORE_MAX_FILES:10}
    restore-max-mb: ${DATAAGENT_ARTIFACTS_RESTORE_MAX_MB:100}

  # Complete-conversation retention. Disabled by default. Enable dry-run first and inspect logs.
  history-retention:
    enabled: ${DATAAGENT_HISTORY_RETENTION_ENABLED:false}
    retention-days: ${DATAAGENT_HISTORY_RETENTION_DAYS:90}
    cron: ${DATAAGENT_HISTORY_RETENTION_CRON:0 0 3 * * *}
    zone: ${DATAAGENT_HISTORY_RETENTION_ZONE:Asia/Shanghai}
    batch-size: ${DATAAGENT_HISTORY_RETENTION_BATCH_SIZE:50}
    max-per-run: ${DATAAGENT_HISTORY_RETENTION_MAX_PER_RUN:500}
    dry-run: ${DATAAGENT_HISTORY_RETENTION_DRY_RUN:true}
    mode: ${DATAAGENT_HISTORY_RETENTION_MODE:full-session}

  # ---- Workspace storage topology (multi-tenant filesystem) ----
  # DataAgent runs every HarnessAgent on a CompositeFilesystem: a read-only
  # LocalFilesystem over `${dataagent.workspace}/.agentscope/workspace`
  # (templates, AGENTS.md, default skills/subagents/knowledge shipped on disk)
  # blended with per-(owner, agent) RemoteFilesystem routes for memory/,
  # MEMORY.md, sessions/, tasks/, skills/, subagents/. Skill/subagent routes
  # use OverlayFilesystem with the shared on-disk content as the lower layer
  # — the basis of the future capability-marketplace contribution flow.
  workspace-store:
    local:
      max-file-size-mb: 10

  # ---- OpenAI-compatible model (primary; used when api-key is set) ----
  # Works with any OpenAI-compatible endpoint: OpenAI, DeepSeek, vLLM, one-api,
  # DashScope compatible-mode, ... Set the key via env var DATAAGENT_OPENAI_API_KEY
  # (or the conventional OPENAI_API_KEY) and, for compatible endpoints,
  # DATAAGENT_OPENAI_BASE_URL (or OPENAI_BASE_URL). The base URL may or may not
  # include a trailing /v1 — the client normalises the path. Leave base-url
  # blank to target the official OpenAI endpoint.
  openai:
    # Avoid cross-stream disconnects observed on shared HTTP/2 model connections.
    http-version: ${DATAAGENT_OPENAI_HTTP_VERSION:HTTP_1_1}
    api-key: ${DATAAGENT_OPENAI_API_KEY:${OPENAI_API_KEY:}}
    base-url: ${DATAAGENT_OPENAI_BASE_URL:${OPENAI_BASE_URL:https://api.deepseek.com}}
    model-name: ${DATAAGENT_OPENAI_MODEL_NAME:${OPENAI_MODEL_NAME:deepseek-flash}}
    stream: ${DATAAGENT_OPENAI_STREAM:true}

  # ---- Query web search (spec094) ----
  # The query agent searches public information through the DeepSeek Search API. The key comes
  # from the environment only (no default); without it the tool is not registered. Modeling never
  # searches, and neither agent can fetch arbitrary URLs.
  web-search:
    enabled: ${DATAAGENT_WEB_SEARCH_ENABLED:true}
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DATAAGENT_WEB_SEARCH_BASE_URL:https://api.deepseek.com}
    timeout-seconds: ${DATAAGENT_WEB_SEARCH_TIMEOUT_SECONDS:20}
    max-results: ${DATAAGENT_WEB_SEARCH_MAX_RESULTS:5}

  # ---- DashScope model (fallback when no OpenAI key is configured) ----
  # Set DASHSCOPE_API_KEY env var or override api-key below.
  dashscope:
    api-key: ${DASHSCOPE_API_KEY:}
    model-name: ${DATAAGENT_MODEL_NAME:qwen3.8-max}
    stream: true
    enable-thinking: false

  # ---- Agent defaults (used when auto-generating agentscope.json) ----
  agent:
    name: ${DATAAGENT_AGENT_NAME:data-agent}
    subagents-enabled: ${DATAAGENT_SUBAGENTS_ENABLED:false}
    sys-prompt: >
      你是一个基于 AgentScope 构建的数据分析智能体（Data Agent），帮助用户探查、
      分析、可视化和汇报数据。优先使用已注册的技能（skills）与子代理（sub-agents），
      而不是即兴推理；始终注明所使用的数据来源。

      【最高优先级 — 语言规范】所有输出必须使用简体中文，包括但不限于：思考过程、
      工具调用前的叙述与解释、图表标题与标签、代码注释、最终回复。禁止使用英文
      进行推理叙述或工具调用说明。

  # ---- Channels (side-tool adapters) ----
  # ChatUI is always-on and serves the primary web UX. DingTalk and the
  # generic webhook channel are opt-in via agentscope.json. Other IM
  # channels (Feishu / WeCom / GitHub / GitLab) are intentionally not
  # bundled in v1.
  channels:
    chatui:
      enabled: true

  # Conversation checkpoints automatically use the platform MySQL DataSource.
  # H2 development uses the framework JSON file store under persistent user.home.
  # The legacy Redis block below is not wired by the default state configuration;
  # an explicit AgentStateStore bean may override the default. See ADR 0084.
  session:
    redis:
      enabled: false
      host: localhost
      port: 6379
      password:
      database: 0
      key-prefix: "dataagent:session:"

  # ---- Marketplace + admin approval ----
  # The on-disk shared workspace under ${dataagent.workspace}/.agentscope/
  # shared/ is the lower layer for every per-(owner, agent) OverlayFilesystem.
  # Users can nominate files from their own workspace as contributions; admins
  # approve or reject via the contribution API. Approved contributions land
  # under `shared/` and become visible to all tenants.
  marketplace:
    enabled: true
    # Maximum payload size accepted on POST /api/me/contributions (bytes).
    max-contribution-bytes: 1048576

  # ---- Dedicated dataset store (uploaded Excel/CSV tables) ----
  # Uploaded datasets become prefixed tables (ds_<owner8>_<dataset8>_<name>)
  # INSIDE this configured database, so the data lands exactly where the
  # operator points it; cross-dataset joins are plain same-db joins. Defaults
  # target a local dev MySQL; override via env in production.
  dataset:
    datasource:
      url: ${DATAAGENT_DATASET_DB_URL:jdbc:mysql://localhost:3306/data_agent?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
      username: ${DATAAGENT_DATASET_DB_USER:root}
      password: ${DATAAGENT_DATASET_DB_PASSWORD:123456}

  # ---- WrenAI semantic layer (MDL assembly / validate / publish, specs/010 M2) ----
  # Requires the `wren` CLI: pip install 'wrenai[mysql,mcp]' 'mcp<2' (Python >= 3.11).
  # The default `wren` is auto-probed at ~/.local/bin, /usr/local/bin, /usr/bin and
  # then PATH — Linux deployments work without config after a pip install; on Windows
  # point `executable` at the venv wren.exe. Generated projects live under
  # mdl-home/<groupId>/ (project staging + published snapshot + mdl.json).
  wren:
    executable: ${DATAAGENT_WREN_EXECUTABLE:wren}
    # Blank = ~/.agentscope/dataagent/mdl (runtime store, outside the project tree).
    mdl-home: ${DATAAGENT_WREN_MDL_HOME:}
    # Connection profile used by the M3 runtime (serve mcp); local validate/build
    # compile the project offline and do NOT require a registered profile.
    profile: ${DATAAGENT_WREN_PROFILE:dataagent}
    # Dialect recorded in wren_project.yml and passed to `wren utils parse-types -d`.
    data-source: ${DATAAGENT_WREN_DATA_SOURCE:mysql}
    # Per-command timeout for wren subprocesses (validate / build / parse-types).
    timeout-seconds: ${DATAAGENT_WREN_TIMEOUT_SECONDS:180}
    # Idle seconds after which a per-group `wren serve mcp` instance is closed by the reaper
    # (specs/010 M3); a later query respawns it on demand.
    instance-idle-seconds: ${DATAAGENT_WREN_INSTANCE_IDLE_SECONDS:1800}
    # MCP instance budget and per-knowledge-base gate wait; ordinary CLI calls are separate.
    max-instances: 16
    call-wait-seconds: 30
    # Official wren skills root (specs/022, ADR 0035): the skills_content directory bundled
    # inside the wrenai pip package, mounted natively onto modeling-agent via the harness skill
    # repository. Blank = inferred from the resolved executable location; set it only when the
    # package layout is non-standard. Missing directory → warn + CLI fallback, startup unaffected.
    skills-dir: ${DATAAGENT_WREN_SKILLS_DIR:}

  # ---- Expose the platform metadata DB as a queryable source? Off by default. ----
  expose-app-db: ${DATAAGENT_EXPOSE_APP_DB:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # show-details: never — the public /actuator/health endpoint returns
      # status only (UP/DOWN). Component-level health is available to admins
      # under /api/admin/runtime/* without leaking dependency hostnames.
      show-details: never

logging:
  level:
    root: INFO
    io.agentscope: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
