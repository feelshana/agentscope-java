<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="红海 DataAgent：连接数据源与知识文档，用自然语言完成查询、分析与可视化。" />
    <meta property="og:title" content="红海 DataAgent" />
    <meta property="og:description" content="连接数据源与知识文档，用自然语言完成查询、分析与可视化。" />
    <meta property="og:type" content="website" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/src/assets/brand-mark.svg"
    />
    <title>红海 DataAgent</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { scroll-behavior: smooth; }
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #f7f7f8; color: #18181b; min-height: 100dvh; }
      #root { min-height: 100dvh; }
      /* Keep the same first paint until React mounts the page or an actionable error. */
      #root:empty { display: none; }
      #root:not(:empty) + .app-opening { display: none; }
      .app-opening {
        min-height: 100dvh; display: grid; place-content: center; justify-items: center;
        gap: 18px; background: #fff; font: 15px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      .app-opening p { display: flex; align-items: center; gap: 9px; color: #576074; }
      .app-opening strong { font-weight: 600; color: #172032; }
      .app-opening p::before {
        content: ""; width: 16px; height: 16px; border-radius: 50%;
        border: 2px solid #e8e5f5; border-top-color: #6954db; border-right-color: #6954db;
        animation: app-opening-spin .9s linear infinite;
      }
      @keyframes app-opening-spin { to { transform: rotate(1turn); } }
      @media (prefers-reduced-motion: reduce) { .app-opening p::before { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <main class="app-opening" role="status">
      <img src="/src/assets/brand-mark.svg?inline" width="42" height="50" alt="">
      <p><span>正在打开<strong>红海 DataAgent</strong> …</span></p>
    </main>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
